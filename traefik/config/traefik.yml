# Traefik static configuration. Loaded from the default search path
# (/etc/traefik/traefik.yml) so the `traefik healthcheck` subcommand finds it
# too. Routing lives in the file provider (config/dynamic.yml) — no Docker
# socket is mounted, so the same config runs identically under compose, rootless
# podman, and the Quadlet deployment.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
  # Internal entrypoint for /ping — never published to the host.
  traefik:
    address: ":8080"

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
  insecure: false

log:
  level: INFO
  format: json

accessLog:
  format: json
