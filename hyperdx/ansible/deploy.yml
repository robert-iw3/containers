---
# Deploy the HyperDX SSO stack: traefik TLS and a tinyauth gate in front of
# HyperDX. Runs the same compose file uat/run-uat.sh validates.
#
#   ansible-playbook -i inventory.ini deploy.yml
- name: Deploy the HyperDX SSO stack
  hosts: hyperdx
  gather_facts: false
  vars:
    stack_dir: "{{ (playbook_dir ~ '/../sso') | realpath }}"
  tasks:
    - name: Verify podman-compose is available
      ansible.builtin.command: podman-compose --version
      changed_when: false

    - name: Check for an existing .env file
      ansible.builtin.stat:
        path: "{{ stack_dir }}/.env"
      register: env_file

    - name: Seed .env from .env.example on first run
      ansible.builtin.copy:
        src: "{{ stack_dir }}/.env.example"
        dest: "{{ stack_dir }}/.env"
        mode: "0600"
        force: false
        remote_src: true
      when: not env_file.stat.exists

    - name: Fail when .env still holds placeholders
      ansible.builtin.command: grep -c CHANGE_ME .env
      args:
        chdir: "{{ stack_dir }}"
      register: placeholders
      changed_when: false
      failed_when: placeholders.stdout | int > 0

    - name: Bring up the gateway
      ansible.builtin.command: podman-compose up -d --no-recreate tinyauth traefik
      args:
        chdir: "{{ stack_dir }}"
      register: gw_up
      changed_when: "'done' in (gw_up.stderr | default(''))"

    - name: Bring up HyperDX
      ansible.builtin.command: podman-compose up -d --no-recreate hyperdx
      args:
        chdir: "{{ stack_dir }}"
      register: app_up
      changed_when: "'done' in (app_up.stderr | default(''))"

    - name: Wait for HyperDX to report healthy
      ansible.builtin.command: podman exec hyperdx-sso curl -sf http://localhost:8080/api/health
      register: hx_health
      until: hx_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false
