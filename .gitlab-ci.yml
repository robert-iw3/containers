---
# CI/CD variables required (Settings > CI/CD > Variables):
#   GHCR_NAMESPACE - GitHub owner/repo namespace to publish under, e.g. "robert-iw3/containers"
#   GHCR_USERNAME  - GitHub username to authenticate with
#   GHCR_TOKEN     - GitHub PAT (classic) with `write:packages` scope
#     GitLab has no built-in equivalent of GitHub Actions' automatic GITHUB_TOKEN for ghcr.io,
#     so a real GitHub PAT must be supplied for the push step to work.
#
# Trigger a full rebuild of every Dockerfile (not just changed ones) by running this
# pipeline manually with the BUILD_ALL variable set to "true".

stages:
  - validate
  - discover
  - build

variables:
  GHCR_REGISTRY: "ghcr.io"
  GIT_DEPTH: "0"

static-validate:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install -r tests/requirements.txt
    - pip install -r nomad/tests/requirements.txt
    - python -m pytest tests/ nomad/tests/ -q

nomad-terraform-validate:
  stage: validate
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t nomad-tofu-tests -f nomad/tests/Dockerfile nomad
    - docker run --rm nomad-tofu-tests

# Requires a privileged runner (nested containers with systemd).
nomad-molecule:
  stage: validate
  image: quay.io/podman/stable:latest
  parallel:
    matrix:
      - ROLE: [nomad, monitoring]
  before_script:
    - dnf install -y python3-pip
    - pip3 install molecule "molecule-plugins[podman]" ansible-core
    - ansible-galaxy collection install containers.podman ansible.posix community.general
  script:
    - cd nomad/ansible/roles/$ROLE
    - molecule test

discover:
  stage: discover
  image: alpine:3.24
  before_script:
    - apk add --no-cache git python3 bash
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=50 || true
        FILES=$(git diff --name-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" -- '*Dockerfile*' 2>/dev/null || true)
      elif [ "$BUILD_ALL" = "true" ]; then
        FILES=$(find . -type f -iname 'Dockerfile*' -not -path './.git/*' | sed 's#^\./##')
      else
        if [ -z "$CI_COMMIT_BEFORE_SHA" ] || [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
          FILES=$(find . -type f -iname 'Dockerfile*' -not -path './.git/*' | sed 's#^\./##')
        else
          FILES=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" -- '*Dockerfile*' 2>/dev/null || true)
        fi
      fi
      python3 .gitlab/generate-pipeline.py $FILES > generated-pipeline.yml
    - cat generated-pipeline.yml
  artifacts:
    paths:
      - generated-pipeline.yml
    expire_in: 1 hour

trigger-build:
  stage: build
  trigger:
    include:
      - artifact: generated-pipeline.yml
        job: discover
    strategy: depend
  needs:
    - discover
