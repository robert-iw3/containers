---
# CI/CD variables required (Settings > CI/CD > Variables):
#   GHCR_NAMESPACE - GitHub owner/repo namespace to publish under, e.g. "robert-iw3/containers"
#   GHCR_USERNAME  - GitHub username to authenticate with
#   GHCR_TOKEN     - GitHub PAT (classic) with `write:packages` scope
#     GitLab has no built-in equivalent of GitHub Actions' automatic GITHUB_TOKEN for ghcr.io,
#     so a real GitHub PAT must be supplied for the push step to work.
#
# By default the pipeline builds the images declared in ci/build.yaml (an empty
# manifest builds nothing). Override on a manual run with BUILD_PATHS to build a
# chosen subset (comma-separated globs or dirs, e.g. "elastic/data-pipeline/*,elastic/apm-server"),
# BUILD_ALL="true" to rebuild every Dockerfile, or BUILD_CHANGED="true" to build
# only Dockerfiles whose build context changed.

stages:
  - validate
  - discover
  - build

variables:
  GHCR_REGISTRY: "ghcr.io"
  GIT_DEPTH: "0"

static-validate:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install -r tests/requirements.txt
    - pip install -r nomad/tests/requirements.txt
    - python -m pytest tests/ nomad/tests/ -q

nomad-terraform-validate:
  stage: validate
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t nomad-tofu-tests -f nomad/tests/Dockerfile nomad
    - docker run --rm nomad-tofu-tests

# Requires a privileged runner (nested containers with systemd).
nomad-molecule:
  stage: validate
  image: quay.io/podman/stable:latest
  parallel:
    matrix:
      - ROLE: [nomad, monitoring]
  before_script:
    - dnf install -y python3-pip
    - pip3 install molecule "molecule-plugins[podman]" ansible-core
    - ansible-galaxy collection install containers.podman ansible.posix community.general
  script:
    - cd nomad/ansible/roles/$ROLE
    - molecule test

discover:
  stage: discover
  image: alpine:3.24
  before_script:
    - apk add --no-cache git python3 py3-yaml bash
  script:
    - |
      # Default: build what ci/build.yaml declares (empty manifest -> nothing).
      # Override with BUILD_PATHS / BUILD_ALL / BUILD_CHANGED variables.
      MODE=manifest
      ITEMS=""
      if [ -n "${BUILD_PATHS:-}" ]; then
        MODE=paths
        ITEMS=$(echo "$BUILD_PATHS" | tr ',' ' ')
      elif [ "${BUILD_ALL:-}" = "true" ]; then
        MODE=all
      elif [ "${BUILD_CHANGED:-}" = "true" ]; then
        MODE=changed
        if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
          git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=50 || true
          ITEMS=$(git diff --name-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" 2>/dev/null || true)
        elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
          ITEMS=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" 2>/dev/null || true)
        fi
      fi
      python3 .gitlab/generate-pipeline.py "$MODE" $ITEMS > generated-pipeline.yml
    - cat generated-pipeline.yml
  artifacts:
    paths:
      - generated-pipeline.yml
    expire_in: 1 hour

trigger-build:
  stage: build
  trigger:
    include:
      - artifact: generated-pipeline.yml
        job: discover
    strategy: depend
  needs:
    - discover
