clusterName=standalone

# MQTT via MoP (Message-on-Pulsar) is opt-in: it requires the MoP .nar to be
# present in ./protocols (see protocols/protocols.md). Uncomment these three
# lines after placing the .nar, otherwise the broker fails to start because the
# protocol handler cannot be loaded.
# messagingProtocols=mqtt
# protocolHandlerDirectory=/pulsar/protocols
# mqttListeners=mqtt://0.0.0.0:1883

advertisedAddress=127.0.0.1

managedLedgerDefaultEnsembleSize=1
managedLedgerDefaultWriteQuorum=1
managedLedgerDefaultAckQuorum=1
