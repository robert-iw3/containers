name: log-pipeline

networks:
  log-pipeline-net:
    driver: bridge

volumes:
  kafka-data:
  es-data:
  grafana-data:
  airflow-data:
  spark-ivy-cache:

services:
  kafka:
    image: docker.io/apache/kafka:4.3.1
    hostname: kafka
    container_name: log-pipeline-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 07SdCJ0NQsaTgGE6hvSn9Q
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - log-pipeline-net

  kafka-init:
    image: docker.io/apache/kafka:4.3.1
    container_name: log-pipeline-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-app-logs} \
          --partitions ${KAFKA_PARTITIONS:-3} \
          --replication-factor 1
    networks:
      - log-pipeline-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    hostname: elasticsearch
    container_name: log-pipeline-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - log-pipeline-net

  es-init:
    image: docker.io/curlimages/curl:8.21.0
    container_name: log-pipeline-es-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_URL: http://elasticsearch:9200
    entrypoint: ["/bin/sh", "/scripts/init-templates.sh"]
    volumes:
      - ./elasticsearch/init-templates.sh:/scripts/init-templates.sh:ro
    networks:
      - log-pipeline-net

  log-generator:
    build: ./log-generator
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-app-logs}
      LOG_RATE_PER_SEC: ${LOG_RATE_PER_SEC:-20}
      SERVICE_NAMES: ${SERVICE_NAMES:-checkout,inventory,payments,shipping,auth,search}
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - log-pipeline-net

  spark-master:
    image: docker.io/apache/spark:4.1.2-python3
    hostname: spark-master
    container_name: log-pipeline-spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - log-pipeline-net

  spark-worker:
    image: docker.io/apache/spark:4.1.2-python3
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2560M
    networks:
      - log-pipeline-net

  spark-submit:
    image: docker.io/apache/spark:4.1.2-python3
    container_name: log-pipeline-spark-submit
    restart: on-failure
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      es-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-app-logs}
      ES_NODES: elasticsearch
      ES_PORT: "9200"
      ES_RAW_INDEX: ${ES_RAW_INDEX:-logs-raw}
      ES_METRICS_INDEX: ${ES_METRICS_INDEX:-logs-metrics-1m}
    volumes:
      - ./spark-streaming/stream_job.py:/opt/app/stream_job.py:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "spark://spark-master:7077"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2,org.elasticsearch:elasticsearch-spark-30_2.13:9.0.3"
      - "--conf"
      - "spark.driver.host=spark-submit"
      - "/opt/app/stream_job.py"
    networks:
      - log-pipeline-net

  airflow:
    build: ./airflow
    hostname: airflow
    container_name: log-pipeline-airflow
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      ES_HOST: http://elasticsearch:9200
      ES_RAW_INDEX: ${ES_RAW_INDEX:-logs-raw}
      ES_METRICS_INDEX: ${ES_METRICS_INDEX:-logs-metrics-1m}
      ES_SUMMARY_INDEX: ${ES_SUMMARY_INDEX:-logs-daily-summary}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-data:/opt/airflow
    ports:
      - "8081:8080"
    command: ["standalone"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - log-pipeline-net

  grafana:
    image: docker.io/grafana/grafana-oss:13.0.2
    hostname: grafana
    container_name: log-pipeline-grafana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - log-pipeline-net
