<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00CA8E"/>
    </marker>
    <marker id="ah-broker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CA2171"/>
    </marker>
    <marker id="ah-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F05A28"/>
    </marker>
    <marker id="ah-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1DAEFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#16161B"/>
  <text x="700" y="40" fill="#FFFFFF" font-size="23" font-weight="600" text-anchor="middle">HashiCorp Stack — remote access: workstation → bastion tunnel → Boundary only</text>
  <text x="700" y="64" fill="#8A8A93" font-size="12" text-anchor="middle">The workstation is never on the internal network. Its reach stops at Boundary; everything else is unreachable (no exfiltration path).</text>

  <!-- ============ zone backdrops ============ -->
  <rect x="30" y="95" width="300" height="740" rx="10" fill="#0B0B0C" stroke="#4A4A52" stroke-width="1.5"/>
  <text x="180" y="120" fill="#8A8A93" font-size="13" font-weight="600" text-anchor="middle">INTERNET (untrusted)</text>

  <rect x="380" y="95" width="360" height="740" rx="10" fill="#0B0B0C" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="560" y="120" fill="#00CA8E" font-size="13" font-weight="600" text-anchor="middle">BASTION / DMZ (public + internal)</text>

  <rect x="790" y="95" width="580" height="740" rx="10" fill="#0B0B0C" stroke="#4A4A52" stroke-width="1.5"/>
  <text x="1080" y="120" fill="#8A8A93" font-size="13" font-weight="600" text-anchor="middle">INTERNAL NETWORK (never reachable from the workstation)</text>

  <!-- ============ workstation ============ -->
  <rect x="70" y="300" width="220" height="150" rx="8" fill="#25252B" stroke="#4A4A52" stroke-width="1.5"/>
  <text x="180" y="328" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Developer workstation</text>
  <text x="180" y="349" fill="#8A8A93" font-size="11" text-anchor="middle">Linux / macOS / Windows</text>
  <rect x="90" y="362" width="180" height="30" rx="5" fill="#16161B" stroke="#00CA8E" stroke-width="1"/>
  <text x="180" y="382" fill="#EAEAEA" font-size="11" text-anchor="middle">tailscale node (userspace)</text>
  <rect x="90" y="398" width="180" height="30" rx="5" fill="#16161B" stroke="#1DAEFF" stroke-width="1"/>
  <text x="180" y="418" fill="#EAEAEA" font-size="11" text-anchor="middle">SOCKS5 :1055 → localhost:9200</text>

  <!-- ============ bastion components ============ -->
  <rect x="410" y="150" width="300" height="60" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="560" y="176" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">headscale — control plane</text>
  <text x="560" y="196" fill="#8A8A93" font-size="10.5" text-anchor="middle">deny-by-default policy · embedded DERP relay · :8080</text>

  <rect x="410" y="300" width="300" height="150" rx="8" fill="#25252B" stroke="#CA2171" stroke-width="1.5"/>
  <text x="560" y="328" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">bastion node + broker</text>
  <text x="560" y="349" fill="#8A8A93" font-size="11" text-anchor="middle">tailnet 100.64.0.1 (shared netns)</text>
  <rect x="430" y="362" width="260" height="30" rx="5" fill="#16161B" stroke="#CA2171" stroke-width="1"/>
  <text x="560" y="382" fill="#EAEAEA" font-size="11" text-anchor="middle">socat :9200 → boundary:9200  (allow-list)</text>
  <rect x="430" y="398" width="260" height="30" rx="5" fill="#16161B" stroke="#F05A28" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="560" y="418" fill="#8A8A93" font-size="10.5" text-anchor="middle">no forwarder for anything else</text>

  <rect x="410" y="520" width="300" height="60" rx="8" fill="#25252B" stroke="#FFEC6E" stroke-width="1.5"/>
  <text x="560" y="546" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">CoreDNS — secure DNS</text>
  <text x="560" y="566" fill="#8A8A93" font-size="10.5" text-anchor="middle">DoT upstream (Quad9) · internal names · bastion-only</text>

  <!-- ============ internal services ============ -->
  <rect x="830" y="300" width="220" height="150" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="940" y="330" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Boundary</text>
  <text x="940" y="351" fill="#8A8A93" font-size="11" text-anchor="middle">controller + worker</text>
  <text x="940" y="372" fill="#8A8A93" font-size="10.5" text-anchor="middle">:9200 API · :9202 proxy</text>
  <text x="940" y="398" fill="#00CA8E" font-size="10.5" text-anchor="middle">the reach STOPS here —</text>
  <text x="940" y="414" fill="#8A8A93" font-size="10.5" text-anchor="middle">Boundary brokers deeper access itself</text>

  <rect x="1110" y="180" width="210" height="70" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1215" y="210" fill="#EAEAEA" font-size="13" text-anchor="middle">Vault</text>
  <text x="1215" y="230" fill="#8A8A93" font-size="10.5" text-anchor="middle">dynamic DB creds</text>

  <rect x="1110" y="340" width="210" height="70" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1215" y="370" fill="#EAEAEA" font-size="13" text-anchor="middle">PostgreSQL</text>
  <text x="1215" y="390" fill="#8A8A93" font-size="10.5" text-anchor="middle">app database</text>

  <rect x="1110" y="500" width="210" height="70" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1215" y="530" fill="#EAEAEA" font-size="13" text-anchor="middle">Consul</text>
  <text x="1215" y="550" fill="#8A8A93" font-size="10.5" text-anchor="middle">mesh + catalog</text>

  <!-- ============ flows ============ -->
  <!-- workstation -> headscale (control) -->
  <path d="M270,372 C330,372 360,180 408,180" fill="none" stroke="#00CA8E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-allow)"/>
  <text x="345" y="250" fill="#00CA8E" font-size="10" text-anchor="middle">register / policy</text>

  <!-- workstation -> bastion node (encrypted tunnel) -->
  <path d="M290,388 C340,388 360,377 408,377" fill="none" stroke="#00CA8E" stroke-width="2.4" marker-end="url(#ah-allow)"/>
  <text x="350" y="368" fill="#00CA8E" font-size="10.5" font-weight="600" text-anchor="middle">WireGuard tunnel</text>

  <!-- broker -> boundary (allowed) -->
  <path d="M712,377 C770,377 790,375 828,375" fill="none" stroke="#CA2171" stroke-width="2.4" marker-end="url(#ah-broker)"/>
  <text x="770" y="366" fill="#CA2171" font-size="10.5" font-weight="600" text-anchor="middle">brokered :9200/:9202</text>

  <!-- coredns -> broker (name resolution) -->
  <path d="M560,518 L560,452" fill="none" stroke="#FFEC6E" stroke-width="1.6" marker-end="url(#ah-data)"/>
  <text x="620" y="490" fill="#FFEC6E" font-size="10" text-anchor="middle">resolve target</text>

  <!-- boundary -> vault/pg/consul (boundary's own brokering) -->
  <path d="M1050,340 C1085,300 1090,270 1108,250" fill="none" stroke="#1DAEFF" stroke-width="1.6" marker-end="url(#ah-data)"/>
  <path d="M1050,375 L1108,375" fill="none" stroke="#1DAEFF" stroke-width="1.6" marker-end="url(#ah-data)"/>
  <path d="M1050,410 C1085,450 1090,500 1108,525" fill="none" stroke="#1DAEFF" stroke-width="1.6" marker-end="url(#ah-data)"/>
  <text x="1080" y="300" fill="#1DAEFF" font-size="10" text-anchor="middle">Boundary → dynamic-cred sessions</text>

  <!-- DENIED: workstation -> internal directly -->
  <path d="M290,420 C620,760 900,700 1108,560" fill="none" stroke="#F05A28" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-deny)"/>
  <circle cx="700" cy="726" r="15" fill="#16161B" stroke="#F05A28" stroke-width="2"/>
  <path d="M691,717 L709,735 M709,717 L691,735" stroke="#F05A28" stroke-width="2.2"/>
  <text x="700" y="762" fill="#F05A28" font-size="11" font-weight="600" text-anchor="middle">DENIED — no route, no broker, ACL block</text>

  <!-- legend -->
  <rect x="70" y="500" width="220" height="150" rx="8" fill="#25252B" stroke="#4A4A52" stroke-width="1"/>
  <text x="82" y="522" fill="#EAEAEA" font-size="11" font-weight="600">Legend</text>
  <line x1="82" y1="540" x2="122" y2="540" stroke="#00CA8E" stroke-width="2.4"/><text x="130" y="544" fill="#8A8A93" font-size="10">encrypted tunnel (allowed)</text>
  <line x1="82" y1="562" x2="122" y2="562" stroke="#CA2171" stroke-width="2.4"/><text x="130" y="566" fill="#8A8A93" font-size="10">bastion broker forward</text>
  <line x1="82" y1="584" x2="122" y2="584" stroke="#1DAEFF" stroke-width="1.6"/><text x="130" y="588" fill="#8A8A93" font-size="10">internal data flow</text>
  <line x1="82" y1="606" x2="122" y2="606" stroke="#FFEC6E" stroke-width="1.6"/><text x="130" y="610" fill="#8A8A93" font-size="10">secure DNS</text>
  <line x1="82" y1="628" x2="122" y2="628" stroke="#F05A28" stroke-width="2" stroke-dasharray="7 5"/><text x="130" y="632" fill="#8A8A93" font-size="10">blocked / no path</text>
</svg>
