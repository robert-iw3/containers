x-common-vars-apps: &common-vars-apps
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  env_file:
    - ../.env
  networks:
    - elastic

services:
  curator:
    <<: *common-vars-apps
    build:
      context: .
    init: true
    volumes:
      - ./config/curator.yml:/.curator/curator.yml:ro,Z
      - ./config/delete_log_files_curator.yml:/.curator/delete_log_files_curator.yml:ro,Z
      - certs:/certs:ro,z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}

networks:
  elastic:
    external: true
    name: ${STACK_NETWORK:-elastic_elastic}

volumes:
  certs:
    external: true
    name: ${STACK_CERTS:-elastic_certs}
