apiVersion: apps/v1
kind: Deployment
metadata:
  name: parquet-elastic
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parquet-elastic
  template:
    metadata:
      labels:
        app: parquet-elastic
    spec:
      containers:
      - name: parquet-elastic
        image: parquet-connector:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SCHEMAS_FILE
          value: "/app/schemas.yaml"
        - name: STATE_PATH
          value: "/app/state.db"
        - name: ES_HOST
          value: "http://elasticsearch:9200"
        - name: ES_INDEX
          value: "parquet-logs"
        - name: ES_AUTH
          value: ""
        - name: BATCH_SIZE
          value: "100"
        - name: BUFFER_TIMEOUT
          value: "30"
        - name: WORKER_COUNT
          value: "4"
        - name: POLL_INTERVAL
          value: "30"
        - name: DATA_DIR
          value: "/data"
        - name: INCREMENTAL_ENABLED
          value: "true"
        - name: MAX_FILES_CONCURRENT
          value: "5"
        - name: MAX_MEMORY_MB
          value: "512"
        - name: METRICS_PORT
          value: "9090"
        - name: SQLCIPHER_KEY
          value: "your-sqlcipher-key"
        - name: RUST_LOG
          value: "info"
        - name: PYTHON_LOGGING_LEVEL
          value: "INFO"
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        hostPath:
          path: /data