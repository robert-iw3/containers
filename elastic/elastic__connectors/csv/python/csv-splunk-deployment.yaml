apiVersion: apps/v1
kind: Deployment
metadata:
  name: csv-splunk
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csv-splunk
  template:
    metadata:
      labels:
        app: csv-splunk
    spec:
      containers:
      - name: csv-splunk
        image: csv-connector:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CSV_LOG_DIR
          value: "/var/log/csv_data"
        - name: SCHEMAS_FILE
          value: "/app/schemas.yaml"
        - name: SPLUNK_HEC_URL
          value: "https://splunk:8088/services/collector"
        - name: SPLUNK_TOKEN
          value: "your-splunk-hec-token"
        - name: BATCH_SIZE
          value: "100"
        - name: BUFFER_TIMEOUT
          value: "30"
        - name: WORKER_COUNT
          value: "4"
        - name: ENABLE_SPLUNK
          value: "true"
        - name: CSV_DELIMITER
          value: ","
        volumeMounts:
        - name: csv-logs
          mountPath: /var/log/csv_data
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          exec:
            command: ["pidof", "python3"]
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["pidof", "python3"]
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: csv-logs
        persistentVolumeClaim:
          claimName: csv-logs