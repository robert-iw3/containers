# JSON application logs over TCP 50000: parse JSON, split a structured prefix
# with dissect, normalise log level, and compute a fingerprint used as the
# document _id so re-sent events de-duplicate. This writes to a classic index
# (app-logs-*) because data streams are append-only and do not take a custom _id.
input {
  tcp { port => 50000 codec => json_lines }
}

filter {
  dissect {
    mapping => { "log" => "[%{ts}] %{level} %{+msg} %{+msg}" }
  }
  mutate {
    lowercase => [ "level" ]
  }
  translate {
    source => "level"
    target => "[log][level]"
    dictionary => {
      "warn"  => "warning"
      "err"   => "error"
      "crit"  => "critical"
    }
    fallback => "%{level}"
  }
  fingerprint {
    source => [ "ts", "msg" ]
    target => "[@metadata][fingerprint]"
    method => "SHA256"
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:-}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    index => "app-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
