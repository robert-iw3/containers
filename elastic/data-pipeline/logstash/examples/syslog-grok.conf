# Syslog over UDP/TCP 5140, parsed with grok into structured ECS-ish fields
# and routed to the logs-syslog-default data stream.
input {
  udp { port => 5140 type => "syslog" }
  tcp { port => 5140 type => "syslog" }
}

filter {
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:host} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      add_field => { "[data_stream][dataset]" => "syslog" }
    }
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM d HH:mm:ss", "ISO8601" ]
    }
    syslog_pri { }
    mutate {
      remove_field => [ "syslog_timestamp", "syslog_pri" ]
      add_field => { "[data_stream][namespace]" => "default" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:-}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    data_stream => true
    data_stream_auto_routing => true
  }
}
