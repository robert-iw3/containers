# Nginx access logs (Filebeat -> Logstash:5044): grok the combined log format,
# enrich with GeoIP and user-agent parsing, drop health-check noise, and route
# to logs-nginx.access-default.
input {
  beats { port => 5044 }
}

filter {
  if [event][module] == "nginx" or [fileset][name] == "access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      remove_field => [ "timestamp" ]
    }
    geoip {
      source => "clientip"
      target => "[source][geo]"
    }
    useragent {
      source => "agent"
      target => "[user_agent]"
    }
    mutate {
      convert => { "response" => "integer" "bytes" => "integer" }
      add_field => { "[data_stream][dataset]" => "nginx.access" }
    }
    if [request] == "/health" or [request] == "/ping" {
      drop { }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD:-}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    data_stream => true
    data_stream_auto_routing => true
  }
}
