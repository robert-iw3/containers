# Accept events over HTTP (POST http://host:9880/es.web) and Docker/forward
# protocol, useful for application SDKs and container log drivers.
<source>
  @type http
  bind 0.0.0.0
  port 9880
  <parse>
    @type json
  </parse>
</source>

<filter es.**>
  @type record_modifier
  <record>
    dataset "${tag_parts[1]}"
  </record>
</filter>
