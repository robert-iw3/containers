# Syslog over UDP 5140 parsed into structured fields with the grok parser,
# then tagged es.syslog so it ships to Elasticsearch.
<source>
  @type syslog
  bind 0.0.0.0
  port 5140
  tag es.syslog
  <parse>
    @type grok
    <grok>
      pattern %{SYSLOGTIMESTAMP:time} %{SYSLOGHOST:host} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:message}
    </grok>
  </parse>
</source>

<filter es.syslog>
  @type record_modifier
  <record>
    dataset syslog
  </record>
</filter>
