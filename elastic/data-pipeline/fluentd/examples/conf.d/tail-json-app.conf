# Tail a JSON application log file, parse each line as JSON, and stamp the host.
# The position file lets fluentd resume after a restart.
<source>
  @type tail
  path /var/log/app/*.log
  pos_file /fluentd/log/app.pos
  tag es.app
  read_from_head true
  <parse>
    @type json
    time_key ts
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

<filter es.app>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    dataset app
  </record>
</filter>
