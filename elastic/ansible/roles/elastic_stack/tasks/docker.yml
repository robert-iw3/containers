---
# Render the compose from stack.config.yml via gen_stack.py (config-driven topology).
- name: Copy the config-driven stack generator + config
  copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ project_dir }}/{{ item }}"
  loop:
    - gen_stack.py
    - stack.config.yml

- name: Render compose from stack.config.yml (any topology)
  command: "python3 {{ project_dir }}/gen_stack.py {{ project_dir }}/stack.config.yml"
  register: rendered_compose
  changed_when: true

- name: Write generated compose
  copy:
    content: "{{ rendered_compose.stdout }}"
    dest: "{{ project_dir }}/docker-compose-rendered.yml"

- name: Start Docker stack
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    files: [docker-compose-rendered.yml]
    state: present
