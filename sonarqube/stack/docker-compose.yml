# Full-stack SonarQube environment with Keycloak single sign-on.
#
#   browser ─TLS→ traefik ─┬─ forwardAuth → tinyauth ──OIDC──→ keycloak
#                          ├──→ sonarqube (header SSO)
#                          └──→ keycloak (login UI)
#
# tinyauth is the policy enforcement point and an OIDC relying party for
# Keycloak; SonarQube signs the user in from the Remote-User header traefik
# sets from tinyauth's decision. Each application has its own tuned,
# SCRAM-authenticated PostgreSQL; a sidecar backs both up with pg_dump.
#
# Issuer host consistency: everything is published on one host:port
# (127.0.0.1:${TLS_PORT} → traefik :8443, with TLS_PORT == 8443) so the
# Keycloak issuer URL is identical for the browser and for tinyauth's
# back-channel. tinyauth resolves that host to traefik via extra_hosts and
# trusts the stack CA via SSL_CERT_FILE.
#
# Settings come from .env (see .env.example); tinyauth's client secret from
# tinyauth.env. Both, plus the rendered Keycloak realm and TLS material, are
# produced by scripts/render.sh (or generated by uat/run-uat.sh).
---
networks:
  sonar-stack:
    name: ${COMPOSE_NET_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_SUBNET}

volumes:
  keycloak-db-data:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-backups:

x-app: &app
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-postgres: &postgres
  <<: *app
  image: docker.io/postgres:17.10-alpine
  # Tuned + SCRAM-secured configuration, shared by both databases.
  command:
    - postgres
    - -c
    - config_file=/etc/postgresql/postgresql.conf
    - -c
    - hba_file=/etc/postgresql/pg_hba.conf

services:
  # --- Reverse proxy -----------------------------------------------------
  traefik:
    <<: *app
    image: docker.io/traefik:v3.7.8
    container_name: traefik-sonar-stack
    command:
      - --api.insecure=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - "--providers.docker.constraints=Label(`sso.stack`,`sonar-stack`)"
      - --providers.docker.network=${COMPOSE_NET_NAME}
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.address=:8443
      - --entrypoints.websecure.http.tls=true
    ports:
      - "${BIND_ADDR}:${TLS_PORT}:8443"
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock:ro
      - ${TLS_DIR}:/etc/tls:ro,z
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro,z
    networks:
      sonar-stack:
        ipv4_address: ${TRAEFIK_IP}
    depends_on:
      - keycloak
      - tinyauth

  # --- Identity provider -------------------------------------------------
  keycloak-db:
    <<: *postgres
    container_name: keycloak-db-sonar-stack
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data:Z
      - ./postgres:/etc/postgresql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sonar-stack

  keycloak:
    <<: *app
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-sonar-stack
    command: ["start", "--import-realm"]
    environment:
      # Public issuer — identical for the browser and tinyauth's backchannel.
      KC_HOSTNAME: https://${KEYCLOAK_HOST}:${TLS_PORT}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-sonar.json:/opt/keycloak/data/import/realm-sonar.json:ro,z
    depends_on:
      keycloak-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "sso.stack=sonar-stack"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOST}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.middlewares=secure-headers@file"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - sonar-stack

  # --- SSO gateway (Keycloak relying party) ------------------------------
  tinyauth:
    <<: *app
    image: ghcr.io/steveiliop56/tinyauth:v3.6.2
    container_name: tinyauth-sonar-stack
    env_file:
      - path: tinyauth.env
        required: true
    environment:
      PORT: 3000
      ADDRESS: 0.0.0.0
      SECRET: ${TINYAUTH_SECRET}
      APP_URL: https://${AUTH_HOST}:${TLS_PORT}
      COOKIE_SECURE: "true"
      APP_TITLE: SonarQube SSO
      # Federate to Keycloak; send users straight to it (no local chooser).
      OAUTH_AUTO_REDIRECT: generic
      GENERIC_NAME: Keycloak
      GENERIC_SCOPES: openid email profile
      GENERIC_AUTH_URL: https://${KEYCLOAK_HOST}:${TLS_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      GENERIC_TOKEN_URL: https://${KEYCLOAK_HOST}:${TLS_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      GENERIC_USER_URL: https://${KEYCLOAK_HOST}:${TLS_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      # Reach the public issuer host over the proxy, trusting the stack CA
      # (Go honours SSL_CERT_FILE) rather than disabling verification.
      SSL_CERT_FILE: /certs/ca.crt
    extra_hosts:
      - "${KEYCLOAK_HOST}:${TRAEFIK_IP}"
    volumes:
      - ${TLS_DIR}/ca.crt:/certs/ca.crt:ro,z
    depends_on:
      - keycloak
    labels:
      - "traefik.enable=true"
      - "sso.stack=sonar-stack"
      - "traefik.http.routers.tinyauth.rule=Host(`${AUTH_HOST}`)"
      - "traefik.http.routers.tinyauth.entrypoints=websecure"
      - "traefik.http.routers.tinyauth.tls=true"
      - "traefik.http.routers.tinyauth.middlewares=secure-headers@file"
      - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"
    networks:
      - sonar-stack

  # --- Application -------------------------------------------------------
  sonar-db:
    <<: *postgres
    container_name: sonar-db-sonar-stack
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data:Z
      - ./postgres:/etc/postgresql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sonar-stack

  sonarqube:
    <<: *app
    image: docker.io/sonarqube:26.7.0.124771-community
    container_name: sonarqube-sonar-stack
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_WEB_PORT: "9000"
      SONAR_CORE_SERVERBASEURL: https://${APP_HOST}:${TLS_PORT}
      # Sign the user in from the header traefik set from tinyauth's Keycloak
      # decision. Reachable only through traefik (no host port); traefik
      # overwrites the Remote-* headers on every request.
      SONAR_WEB_SSO_ENABLE: "true"
      SONAR_WEB_SSO_LOGINHEADER: Remote-User
      SONAR_WEB_SSO_NAMEHEADER: Remote-Name
      SONAR_WEB_SSO_EMAILHEADER: Remote-Email
      SONAR_WEB_SSO_GROUPSHEADER: Remote-Groups
      SONAR_WEB_SSO_REFRESHINTERVALINMINUTES: "5"
    volumes:
      - sonar-data:/opt/sonarqube/data:Z
      - sonar-extensions:/opt/sonarqube/extensions:Z
      - sonar-logs:/opt/sonarqube/logs:Z
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "grep -Fq 'SonarQube is operational' /opt/sonarqube/logs/sonar.log"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "sso.stack=sonar-stack"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
      # Interactive: gated by tinyauth, client identity headers stripped.
      - "traefik.http.routers.sonarqube.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls=true"
      - "traefik.http.routers.sonarqube.priority=10"
      - "traefik.http.routers.sonarqube.middlewares=strip-identity@file,tinyauth@file,secure-headers@file"
      # Machine: scanner/CI calls presenting an Authorization token bypass the
      # interactive gate; identity headers stripped, SonarQube validates the
      # token. The browser's cookie-based /api XHR stays on the gated route.
      - "traefik.http.routers.sonarqube-token.rule=Host(`${APP_HOST}`) && (PathPrefix(`/api/`) || PathPrefix(`/batch/`)) && HeaderRegexp(`Authorization`, `(?i)^(bearer|basic) `)"
      - "traefik.http.routers.sonarqube-token.entrypoints=websecure"
      - "traefik.http.routers.sonarqube-token.tls=true"
      - "traefik.http.routers.sonarqube-token.priority=100"
      - "traefik.http.routers.sonarqube-token.middlewares=strip-identity@file,secure-headers@file"
      - "traefik.http.routers.sonarqube-token.service=sonarqube"
    networks:
      - sonar-stack

  # --- Backups -----------------------------------------------------------
  backups:
    <<: *app
    image: docker.io/postgres:17.10-alpine
    container_name: backups-sonar-stack
    environment:
      SONAR_DB_PASSWORD: ${SONAR_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        sleep 15m
        while true; do
          ts=$(date "+%Y-%m-%d_%H-%M")
          PGPASSWORD="$SONAR_DB_PASSWORD" pg_dump -h sonar-db -U sonar -d sonar \
            | gzip > /backups/sonar-$ts.sql.gz || { echo "sonar backup failed"; }
          PGPASSWORD="$KEYCLOAK_DB_PASSWORD" pg_dump -h keycloak-db -U keycloak -d keycloak \
            | gzip > /backups/keycloak-$ts.sql.gz || { echo "keycloak backup failed"; }
          find /backups -type f -mtime +7 -delete
          sleep 24h
        done
    volumes:
      - sonar-backups:/backups:Z
    depends_on:
      sonar-db:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy
    networks:
      - sonar-stack
