# Tuned + secured PostgreSQL configuration for the stack's databases.
# Sized for a container with ~2 GB RAM on SSD storage; adjust the memory
# figures proportionally to the host. Loaded via
#   postgres -c config_file=/etc/postgresql/postgresql.conf
# Unset parameters keep their PostgreSQL defaults.

# --- Connections ---------------------------------------------------------
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# --- Memory --------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 8MB
# Guard rails: cap total work_mem fan-out and keep hash spills predictable.
hash_mem_multiplier = 2.0

# --- Planner (SSD) -------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
jit = off

# --- WAL / checkpoints (durability + write smoothing) --------------------
wal_level = replica
wal_compression = on
synchronous_commit = on
full_page_writes = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
# Room for a future streaming replica / PITR without reconfiguring.
max_wal_senders = 5
archive_mode = off

# --- Autovacuum (longevity: fight bloat and wraparound early) ------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_insert_scale_factor = 0.05
vacuum_cost_delay = 2ms

# --- Session hygiene -----------------------------------------------------
idle_in_transaction_session_timeout = 300000   # 5 min
lock_timeout = 30000                           # 30 s

# --- Security ------------------------------------------------------------
password_encryption = scram-sha-256
# TLS is off here because the databases are reachable only on an internal,
# non-published container network. Enable it (and switch pg_hba to
# hostssl) when a database is exposed beyond that boundary:
#   ssl = on
#   ssl_cert_file = '/etc/postgresql/tls/server.crt'
#   ssl_key_file  = '/etc/postgresql/tls/server.key'

# --- Observability -------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on

timezone = 'UTC'
