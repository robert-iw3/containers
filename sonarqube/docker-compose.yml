# SonarQube (built from Dockerfile) against an external PostgreSQL reachable
# at POSTGRES_IPv4. Database coordinates come from .env. For a single
# instance with its own database see docker-compose-postgres-sonar.yml; for
# a TLS single-sign-on deployment see sso/.

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-temp:

networks:
  sonarnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${SONARQUBE_SUBNET}
          gateway: ${SONARQUBE_GATEWAY}

services:
  sonarqube:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SONARQUBE_CONTAINER_NAME}
    hostname: ${SONARQUBE_HOSTNAME}
    security_opt:
      - no-new-privileges:true
    ports:
      - 9000:9000
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://${POSTGRES_IPv4}/${POSTGRESQL_DATABASE}"
      SONAR_JDBC_USERNAME: ${POSTGRESQL_USERNAME}
      SONAR_JDBC_PASSWORD: ${POSTGRESQL_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - sonarqube-data:/opt/sonarqube/data:Z
      - sonarqube-extensions:/opt/sonarqube/extensions:Z
      - sonarqube-logs:/opt/sonarqube/logs:Z
      - sonarqube-temp:/opt/sonarqube/temp:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    ulimits:
      nproc: 8192
      nofile:
        soft: 65536
        hard: 131072
    networks:
      sonarnet:
        ipv4_address: ${SONARQUBE_IPv4}
