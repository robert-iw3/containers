# SonarQube with its own PostgreSQL, fronted by Traefik, plus a pg_dump
# backup sidecar. Deployer-facing settings come from .env (POSTGRESQL_*,
# *_IMAGE, *_IPv4, *_CONTAINER_NAME, *_HOSTNAME). For a TLS single-sign-on
# deployment see sso/.

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-temp:
  postgresql-data:
  sonarqube-postgres-backups:

networks:
  sonarnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${SONARQUBE_SUBNET}
          gateway: ${SONARQUBE_GATEWAY}
  traefik:
    external: true

x-common-vars-apps: &common-vars-apps
  security_opt:
    - no-new-privileges:true
  restart: on-failure
  env_file:
    - .env

services:
  postgres:
    <<: *common-vars-apps
    image: ${POSTGRESQL_IMAGE}
    container_name: ${POSTGRESQL_CONTAINER_NAME}
    hostname: ${POSTGRESQL_HOSTNAME}
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - postgresql-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      sonarnet:
        ipv4_address: ${POSTGRES_IPv4}
    deploy:
      mode: global
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  sonarqube:
    <<: *common-vars-apps
    image: ${SONARQUBE_IMAGE}
    container_name: ${SONARQUBE_CONTAINER_NAME}
    hostname: ${SONARQUBE_HOSTNAME}
    ports:
      - 9000:9000
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://${POSTGRES_IPv4}/${POSTGRESQL_DATABASE}"
      SONAR_JDBC_USERNAME: ${POSTGRESQL_USERNAME}
      SONAR_JDBC_PASSWORD: ${POSTGRESQL_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - sonarqube-data:/opt/sonarqube/data:Z
      - sonarqube-extensions:/opt/sonarqube/extensions:Z
      - sonarqube-logs:/opt/sonarqube/logs:Z
      - sonarqube-temp:/opt/sonarqube/temp:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    ulimits:
      nproc: 8192
      nofile:
        soft: 65536
        hard: 131072
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_healthy
    networks:
      sonarnet:
        ipv4_address: ${SONARQUBE_IPv4}
      traefik:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.io`)"
        - "traefik.http.routers.sonarqube.service=sonarqube"
        - "traefik.http.routers.sonarqube.entrypoints=websecure"
        - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
        - "traefik.http.routers.sonarqube.tls=true"
        - "traefik.http.routers.sonarqube.tls.certresolver=letsencrypt"
        - "traefik.http.services.sonarqube.loadbalancer.passhostheader=true"
        - "traefik.http.routers.sonarqube.middlewares=compresstraefik"
        - "traefik.http.middlewares.compresstraefik.compress=true"
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  backups:
    <<: *common-vars-apps
    image: ${POSTGRESQL_IMAGE}
    container_name: ${BACKUP_POSTGRESQL_CONTAINER_NAME}
    hostname: ${BACKUP_POSTGRESQL_HOSTNAME}
    environment:
      PGPASSWORD: ${POSTGRESQL_PASSWORD}
    command:
      - sh
      - -c
      - |
        sleep 30m
        while true; do
          pg_dump -h ${POSTGRESQL_HOSTNAME} -p 5432 -d "${POSTGRESQL_DATABASE}" -U "${POSTGRESQL_USERNAME}" | gzip > /srv/sonarqube-postgres/backups/sonarqube-postgres-backup-$(date "+%Y-%m-%d_%H-%M").gz || {
            echo "postgres backup failed at $(date)"; exit 1;
          }
          find /srv/sonarqube-postgres/backups -type f -mtime +7 -delete
          sleep 24h
        done
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - sonarqube-postgres-backups:/srv/sonarqube-postgres/backups:Z
    depends_on:
      postgres:
        condition: service_healthy
      sonarqube:
        condition: service_healthy
    networks:
      sonarnet:
        ipv4_address: ${BACKUP_POSTGRESQL_IPv4}
    deploy:
      mode: global
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
