---
# Deploy the Gitea SSO stack: traefik TLS, tinyauth and Gitea with reverse
# proxy sign-in. Runs the same compose file uat/run-uat.sh validates.
#
#   ansible-playbook -i inventory.ini deploy.yml
- name: Deploy the Gitea SSO stack
  hosts: gitea
  gather_facts: false
  vars:
    stack_dir: "{{ (playbook_dir ~ '/../sso') | realpath }}"
  tasks:
    - name: Verify podman-compose is available
      ansible.builtin.command: podman-compose --version
      changed_when: false

    - name: Check for an existing .env file
      ansible.builtin.stat:
        path: "{{ stack_dir }}/.env"
      register: env_file

    - name: Seed .env from .env.example on first run
      ansible.builtin.copy:
        src: "{{ stack_dir }}/.env.example"
        dest: "{{ stack_dir }}/.env"
        mode: "0600"
        force: false
        remote_src: true
      when: not env_file.stat.exists

    - name: Fail when .env still holds placeholders
      ansible.builtin.command: grep -c CHANGE_ME .env
      args:
        chdir: "{{ stack_dir }}"
      register: placeholders
      changed_when: false
      failed_when: placeholders.stdout | int > 0

    - name: Bring up the datastore
      ansible.builtin.command: podman-compose up -d --no-recreate postgres
      args:
        chdir: "{{ stack_dir }}"
      register: db_up
      changed_when: "'done' in (db_up.stderr | default(''))"

    - name: Wait for the datastore to accept connections
      ansible.builtin.command: podman exec postgres-gitea-sso pg_isready -U gitea -d gitea
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 20
      delay: 5
      changed_when: false

    - name: Bring up the gateway and application
      ansible.builtin.command: podman-compose up -d --no-recreate tinyauth traefik gitea
      args:
        chdir: "{{ stack_dir }}"
      register: app_up
      changed_when: "'done' in (app_up.stderr | default(''))"

    - name: Wait for Gitea to report healthy
      ansible.builtin.command: podman exec gitea-sso curl -sf http://127.0.0.1:3000/api/healthz
      register: gt_health
      until: gt_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false
