volumes:
  confluence-postgres:

networks:
  confluence:
    name: confluence
    driver: bridge

services:
  postgres:
    image: docker.io/postgres:17.10-alpine
    container_name: postgres
    hostname: postgres-confluence.io
    ports:
      - 5432:5432
    volumes:
      - confluence-postgres:/var/lib/postgresql/data:z
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - confluence
