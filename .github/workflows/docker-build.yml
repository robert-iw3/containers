name: Build, Scan & Publish Container Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      paths:
        description: "Build only these Dockerfiles (comma/space-separated globs or dirs, e.g. 'elastic/data-pipeline/*, elastic/apm-server')"
        type: string
        default: ""
      build_all:
        description: "Build every Dockerfile in the repo"
        type: boolean
        default: false
      build_changed:
        description: "Build Dockerfiles whose build context changed in this push/PR"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  static-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r nomad/tests/requirements.txt

      - name: Run static validation suite
        run: python -m pytest tests/ nomad/tests/ -q

  nomad-terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build tofu/tflint validation image
        run: docker build -t nomad-tofu-tests -f nomad/tests/Dockerfile nomad

      - name: Run tofu fmt/validate/tflint/packer
        run: docker run --rm nomad-tofu-tests

  nomad-molecule:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [nomad, monitoring]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install molecule
        run: |
          pip install molecule "molecule-plugins[podman]" ansible-core
          ansible-galaxy collection install containers.podman ansible.posix community.general

      - name: Run molecule test (${{ matrix.role }})
        working-directory: nomad/ansible/roles/${{ matrix.role }}
        run: molecule test

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover Dockerfiles to build
        id: discover
        shell: bash
        env:
          ONLY_PATHS: ${{ inputs.paths }}
          BUILD_ALL: ${{ inputs.build_all }}
          BUILD_CHANGED: ${{ inputs.build_changed }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Default: build what ci/build.yaml declares (empty manifest -> nothing).
          # Manual runs override with paths / build_all / build_changed.
          MODE=manifest
          ITEMS=()
          if [[ -n "${ONLY_PATHS// /}" ]]; then
            MODE=paths
            IFS=', ' read -r -a ITEMS <<< "$ONLY_PATHS"
          elif [[ "$BUILD_ALL" == "true" ]]; then
            MODE=all
          elif [[ "$BUILD_CHANGED" == "true" ]]; then
            MODE=changed
            if [[ -n "$BASE_REF" ]]; then
              git fetch origin "$BASE_REF" --depth=1
              mapfile -t ITEMS < <(git diff --name-only "origin/${BASE_REF}...HEAD")
            elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
              mapfile -t ITEMS < <(git diff --name-only "$BEFORE" HEAD)
            fi
          fi

          python3 .github/discover.py "$MODE" "${ITEMS[@]}" >> "$GITHUB_OUTPUT"

  build-scan-publish:
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.safe }}
          path: sbom.cdx.json

      - name: Vulnerability scan (SARIF, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.safe }}

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
