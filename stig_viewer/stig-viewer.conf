# STIG Viewer stack configuration. Everything here is overridable by an
# environment variable of the same name, so a one-off run needs no edit:
#   SV_BENCHMARKS='U_Web_Server_*' ./run.sh
#
# Paths are relative to this directory unless absolute.

# The vendor archive. Not redistributable, so it is not in this repository.
# Obtain it from the DISA STIG downloads page and point this at it.
SV_ARCHIVE="${HOME}/Downloads/U_STIGViewer-linux-x64-3-8-1.zip"

# Where the extracted viewer lives. Rebuilt from SV_ARCHIVE when absent.
SV_VENDOR="./vendor"

# The benchmark library: XCCDF files the viewer loads. Populate it with
# ./fetch-library.sh, which accepts a local archive or downloads one.
SV_LIBRARY="./library"

# Which benchmarks to load, as shell globs against SV_LIBRARY. Empty loads
# everything in the library, which is slow on the full DISA compilation.
SV_BENCHMARKS="U_Central_Log_Server_SRG_* U_Web_Server_SRG_*"

# Checklists. MOUNTED READ-WRITE AND LIVING ON THE HOST, so edits made in the
# viewer persist after the container exits. This is the whole point: a checklist
# is worked over days, not produced once.
SV_CHECKLISTS="./checklists"

# Viewer state - window layout, recent files, its internal database. Persisted
# for the same reason.
SV_STATE="./state"

# Display backend: x11, wayland, or auto.
#
# x11 is the default and goes through XWayland on a Wayland session. Electron's
# Wayland support needs the compositor socket plus a correctly owned
# XDG_RUNTIME_DIR inside the container, and when any of that is off it falls back
# to X11 and exits with "Missing X server or $DISPLAY" rather than saying so. X11
# is one socket and it works, which is what a verification tool should be.
SV_DISPLAY="x11"

# Resource bounds. A GUI Electron application with a browser engine inside will
# take whatever it is given.
SV_CPUS="2"
SV_MEMORY="4g"
SV_PIDS="2048"

SV_IMAGE="localhost/stig-viewer:3.8.1"
