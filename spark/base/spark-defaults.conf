# Production defaults for large-scale data/ML processing. Baked into the image;
# override per-job with --conf. Tuned for high-volume telemetry: adaptive query
# execution, dynamic executor allocation (the autoscaling story for Spark), and
# sane shuffle/serialization for wide aggregations.

# --- Adaptive Query Execution: right-sizes shuffle partitions at runtime ---
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             true

# --- Dynamic allocation = executor autoscaling on the standalone/k8s cluster ---
# Executors are added under load and released when idle, between minExecutors and
# maxExecutors. Requires the external shuffle service so shed executors don't lose
# shuffle data (enabled below).
spark.dynamicAllocation.enabled                 true
spark.dynamicAllocation.shuffleTracking.enabled true
spark.dynamicAllocation.minExecutors            1
spark.dynamicAllocation.maxExecutors            50
spark.dynamicAllocation.initialExecutors        2
spark.dynamicAllocation.executorIdleTimeout     60s

# --- Shuffle / serialization for wide telemetry aggregations ---
spark.serializer                                org.apache.spark.serializer.KryoSerializer
spark.sql.shuffle.partitions                    200
spark.shuffle.compress                          true
spark.rdd.compress                              true

# --- Event log so the history server can render completed jobs ---
spark.eventLog.enabled                          true
spark.eventLog.dir                              /tmp/spark-events
spark.history.fs.logDirectory                   /tmp/spark-events
