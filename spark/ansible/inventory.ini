# Multi-host Spark standalone cluster. Each node is a distinct machine/VM with
# its own IP and hostname. The master's address is what workers connect to, so
# it must be reachable from every worker (private IP or DNS name).
#
# ansible_host = the address Ansible SSHes to.
# spark_advertise_host = the address THIS node advertises to the rest of the
# cluster (usually the private IP). Defaults to ansible_host if unset.

[spark_master]
spark-master-1 ansible_host=10.0.1.10 spark_advertise_host=10.0.1.10

[spark_workers]
spark-worker-1 ansible_host=10.0.1.21 spark_advertise_host=10.0.1.21
spark-worker-2 ansible_host=10.0.1.22 spark_advertise_host=10.0.1.22
spark-worker-3 ansible_host=10.0.1.23 spark_advertise_host=10.0.1.23

[spark_cluster:children]
spark_master
spark_workers

[spark_cluster:vars]
ansible_user=ubuntu
