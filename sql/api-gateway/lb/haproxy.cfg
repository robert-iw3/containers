# HAProxy load balancer for the SQL gateway tier.
# Balances across the gateway replicas (round-robin) with active health
# checks on /health, exposes an HTTP frontend on :80 and a stats page on
# :8404. For production TLS, terminate on the frontend with a `bind :443 ssl
# crt ...` line (see lb/README.md).

global
    log stdout format raw local0 info
    maxconn 20000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    default-server inter 3s fall 3 rise 2

# Runtime DNS so backends are resolved (and re-resolved) while running,
# instead of only once at startup. Reads the container's /etc/resolv.conf,
# which works under both Docker and Podman.
resolvers dns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend fe_gateway
    # Unprivileged port: the haproxy image runs as a non-root user.
    bind :8080
    # Surface the chosen backend server for verification.
    http-response set-header X-Upstream %[srv_name]
    default_backend be_gateway

backend be_gateway
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # init-addr none: start even if a name isn't resolvable yet (the resolver
    # brings the server up once DNS + health checks pass).
    server gw-a api-gateway:3000 check resolvers dns init-addr none
    server gw-b gateway-b:3000   check resolvers dns init-addr none
    server gw-c gateway-c:3000   check resolvers dns init-addr none

frontend fe_stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
