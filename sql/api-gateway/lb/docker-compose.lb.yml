# Load-balancer overlay: puts nginx OR haproxy in front of three gateway
# replicas (api-gateway + gateway-b + gateway-c), all sharing Redis and the
# SQL shards from the base stack.
#
# Pick a load balancer with a profile (from the api-gateway/ directory):
#   docker compose -f docker-compose.yml -f lb/docker-compose.lb.yml --profile lb-nginx   up -d --build
#   docker compose -f docker-compose.yml -f lb/docker-compose.lb.yml --profile lb-haproxy up -d --build
#
# The LB is published on 127.0.0.1:8088; haproxy also serves stats on :8404.

name: sql-stack

x-gwenv: &gwenv
  PORT: "3000"
  SQL_SHARDS: sql1:1433,sql2:1433
  SQL_USER: sa
  SQL_PASSWORD: ${SQL_SA_PASSWORD:?set in .env}
  SQL_DATABASE: ${APP_DB:?set in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"

x-gateway: &gateway
  image: localhost/sql-api-gateway:latest
  build:
    context: .
    dockerfile: Dockerfile.gateway
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop:
    - ALL
  mem_limit: 512m
  tmpfs:
    - /tmp
  environment: *gwenv
  env_file:
    - path: .env
      required: false
  healthcheck:
    test: ["CMD", "node", "/app/healthcheck.js"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s
  profiles: ["lb-nginx", "lb-haproxy"]
  depends_on:
    redis:
      condition: service_healthy
    sql1:
      condition: service_healthy
    sql2:
      condition: service_healthy
  networks:
    - edge
    - data

services:
  gateway-b:
    <<: *gateway
    container_name: sql-stack-gateway-b

  gateway-c:
    <<: *gateway
    container_name: sql-stack-gateway-c

  nginx-lb:
    profiles: ["lb-nginx"]
    image: docker.io/nginx:alpine
    container_name: sql-stack-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
    networks:
      - edge

  haproxy-lb:
    profiles: ["lb-haproxy"]
    image: docker.io/haproxy:alpine
    container_name: sql-stack-haproxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8404:8404"
    depends_on:
      api-gateway:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
    networks:
      - edge
