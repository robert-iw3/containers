# nginx load balancer for the SQL gateway tier.
# Balances across the gateway replicas (least connections) and exposes a
# plain-HTTP frontend on :80. For production TLS, uncomment the HTTPS server
# block and use lb/init-certs.sh (certbot) — see lb/README.md.

worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    upstream gateway {
        least_conn;
        server api-gateway:3000 max_fails=3 fail_timeout=15s;
        server gateway-b:3000   max_fails=3 fail_timeout=15s;
        server gateway-c:3000   max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen 80;
        # Report which upstream served the request (visible in the UAT).
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # --- Production TLS (uncomment; provide certs via lb/init-certs.sh) ------
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     location / { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Connection ""; }
    # }
    # server { listen 80; server_name yourdomain.com;
    #     location /.well-known/acme-challenge/ { root /var/www/certbot; }
    #     location / { return 301 https://$host$request_uri; } }
}
