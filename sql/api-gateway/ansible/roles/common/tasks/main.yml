---
- name: Check whether the container engine is present
  ansible.builtin.command: "command -v {{ container_engine }}"
  register: common_engine_check
  failed_when: false
  changed_when: false

- name: Install Docker via the convenience script
  when:
    - common_engine_check.rc != 0
    - container_engine == 'docker'
  block:
    - name: Download the Docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"
    - name: Run the Docker install script
      ansible.builtin.command: sh /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

- name: Install podman-compose when using podman
  when:
    - common_engine_check.rc != 0
    - container_engine == 'podman'
  ansible.builtin.package:
    name:
      - podman
      - podman-compose
    state: present

- name: Enable and start the Docker service
  when: container_engine == 'docker'
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create the deploy directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0750"

# --- Database-host kernel tuning (SQL Server hosts only) -----------------
- name: Tune kernel for SQL Server hosts
  when: "'sql_shards' in group_names"
  block:
    - name: Set vm.swappiness=1 (avoid swapping the buffer pool)
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "1"
        state: present
        reload: true
    - name: Raise vm.max_map_count
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true
    - name: Disable transparent huge pages for this boot
      ansible.builtin.shell: echo never > /sys/kernel/mm/transparent_hugepage/enabled
      changed_when: false
      failed_when: false
