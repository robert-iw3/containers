# Deploy each component of the SQL stack to its own host (VM or bare metal).
# Replace the ansible_host IPs with your machines. Components reach each other
# over these addresses (published container ports), not compose DNS.
#
#   redis        <- gateways connect here for shard map + rate limiting
#   sql_shards   <- one tuned SQL Server per host (ordered: first = shard 0)
#   gateways     <- stateless API gateways behind the load balancer
#   loadbalancer <- nginx or haproxy front door (set lb_engine in group_vars)

[redis]
redis1 ansible_host=10.10.0.10

[sql_shards]
shard0 ansible_host=10.10.0.20
shard1 ansible_host=10.10.0.21

[gateways]
gw1 ansible_host=10.10.0.30
gw2 ansible_host=10.10.0.31

[loadbalancer]
lb1 ansible_host=10.10.0.40

[all:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
