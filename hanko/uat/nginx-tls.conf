# UAT TLS terminator. Two HTTPS server blocks:
#   :8443  -> reverse-proxies the hanko public API (published as :8000)
#   :8444  -> serves the static hanko-elements login page (published :8888)
# Same CA/cert for both so one trust decision covers the whole demo.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/tls/tls.crt;
    ssl_certificate_key /etc/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://hanko:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate     /etc/tls/tls.crt;
    ssl_certificate_key /etc/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /health {
        return 200;
        access_log off;
    }
}
