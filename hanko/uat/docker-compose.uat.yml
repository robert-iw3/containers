# Self-contained UAT stack, TLS end to end:
#   postgres (TLS) + hanko (plain HTTP, internal only) + an nginx TLS
#   terminator that fronts the hanko API (https://localhost:8000) and
#   serves the hanko-elements login page (https://localhost:8888), which
#   calls /me after login to prove the integration + mailslurper.
# hanko has no native TLS, so nginx terminates it. Secrets come from
# uat/.env; certs from uat/tls. Both are generated by run-uat.sh.
---
volumes:
  hanko-uat-postgres:

networks:
  hanko-uat:
    driver: bridge

services:
  postgres:
    image: docker.io/library/postgres:17.10
    container_name: postgres-hanko-uat
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: hanko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hanko
    volumes:
      - hanko-uat-postgres:/var/lib/postgresql/data:z
      - ./tls:/tls-in:ro,z
    command:
      - bash
      - -c
      - |
        install -o postgres -g postgres -m 600 /tls-in/tls.key /var/lib/postgresql/server.key
        install -o postgres -g postgres -m 644 /tls-in/tls.crt /var/lib/postgresql/server.crt
        install -o postgres -g postgres -m 644 /tls-in/ca.crt /var/lib/postgresql/ca.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/server.crt \
          -c ssl_key_file=/var/lib/postgresql/server.key \
          -c ssl_ca_file=/var/lib/postgresql/ca.crt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hanko -U hanko"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hanko-uat

  hanko-migrate:
    image: ${HANKO_IMAGE:-ghcr.io/teamhanko/hanko}:${HANKO_TAG:-v2.7.0}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config-uat.yml:/etc/config/config.yml:ro,z
      - ./tls:/etc/tls:ro,z
    # Ordering enforced by run-uat.sh; no depends_on on purpose.
    command: --config /etc/config/config.yml migrate up
    networks:
      - hanko-uat

  hanko:
    image: ${HANKO_IMAGE:-ghcr.io/teamhanko/hanko}:${HANKO_TAG:-v2.7.0}
    container_name: hanko-uat
    security_opt:
      - no-new-privileges:true
    command: serve --config /etc/config/config.yml all
    volumes:
      - ./config-uat.yml:/etc/config/config.yml:ro,z
      - ./tls:/etc/tls:ro,z
    networks:
      - hanko-uat

  proxy:
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    container_name: hanko-proxy-uat
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./www:/usr/share/nginx/html:ro,z
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./tls:/etc/tls:ro,z
    ports:
      - '127.0.0.1:8000:8443'
      - '127.0.0.1:8888:8444'
    networks:
      - hanko-uat

  mailslurper:
    image: docker.io/marcopas/docker-mailslurper:latest
    container_name: mailslurper-uat
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8086:8080'
      - '127.0.0.1:8087:8085'
    networks:
      - hanko-uat
