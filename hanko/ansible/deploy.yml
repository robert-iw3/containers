---
# Deploy the Hanko stack with podman-compose.
# Idempotent: seeds .env from .env.example and generates local TLS certs
# on first run, then brings the compose project up. See deploy-k8s.yml for
# the Helm/Kubernetes deployment.
#
#   ansible-playbook -i inventory.ini deploy.yml
- name: Deploy the Hanko authentication stack
  hosts: hanko
  gather_facts: false
  vars:
    stack_dir: "{{ (playbook_dir ~ '/..') | realpath }}"
    compose_file: docker-compose.yml
  tasks:
    - name: Verify podman-compose is available
      ansible.builtin.command: podman-compose --version
      register: podman_compose_version
      changed_when: false

    - name: Check for an existing .env file
      ansible.builtin.stat:
        path: "{{ stack_dir }}/.env"
      register: env_file

    - name: Seed .env from .env.example on first run
      ansible.builtin.copy:
        src: "{{ stack_dir }}/.env.example"
        dest: "{{ stack_dir }}/.env"
        mode: "0600"
        force: false
        remote_src: true
      when: not env_file.stat.exists

    - name: Check for existing TLS material
      ansible.builtin.stat:
        path: "{{ stack_dir }}/tls/ca.crt"
      register: tls_ca

    - name: Generate local TLS certificates
      ansible.builtin.command: ./generate-tls.sh
      args:
        chdir: "{{ stack_dir }}"
        creates: "{{ stack_dir }}/tls/ca.crt"
      when: not tls_ca.stat.exists

    - name: Bring up the compose project
      ansible.builtin.command: "podman-compose -f {{ compose_file }} up -d"
      args:
        chdir: "{{ stack_dir }}"
      register: compose_up
      changed_when: >-
        ('Creating' in (compose_up.stderr | default('')))
        or ('Recreating' in (compose_up.stderr | default('')))
        or ('done' in (compose_up.stderr | default('')))
