# Hanko backend configuration for the compose stack.
#
# The credentials below are LOCAL DEVELOPMENT DEFAULTS and must be
# replaced before any non-local deployment. Database credentials must
# match hanko/.env. Full reference:
# https://github.com/teamhanko/hanko/blob/main/backend/config/config.yaml
# hanko has no dedicated database TLS block; TLS is requested through the
# `url` DSN. verify-ca encrypts and pins the CA without requiring the
# server-cert hostname to match (use verify-full + a "postgresql" SAN,
# which generate-tls.sh now emits, to also check the hostname). The `url`
# form takes precedence over the individual host/user/password fields.
database:
  url: postgres://hanko:hanko-dev-password@postgresql:5432/hanko?sslmode=verify-ca&sslrootcert=/etc/tls/ca.crt
  dialect: postgres
secrets:
  keys:
    - hanko-dev-jwt-key-change-me-32-chars
service:
  name: Hanko Authentication Service
email_delivery:
  enabled: true
  from_address: no-reply@example.com
  from_name: Hanko
  # SMTP settings must be nested under email_delivery; a top-level `smtp`
  # block is ignored and hanko falls back to localhost:465.
  smtp:
    host: mailslurper
    port: "2500"
webauthn:
  relying_party:
    id: localhost
    display_name: Hanko Authentication
    origins:
      - "http://localhost:9500"
      - "http://localhost:8888"
session:
  cookie:
    http_only: true
    same_site: strict
  lifespan: 24h
server:
  public:
    address: ":8000"
    cors:
      allow_origins:
        - "http://localhost:9500"
        - "http://localhost:8888"
  admin:
    address: ":8001"
