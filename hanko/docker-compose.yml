---
volumes:
  hanko-postgres:
    name: hanko-postgres
  hanko-postgres-backups:
    name: hanko-postgres-backups

networks:
  hanko-frontend:
    driver: bridge
  hanko-backend:
    driver: bridge
    internal: true

x-common: &common
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  hanko-migrate:
    <<: *common
    image: ${HANKO_IMAGE:-ghcr.io/teamhanko/hanko}:${HANKO_TAG:-v2.7.0}
    restart: on-failure
    networks:
      - hanko-backend
    volumes:
      - ./config.yml:/etc/config/config.yml:ro,z
      - ./tls:/etc/tls:ro,z
    command: --config /etc/config/config.yml migrate up
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  hanko:
    <<: *common
    image: ${HANKO_IMAGE:-ghcr.io/teamhanko/hanko}:${HANKO_TAG:-v2.7.0}
    networks:
      - hanko-backend
    # hanko has no native TLS; it serves plain HTTP on the internal
    # network and the proxy below terminates TLS. Admin (8001) is never
    # exposed off the backend network.
    command: serve --config /etc/config/config.yml all
    volumes:
      - ./config.yml:/etc/config/config.yml:ro,z
      - ./tls:/etc/tls:ro,z
    depends_on:
      hanko-migrate:
        condition: service_completed_successfully
    # No container healthcheck: the image is distroless (no shell/curl).
    # Health endpoint for external monitoring: :8000/health
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M

  proxy:
    <<: *common
    # TLS terminator in front of the hanko public API (hanko itself
    # cannot serve HTTPS). Publishes 8443 only.
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    networks:
      - hanko-frontend
      - hanko-backend
    ports:
      - '8443:8443'
    volumes:
      - ./nginx/hanko-tls.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./tls:/etc/tls:ro,z
    depends_on:
      - hanko
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  postgresql:
    <<: *common
    image: docker.io/library/postgres:17.10
    container_name: postgres-hanko
    networks:
      - hanko-backend
    env_file:
      - .env
    volumes:
      - hanko-postgres:/var/lib/postgresql/data:z
      - ./tls:/tls-in:ro,z
    # The server key must be 0600 and owned by the postgres user, which a
    # host bind mount cannot guarantee; copy certs into place at startup.
    command:
      - bash
      - -c
      - |
        install -o postgres -g postgres -m 600 /tls-in/tls.key /var/lib/postgresql/server.key
        install -o postgres -g postgres -m 644 /tls-in/tls.crt /var/lib/postgresql/server.crt
        install -o postgres -g postgres -m 644 /tls-in/ca.crt /var/lib/postgresql/ca.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/server.crt \
          -c ssl_key_file=/var/lib/postgresql/server.key \
          -c ssl_ca_file=/var/lib/postgresql/ca.crt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  elements:
    <<: *common
    # Requires a locally built image (frontend/frontend.Dockerfile)
    profiles: ["dev"]
    image: ${CONTAINER_REGISTRY:-localhost}/hanko-frontend:${TAG:-latest}
    networks:
      - hanko-frontend
    ports:
      - "9500:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailslurper:
    <<: *common
    profiles: ["dev"]
    image: docker.io/marcopas/docker-mailslurper:latest
    networks:
      - hanko-frontend
      - hanko-backend
    ports:
      - '127.0.0.1:8086:8080'
      - '127.0.0.1:8087:8085'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backups:
    <<: *common
    image: docker.io/library/postgres:17.10
    container_name: postgres-backups-hanko
    networks:
      - hanko-backend
    volumes:
      - hanko-postgres-backups:/backups:Z
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: require
    command:
      - sh
      - -c
      - |
        while true; do
          pg_dump | gzip > /backups/hanko-postgres-backup-$(date "+%Y-%m-%d_%H-%M").gz || {
            echo "Backup failed at $(date)"
          }
          find /backups -type f -name '*.gz' -mtime +7 -delete
          sleep 24h
        done
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
