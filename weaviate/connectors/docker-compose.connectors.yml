---
# Application connectors for the Weaviate stack. Joins the running stack's
# network; start the main stack first (podman-compose up -d in weaviate/).
#
#   podman-compose -f docker-compose.connectors.yml up -d search-api
#   podman-compose -f docker-compose.connectors.yml run --rm search-api \
#       python loader.py --sample 500
#   curl -s -X POST http://127.0.0.1:8802/search \
#       -H 'Content-Type: application/json' \
#       -d '{"query":"invoice charged twice","top_k":3}'
#   podman-compose -f docker-compose.connectors.yml run --rm langchain-rag

services:
  search-api:
    build:
      context: ..
      dockerfile: connectors/search-api/Dockerfile
    image: localhost/weaviate-search-api:latest
    container_name: weaviate-search-api
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - WEAVIATE_HTTP_HOST=weaviate
      - WEAVIATE_GRPC_HOST=weaviate
    ports:
      - "127.0.0.1:8802:8000"
    networks:
      - weaviate

  langchain-rag:
    build:
      context: ..
      dockerfile: connectors/langchain-rag/Dockerfile
    image: localhost/weaviate-langchain-rag:latest
    container_name: weaviate-langchain-rag
    restart: "no"
    env_file:
      - ../.env
    environment:
      - WEAVIATE_HTTP_HOST=weaviate
      - WEAVIATE_GRPC_HOST=weaviate
    networks:
      - weaviate

networks:
  weaviate:
    external: true
    name: weaviate_weaviate
