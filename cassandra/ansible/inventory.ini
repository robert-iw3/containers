# Multi-host Cassandra 5.0 cluster. The first host is the seed; the rest join via it.
# The deploy playbook uses serial:1 so nodes bootstrap one at a time (required).
# cassandra_advertise_host defaults to ansible_host.
[cassandra_cluster]
cassandra-1 ansible_host=10.0.5.11 cassandra_advertise_host=10.0.5.11
cassandra-2 ansible_host=10.0.5.12 cassandra_advertise_host=10.0.5.12
cassandra-3 ansible_host=10.0.5.13 cassandra_advertise_host=10.0.5.13

[cassandra_cluster:vars]
ansible_user=ubuntu
