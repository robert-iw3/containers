---
# Apache Cassandra 5.0 on Kubernetes: a 3-replica StatefulSet with OrderedReady pod
# management so nodes bootstrap one at a time (Cassandra requirement). Seeds are the
# stable headless-service DNS of the first pod.
#
# Cassandra scales via nodetool (streaming), so this ships a PodDisruptionBudget
# rather than an HPA -- adding/removing nodes must stream data, not just scale a
# ReplicaSet.
apiVersion: v1
kind: Namespace
metadata:
  name: cassandra
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: cassandra
  labels: {app: cassandra}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: cassandra}
  ports:
  - {port: 9042, name: cql}
  - {port: 7000, name: intra-node}
  - {port: 7001, name: tls-intra-node}
  - {port: 7199, name: jmx}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cassandra
  namespace: cassandra
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: cassandra}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: cassandra
spec:
  serviceName: cassandra
  replicas: 3
  podManagementPolicy: OrderedReady      # one node bootstraps at a time
  selector:
    matchLabels: {app: cassandra}
  template:
    metadata:
      labels: {app: cassandra}
    spec:
      terminationGracePeriodSeconds: 300
      containers:
      - name: cassandra
        image: docker.io/library/cassandra:5.0
        ports:
        - {containerPort: 9042, name: cql}
        - {containerPort: 7000, name: intra-node}
        env:
        - {name: CASSANDRA_CLUSTER_NAME, value: "arcanaeum"}
        - {name: CASSANDRA_DC, value: "dc1"}
        - {name: CASSANDRA_RACK, value: "rack1"}
        - {name: CASSANDRA_ENDPOINT_SNITCH, value: "GossipingPropertyFileSnitch"}
        - {name: CASSANDRA_SEEDS, value: "cassandra-0.cassandra.cassandra.svc.cluster.local"}
        - {name: MAX_HEAP_SIZE, value: "2048M"}
        - {name: HEAP_NEWSIZE, value: "256M"}
        # Advertise the pod IP for gossip; POD_IP is reused by the readiness probe.
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        - name: CASSANDRA_BROADCAST_ADDRESS
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        readinessProbe:
          # Ready only once THIS node is Up/Normal in the ring.
          exec: {command: ["/bin/bash", "-c", "nodetool status | grep -E \"^UN[[:space:]]+${POD_IP}\""]}
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
        livenessProbe:
          exec: {command: ["/bin/bash", "-c", "nodetool status | grep -q '^UN'"]}
          initialDelaySeconds: 120
          periodSeconds: 30
        resources:
          requests: {cpu: "1", memory: "3Gi"}
          limits: {cpu: "2", memory: "4Gi"}
        volumeMounts:
        - {name: data, mountPath: /var/lib/cassandra}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
