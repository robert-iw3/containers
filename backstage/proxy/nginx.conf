# Path-routed reverse proxy in front of the split portal deployments
# (Backstage horizontal-scaling pattern): /api/{catalog,search} goes to
# deployment B, all other traffic to deployment A. Authentication happens
# upstream at Boundary (session broker) and in the portal itself (IdP);
# this tier only routes. X-Portal-Deployment marks which deployment served
# a response so routing is observable (and UAT-testable).
worker_processes 1;

events {
    worker_connections 512;
}

http {
    upstream deployment_a {
        server backstage-a:7007;
    }
    upstream deployment_b {
        server backstage-b:7007;
    }

    server {
        listen 8443 ssl;
        # h2 keeps browsers on a single multiplexed TCP connection — the
        # boundary connect proxy corrupts websocket frames under parallel
        # connections (upstream coder/websocket concurrency bug)
        http2 on;
        ssl_certificate     /portal-certs/portal-proxy.crt;
        ssl_certificate_key /portal-certs/portal-proxy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location ~ ^/api/(catalog|search)(/|$) {
            add_header X-Portal-Deployment b always;
            proxy_pass http://deployment_b;
        }

        location / {
            add_header X-Portal-Deployment a always;
            proxy_pass http://deployment_a;
        }
    }
}
