# Portal configuration. Baked into the frontend at image build and read by
# the backend at start; POSTGRES_* / GITEA_* env vars are exported by
# entrypoint.sh from Vault.
#
# End users reach the portal through a Boundary session listening on
# 127.0.0.1:27007 (boundary connect -listen-port 27007), so all public URLs
# point there. The backend itself listens on 7007 inside the container.
app:
  title: Internal Dev Portal
  baseUrl: https://127.0.0.1:27007
  # new-frontend-system feature discovery: bundle + register every installed
  # frontend plugin (notifications, search, scaffolder, ...) — without this
  # only explicitly listed features exist and the app shell breaks post-login
  packages: all

organization:
  name: Platform Engineering

backend:
  baseUrl: https://127.0.0.1:27007
  listen: ':7007'
  cors:
    origin: https://127.0.0.1:27007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # Postgres enforces hostssl; the stack CA is trusted via
      # NODE_EXTRA_CA_CERTS and the server cert carries the sidecar SAN
      ssl: true
  reading:
    allow:
      # Gitea, reached through the portal's Consul Connect sidecar upstream
      - host: backstage-sidecar:20002
  auth:
    externalAccess:
      # Service-to-service access for the UAT battery (scripts/smoke-test.sh)
      - type: static
        options:
          token: ${BACKSTAGE_API_TOKEN}
          subject: uat-smoke-test

integrations:
  gitea:
    - host: backstage-sidecar:20002
      baseUrl: https://backstage-sidecar:20002
      username: ${GITEA_USERNAME}
      password: ${GITEA_PASSWORD}

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # Primary sign-in: company SSO via Keycloak (OIDC). The client secret is
    # exported by entrypoint.sh from Vault kv.
    oidc:
      production:
        metadataUrl: https://keycloak:8443/realms/portal/.well-known/openid-configuration
        clientId: backstage-portal
        clientSecret: ${OIDC_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            # portal-dev@portal.internal matches the User entity seeded in
            # the Gitea org.yaml
            - resolver: emailMatchingUserEntityProfileEmail
    # Demo fallback (network access is already Boundary-gated); remove for
    # a strict SSO-only portal.
    guest:
      dangerouslyAllowOutsideDevelopment: true

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

catalog:
  rules:
    - allow: [Component, API, Resource, System, Domain, Location, User, Group, Template]
  locations:
    # Dev projects live in Gitea; discovered over the mesh.
    - type: url
      target: https://backstage-sidecar:20002/devteam/sample-service/src/branch/main/catalog-info.yaml
    # Org model (Group devteam, User portal-dev) — the OIDC sign-in resolver
    # matches users against these entities.
    - type: url
      target: https://backstage-sidecar:20002/devteam/sample-service/src/branch/main/org.yaml
