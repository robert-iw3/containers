# Postgres host: predictable memory + gentle writeback.

# never swap the database if avoidable
vm.swappiness = 1

# strict overcommit so the OOM killer never surprises Postgres; size
# overcommit_ratio to (RAM - shared_buffers) if you tune shared_buffers up
vm.overcommit_memory = 2
vm.overcommit_ratio = 90

# smoother checkpoint/writeback behaviour
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3

# Optional: huge pages for shared_buffers — set vm.nr_hugepages to
# shared_buffers / 2MiB and huge_pages=on in postgresql.conf.
