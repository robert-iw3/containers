# Vault host: secrets must never hit disk.

# no swapping (also disable swap outright: swapoff -a + remove from fstab —
# prep-host.sh warns but does not edit fstab for you)
vm.swappiness = 0

# no core dumps or setuid dumps that could contain unsealed key material
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# the vault unit grants IPC_LOCK + LimitMEMLOCK=infinity so the server can
# mlock its memory; keep disable_mlock=false in production server config
