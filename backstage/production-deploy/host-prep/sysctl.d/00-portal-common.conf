# Baseline for every portal-stack VM: container networking, connection
# backlogs, watch/file limits. Applied by prep-host.sh before any role file.

# podman bridge networking (netavark) needs forwarding + bridge netfilter
net.ipv4.ip_forward = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# connection handling under load
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.ip_local_port_range = 1024 65535

# watchers + descriptors (node/java/git workloads)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
fs.file-max = 2097152

# prefer reclaiming cache over swapping services out
vm.swappiness = 10
