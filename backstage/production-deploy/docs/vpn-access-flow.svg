<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="bv-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00CA8E"/>
    </marker>
    <marker id="bv-broker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CA2171"/>
    </marker>
    <marker id="bv-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F05A28"/>
    </marker>
    <marker id="bv-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1DAEFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#16161B"/>
  <text x="700" y="40" fill="#FFFFFF" font-size="23" font-weight="600" text-anchor="middle">Backstage portal — remote developer access via VPN bastion</text>
  <text x="700" y="64" fill="#8A8A93" font-size="12" text-anchor="middle">Remote devs tunnel to the bastion; only from there is the portal reachable. No route to the internal network — nothing can be exfiltrated to a workstation.</text>

  <!-- zones -->
  <rect x="30" y="95" width="300" height="740" rx="10" fill="#0B0B0C" stroke="#4A4A52" stroke-width="1.5"/>
  <text x="180" y="120" fill="#8A8A93" font-size="13" font-weight="600" text-anchor="middle">INTERNET (untrusted)</text>

  <rect x="380" y="95" width="360" height="740" rx="10" fill="#0B0B0C" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="560" y="120" fill="#00CA8E" font-size="13" font-weight="600" text-anchor="middle">VPN BASTION (vpn role)</text>

  <rect x="790" y="95" width="580" height="740" rx="10" fill="#0B0B0C" stroke="#4A4A52" stroke-width="1.5"/>
  <text x="1080" y="120" fill="#8A8A93" font-size="13" font-weight="600" text-anchor="middle">PORTAL INTERNAL NETWORK (portal.network — never reachable from a workstation)</text>

  <!-- workstation -->
  <rect x="70" y="300" width="220" height="150" rx="8" fill="#25252B" stroke="#4A4A52" stroke-width="1.5"/>
  <text x="180" y="328" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Developer workstation</text>
  <text x="180" y="349" fill="#8A8A93" font-size="11" text-anchor="middle">Linux / macOS / Windows</text>
  <rect x="90" y="362" width="180" height="30" rx="5" fill="#16161B" stroke="#00CA8E" stroke-width="1"/>
  <text x="180" y="382" fill="#EAEAEA" font-size="11" text-anchor="middle">tailscale node (userspace)</text>
  <rect x="90" y="398" width="180" height="30" rx="5" fill="#16161B" stroke="#1DAEFF" stroke-width="1"/>
  <text x="180" y="418" fill="#EAEAEA" font-size="11" text-anchor="middle">SOCKS5 → localhost:27007</text>

  <!-- bastion -->
  <rect x="410" y="150" width="300" height="60" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="560" y="176" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">headscale — control plane</text>
  <text x="560" y="196" fill="#8A8A93" font-size="10.5" text-anchor="middle">deny-by-default policy · embedded DERP · :8080</text>

  <rect x="410" y="300" width="300" height="150" rx="8" fill="#25252B" stroke="#CA2171" stroke-width="1.5"/>
  <text x="560" y="328" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">bastion node + broker</text>
  <text x="560" y="349" fill="#8A8A93" font-size="11" text-anchor="middle">tailnet 100.64.0.1 (shared netns)</text>
  <rect x="430" y="362" width="260" height="30" rx="5" fill="#16161B" stroke="#CA2171" stroke-width="1"/>
  <text x="560" y="382" fill="#EAEAEA" font-size="10.5" text-anchor="middle">socat :27007 → portal · :9202 → Boundary</text>
  <rect x="430" y="398" width="260" height="30" rx="5" fill="#16161B" stroke="#F05A28" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="560" y="418" fill="#8A8A93" font-size="10.5" text-anchor="middle">no forwarder for anything else</text>

  <rect x="410" y="520" width="300" height="60" rx="8" fill="#25252B" stroke="#FFEC6E" stroke-width="1.5"/>
  <text x="560" y="546" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">CoreDNS — secure DNS</text>
  <text x="560" y="566" fill="#8A8A93" font-size="10.5" text-anchor="middle">DoT upstream · internal names · bastion-only</text>

  <!-- internal services -->
  <rect x="830" y="290" width="230" height="90" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="945" y="320" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Backstage portal</text>
  <text x="945" y="341" fill="#8A8A93" font-size="10.5" text-anchor="middle">nginx path router :27007</text>
  <text x="945" y="360" fill="#00CA8E" font-size="10.5" text-anchor="middle">reachable ONLY via the bastion</text>

  <rect x="830" y="420" width="230" height="80" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="945" y="448" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Boundary</text>
  <text x="945" y="468" fill="#8A8A93" font-size="10.5" text-anchor="middle">brokered resource access :9202</text>
  <text x="945" y="486" fill="#8A8A93" font-size="10.5" text-anchor="middle">deeper access is Boundary's job</text>

  <rect x="1120" y="180" width="200" height="64" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1220" y="208" fill="#EAEAEA" font-size="12.5" text-anchor="middle">Keycloak (OIDC)</text>
  <text x="1220" y="226" fill="#8A8A93" font-size="10" text-anchor="middle">identity</text>
  <rect x="1120" y="300" width="200" height="64" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1220" y="328" fill="#EAEAEA" font-size="12.5" text-anchor="middle">Postgres / Gitea</text>
  <text x="1220" y="346" fill="#8A8A93" font-size="10" text-anchor="middle">catalog · SCM</text>
  <rect x="1120" y="420" width="200" height="64" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1220" y="448" fill="#EAEAEA" font-size="12.5" text-anchor="middle">Vault · Consul</text>
  <text x="1220" y="466" fill="#8A8A93" font-size="10" text-anchor="middle">secrets · mesh</text>

  <!-- flows -->
  <path d="M270,372 C330,372 360,180 408,180" fill="none" stroke="#00CA8E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#bv-allow)"/>
  <text x="345" y="250" fill="#00CA8E" font-size="10" text-anchor="middle">register / policy</text>

  <path d="M290,388 C340,388 360,377 408,377" fill="none" stroke="#00CA8E" stroke-width="2.4" marker-end="url(#bv-allow)"/>
  <text x="350" y="368" fill="#00CA8E" font-size="10.5" font-weight="600" text-anchor="middle">WireGuard tunnel</text>

  <path d="M712,362 C760,362 790,340 828,335" fill="none" stroke="#CA2171" stroke-width="2.4" marker-end="url(#bv-broker)"/>
  <text x="770" y="352" fill="#CA2171" font-size="10.5" font-weight="600" text-anchor="middle">brokered :27007</text>
  <path d="M712,392 C760,410 790,445 828,455" fill="none" stroke="#CA2171" stroke-width="2" marker-end="url(#bv-broker)"/>
  <text x="770" y="430" fill="#CA2171" font-size="10" text-anchor="middle">brokered :9202</text>

  <path d="M560,518 L560,452" fill="none" stroke="#FFEC6E" stroke-width="1.6" marker-end="url(#bv-data)"/>
  <text x="620" y="490" fill="#FFEC6E" font-size="10" text-anchor="middle">resolve target</text>

  <path d="M1060,320 L1118,215" fill="none" stroke="#1DAEFF" stroke-width="1.4" marker-end="url(#bv-data)"/>
  <path d="M1060,335 L1118,332" fill="none" stroke="#1DAEFF" stroke-width="1.4" marker-end="url(#bv-data)"/>
  <path d="M1060,460 L1118,455" fill="none" stroke="#1DAEFF" stroke-width="1.4" marker-end="url(#bv-data)"/>
  <text x="1090" y="392" fill="#1DAEFF" font-size="9.5" text-anchor="middle">internal service mesh</text>

  <!-- DENIED -->
  <path d="M290,420 C620,760 900,700 1118,480" fill="none" stroke="#F05A28" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#bv-deny)"/>
  <circle cx="700" cy="726" r="15" fill="#16161B" stroke="#F05A28" stroke-width="2"/>
  <path d="M691,717 L709,735 M709,717 L691,735" stroke="#F05A28" stroke-width="2.2"/>
  <text x="700" y="762" fill="#F05A28" font-size="11" font-weight="600" text-anchor="middle">DENIED — no route, no broker, ACL block (no exfiltration path)</text>

  <!-- legend -->
  <rect x="70" y="500" width="220" height="150" rx="8" fill="#25252B" stroke="#4A4A52" stroke-width="1"/>
  <text x="82" y="522" fill="#EAEAEA" font-size="11" font-weight="600">Legend</text>
  <line x1="82" y1="540" x2="122" y2="540" stroke="#00CA8E" stroke-width="2.4"/><text x="130" y="544" fill="#8A8A93" font-size="10">encrypted tunnel (allowed)</text>
  <line x1="82" y1="562" x2="122" y2="562" stroke="#CA2171" stroke-width="2.4"/><text x="130" y="566" fill="#8A8A93" font-size="10">bastion broker forward</text>
  <line x1="82" y1="584" x2="122" y2="584" stroke="#1DAEFF" stroke-width="1.6"/><text x="130" y="588" fill="#8A8A93" font-size="10">internal data flow</text>
  <line x1="82" y1="606" x2="122" y2="606" stroke="#FFEC6E" stroke-width="1.6"/><text x="130" y="610" fill="#8A8A93" font-size="10">secure DNS</text>
  <line x1="82" y1="628" x2="122" y2="628" stroke="#F05A28" stroke-width="2" stroke-dasharray="7 5"/><text x="130" y="632" fill="#8A8A93" font-size="10">blocked / no path</text>
</svg>
