# Multi-host Airflow 3.x. The control host runs the metadata DB, broker, and the
# api-server/scheduler/dag-processor/triggerer; worker hosts run celery workers and
# scale horizontally. Every worker reaches the control host for the DB, broker, and
# HTTPS execution API, so airflow_advertise_host must be reachable cluster-wide.
#
# ansible_host           = the address Ansible SSHes to.
# airflow_advertise_host = the address the control host advertises to workers
#                          (private IP or DNS). Defaults to ansible_host.

[airflow_control]
airflow-control-1 ansible_host=10.0.2.10 airflow_advertise_host=10.0.2.10

[airflow_workers]
airflow-worker-1 ansible_host=10.0.2.21
airflow-worker-2 ansible_host=10.0.2.22
airflow-worker-3 ansible_host=10.0.2.23

[airflow_cluster:children]
airflow_control
airflow_workers

[airflow_cluster:vars]
ansible_user=ubuntu
