---
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-docker.io/apache/airflow:3.3.0}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    # Airflow 3.x uses the FAB auth manager for the admin UI/user creation.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow?sslmode=require
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # TLS for the api-server (UI/login and the execution API). Self-signed cert
    # generated by scripts/gen_tls_cert.sh; replace with a real cert for production.
    AIRFLOW__API__SSL_CERT: /opt/airflow/certs/tls.crt
    AIRFLOW__API__SSL_KEY: /opt/airflow/certs/tls.key
    # Workers/dag-processor/triggerer reach the api-server over the execution API,
    # now HTTPS. SSL_CERT_FILE/REQUESTS_CA_BUNDLE let them trust the self-signed cert.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'https://airflow-apiserver:8080/execution/'
    SSL_CERT_FILE: /opt/airflow/certs/tls.crt
    REQUESTS_CA_BUNDLE: /opt/airflow/certs/tls.crt
    # JWT secret signs the inter-component auth tokens (replaces the 2.x webserver secret key).
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__LAZY_LOAD_PLUGINS: 'false'
    # airflow is installed as a user-site venv under /home/airflow/.local. When the
    # container runs as an arbitrary UID (AIRFLOW_UID != 50000) the image relies on the
    # entrypoint rewriting HOME so python's user-site resolves the package. Under rootless
    # podman/OpenShift the arbitrary UID already resolves via NSS, so that rewrite is
    # skipped and `import airflow` fails. Pinning PYTHONPATH to the venv site-packages
    # (what the entrypoint itself does for root) makes the import work for any UID.
    # The examples/ and telemetry_pipeline/ dirs are mounted as subfolders of the DAGs
    # folder; adding them to PYTHONPATH lets sibling modules import each other
    # (e.g. telemetry_report does `from telemetry_etl import ...`).
    PYTHONPATH: /home/airflow/.local/lib/python3.13/site-packages:/opt/airflow/dags/telemetry_pipeline:/opt/airflow/dags/examples
    # Warehouse connection used by the telemetry_etl production DAG. Points at the bundled
    # postgres (own schema) so the pipeline is verifiable out of the box; repoint at a real
    # analytics warehouse for production.
    AIRFLOW_CONN_TELEMETRY_WAREHOUSE: 'postgresql://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow?sslmode=require'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/telemetry_pipeline:/opt/airflow/dags/telemetry_pipeline
    - ${AIRFLOW_PROJ_DIR:-.}/example_dags:/opt/airflow/dags/examples
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/certs:/opt/airflow/certs:ro
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:18}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
      start_period: 5s
    restart: always
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem", "-c", "ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key"]

  redis:
    image: ${REDIS_IMAGE:-docker.io/redis:latest}
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "-k", "https://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      # The ping re-imports airflow on each call (slow with the user-site venv), so allow
      # a generous timeout/start_period to avoid the healthcheck flapping the worker.
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 45s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # The airflow entrypoint runs `db migrate` and creates the admin user from the
    # _AIRFLOW_DB_MIGRATE / _AIRFLOW_WWW_USER_* env vars below. (The previous script
    # had two `exec`s, so the first replaced the shell and user creation never ran.)
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume: