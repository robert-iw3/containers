---
###############################################################
#                Authelia configuration (4.38)               #
###############################################################
# Templated with the built-in filter: enable it in the container with
#   X_AUTHELIA_CONFIG_FILTERS=template
# `{{ env "VAR" }}` values are supplied by docker-compose.yml (non-secret:
# domains/URLs). Scalar secrets are injected out-of-band via AUTHELIA_*_FILE
# environment variables pointing at ./authelia/secrets/* (git-ignored), so no
# secret material lives in this file. The only exception is the OIDC client
# secret *hash* (pbkdf2), which must live in the clients list — it is passed by
# env and never committed.

theme: light

server:
  address: 'tcp://:9091/'

log:
  level: info
  format: text

totp:
  issuer: '{{ env "TPL_AUTHELIA_DOMAIN" }}'

# jwt secret for password-reset identity tokens is provided via
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/secrets/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

access_control:
  # forward-auth requests (the Traefik dashboard) are evaluated here; the
  # OIDC flow is governed per-client by authorization_policy below.
  default_policy: deny
  rules:
    - domain: '{{ env "TRAEFIK_DOMAIN" }}'
      policy: one_factor

session:
  # secret provided via AUTHELIA_SESSION_SECRET_FILE
  cookies:
    - name: authelia_session
      domain: '{{ env "TPL_COOKIE_DOMAIN" }}'
      authelia_url: '{{ env "TPL_AUTHELIA_URL" }}'
      # No default_redirection_url: it must share the cookie scope, and the
      # portal falls back to the user menu when hit without a redirect target.
      expiration: '1 hour'
      inactivity: '5 minutes'
  redis:
    host: redis
    port: 6379
    # password provided via AUTHELIA_SESSION_REDIS_PASSWORD_FILE
    database_index: 1

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  # encryption_key provided via AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  local:
    path: /config/db.sqlite3

notifier:
  # Swap for the smtp notifier in production.
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    # hmac_secret provided via AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
    # signing key provided via
    #   AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE
    clients:
      - client_id: owncloud
        client_name: ownCloud
        # pbkdf2 hash of the plaintext secret (env, never committed):
        client_secret: '{{ env "OIDC_OWNCLOUD_CLIENT_SECRET_HASH" }}'
        public: false
        authorization_policy: one_factor
        require_pkce: false
        redirect_uris:
          - '{{ env "OWNCLOUD_OIDC_REDIRECT_URI" }}'
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
...
