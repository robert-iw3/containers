# HAProxy demo configuration used by the compose stack and the UAT. Terminates
# TLS with the combined PEM at /etc/haproxy/tls/haproxy.pem and routes one host
# to the bundled whoami backend. The Quadlet deployment renders the equivalent
# from stack.yaml routes (ansible/templates/haproxy.cfg.j2), so this file and
# that template stay in lock-step: one host ACL + backend per route.
global
    log stdout format raw local0 info
    maxconn 10000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3

# Redirect plain HTTP to HTTPS. Binds high ports so the container runs as the
# non-root haproxy user; publish/map them to 80/443 on the host as needed.
frontend http_in
    bind :8080
    http-request redirect scheme https code 301 unless { ssl_fc }

# TLS frontend: terminate, add proxy/security headers, route by Host.
frontend https_in
    bind :8443 ssl crt /etc/haproxy/tls/haproxy.pem
    http-request set-header X-Forwarded-Proto https
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains"

    # Host header/:authority minus any port, lowercased, so matching works over
    # both HTTP/1.1 and HTTP/2 and regardless of the published port.
    http-request set-var(txn.host) hdr(host),field(1,:),lower

    acl host_app var(txn.host) -m str -i app.localhost
    use_backend be_app if host_app
    default_backend be_noroute

backend be_app
    server s1 whoami:80 check

# Unknown Host -> 404 (no route).
backend be_noroute
    http-request deny deny_status 404

# Stats + health endpoint, published internally only.
listen stats
    bind :8404
    stats enable
    stats uri /stats
    monitor-uri /health
