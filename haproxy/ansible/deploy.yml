---
# Deploy the HAProxy reverse proxy as a Podman Quadlet (systemd) unit. Reads
# stack.yaml for the image and routes; renders haproxy.cfg from routes so the
# proxy fronts whatever backends stack.yaml declares.
#
#   ansible-playbook -i inventory.ini deploy.yml
#
# Drop a combined cert+key PEM into ansible/files/tls/haproxy.pem first
# (see files/tls/README.md).
- name: Deploy the HAProxy reverse proxy
  hosts: proxy
  become: true
  gather_facts: true
  tasks:
    - name: Require the podman runtime for the Quadlet deployment
      ansible.builtin.assert:
        that:
          - container_runtime == 'podman'
        fail_msg: >-
          container_runtime is '{{ container_runtime }}'. The Quadlet
          deployment requires Podman; use docker-compose.yml for a Docker
          single-host runtime.

    - name: Install podman
      ansible.builtin.package:
        name: podman
        state: present

    - name: Ensure the Quadlet and config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ quadlet_dir }}"
        - "{{ conf_dir }}"
        - "{{ tls_dir }}"

    - name: Render haproxy.cfg from stack.yaml routes
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: "{{ conf_dir }}/haproxy.cfg"
        mode: "0644"

    - name: Install the combined TLS PEM for the proxy
      ansible.builtin.copy:
        src: "files/tls/{{ item.src }}"
        dest: "{{ tls_dir }}/{{ item.src }}"
        mode: "{{ item.mode }}"
      loop: "{{ tls_files }}"

    - name: Deploy the proxy network Quadlet unit
      ansible.builtin.include_tasks: tasks/deploy_quadlet.yml
      vars:
        q_name: haproxy
        q_kind: network

    - name: Deploy the proxy container Quadlet unit
      ansible.builtin.include_tasks: tasks/deploy_quadlet.yml
      vars:
        q_name: haproxy
        q_kind: container

    - name: Wait for the proxy to report healthy
      ansible.builtin.command: podman healthcheck run haproxy-proxy
      register: proxy_health
      until: proxy_health.rc == 0
      retries: 12
      delay: 5
      changed_when: false
