# $SPLUNK_HOME/etc/system/local/inputs.conf

# data input from UF
[splunktcp-ssl://9997]
disabled = 0
serverCert = /opt/splunk/etc/auth/mycerts/splunk-cert.pem
sslPassword = <private-password-of-splunk-cert.key>
requireClientCert = 1
# Both senders present a client certificate here: forwarders directly, and the
# Cribl worker's splunk_lb Destination. Name every common name that may
# connect; a sender whose CN is absent is refused at the handshake, which reads
# from the sending side as a network fault.
sslCommonNameToCheck = splunkuf, cribl-worker
sslAltNameToCheck = splunkuf, cribl-worker
acceptFrom = 123.123.123.0/24
