# Line breaking for event XML read from a file.
#
# Splunk_TA_windows sets INDEXED_EXTRACTIONS = XMLKV-WINEVT for the
# channel source types (XmlWinEventLog:<channel>) but supplies LINE_BREAKER
# only under [XmlWinEventLog]. On a real Windows host that is correct: the
# event log input hands splunkd one discrete event at a time, so there is
# nothing to break. Reading the same events back from a file is different --
# with no LINE_BREAKER the default SHOULD_LINEMERGE = true applies, events
# are glued together until MAX_EVENTS (256) trips, and the structured parser
# gives up. The symptom is events with a correct EventCode but no Image,
# CommandLine or ParentImage, all sharing one timestamp.
#
# This add-on belongs on whatever reads the files -- a universal forwarder
# or the indexer itself. Structured-data parsing happens where the file is
# read, not downstream.

[XmlWinEventLog:Security]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event\s
INDEXED_EXTRACTIONS = XMLKV-WINEVT
extraction_cutoff = 65536
TIME_PREFIX = <TimeCreated SystemTime="
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event\s
INDEXED_EXTRACTIONS = XMLKV-WINEVT
extraction_cutoff = 65536
TIME_PREFIX = <TimeCreated SystemTime="
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

[XmlWinEventLog:System]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event\s
INDEXED_EXTRACTIONS = XMLKV-WINEVT
extraction_cutoff = 65536
TIME_PREFIX = <TimeCreated SystemTime="
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

[XmlWinEventLog:Application]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event\s
INDEXED_EXTRACTIONS = XMLKV-WINEVT
extraction_cutoff = 65536
TIME_PREFIX = <TimeCreated SystemTime="
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

# Sysmon for Linux emits the same element structure without the namespace
# attribute, so it needs its own breaker and its own extraction setting --
# no Windows add-on claims this source type.
[sysmon:linux]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event>
INDEXED_EXTRACTIONS = XMLKV-WINEVT
extraction_cutoff = 65536
TIME_PREFIX = <TimeCreated SystemTime="
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

# Search-time field expansion for event XML that uses double-quoted
# EventData attributes. Harmless where the vendor add-on already matched.
[XmlWinEventLog]
REPORT-datagen_eventdata = datagen_eventdata_dq

[sysmon:linux]
REPORT-datagen_eventdata = datagen_eventdata_dq
