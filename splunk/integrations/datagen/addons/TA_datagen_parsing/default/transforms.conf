# Expand <Data Name='X'>Y</Data> pairs into fields X=Y.
#
# Splunk_TA_windows already does this, but its regex matches single-quoted
# attributes only, because that is how Windows renders an event log to XML.
# Event XML written by any other producer is likely to use double quotes,
# which is valid XML and parses everywhere except here: the events index
# cleanly, EventCode resolves, and then every EventData field is silently
# missing. Detection rules that key on Image or CommandLine match nothing
# and the failure looks like a rule problem.
#
# This covers the double-quoted form so either shape yields the same fields.
# MV_ADD is off: if the vendor transform already produced the field, adding
# a second identical value would make it multivalue and break exact matches.

[datagen_eventdata_dq]
REGEX = <Data Name="([^"]+)"\s*\/?>([^<]*)
FORMAT = $1::$2
MV_ADD = 0
