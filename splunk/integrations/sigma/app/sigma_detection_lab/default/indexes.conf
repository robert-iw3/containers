# Detection results, kept apart from the raw data they were found in.
# Retention here is longer than raw retention usually is: an alert stays
# useful after the event that produced it has rolled off.
[sigma_alerts]
homePath   = $SPLUNK_DB/sigma_alerts/db
coldPath   = $SPLUNK_DB/sigma_alerts/colddb
thawedPath = $SPLUNK_DB/sigma_alerts/thaweddb
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 31536000

# Engine telemetry. _audit and _internal hold the same numbers but roll off
# on their own schedule and are not retained for capacity work, so the daily
# rollup keeps a small, long-lived copy. One row per batch per day, so this
# stays tiny.
[sigma_engine_kpi]
homePath   = $SPLUNK_DB/sigma_engine_kpi/db
coldPath   = $SPLUNK_DB/sigma_engine_kpi/colddb
thawedPath = $SPLUNK_DB/sigma_engine_kpi/thaweddb
maxTotalDataSizeMB = 128
frozenTimePeriodInSecs = 63072000

# Case work: who looked at a detection, what they found, and how it ended.
#
# Append-only. Opening a case, adding a note, attaching evidence and
# resolving are all separate events; the current state of a case is derived
# by taking the latest of each field. Nothing is ever overwritten, so the
# record of who decided what, and when, survives -- which is the whole
# point of keeping it for a DFIR team rather than editing a lookup in place.
#
# Retention is longer than the detections themselves: the reasoning behind
# a decision outlives the event that prompted it.
[sigma_cases]
homePath   = $SPLUNK_DB/sigma_cases/db
coldPath   = $SPLUNK_DB/sigma_cases/colddb
thawedPath = $SPLUNK_DB/sigma_cases/thaweddb
maxTotalDataSizeMB = 256
frozenTimePeriodInSecs = 94608000
