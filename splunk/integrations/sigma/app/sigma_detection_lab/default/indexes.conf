# Detection results, kept apart from the raw data they were found in.
# Retention here is longer than raw retention usually is: an alert stays
# useful after the event that produced it has rolled off.
[sigma_alerts]
homePath   = $SPLUNK_DB/sigma_alerts/db
coldPath   = $SPLUNK_DB/sigma_alerts/colddb
thawedPath = $SPLUNK_DB/sigma_alerts/thaweddb
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 31536000
