# Daily rollup of detections per rule per host. The trend dashboard reads
# this instead of re-aggregating the raw detection index on every load, and
# it is what a baseline is computed from.
[Sigma - Daily detection rollup]
description = Rolls detections up per rule, host and day into the summary index that the trend view reads.
search = `sigma_detections` | bin _time span=1d | stats count as detections, sum(sigma_match_count) as matches, values(sigma_level) as sigma_level, values(sigma_confidence) as sigma_confidence, values(sigma_disposition) as sigma_disposition by _time, sigma_rule, sigma_rule_id, sigma_src_host | collect index=sigma_alerts sourcetype=sigma:rollup
counttype = number of events
relation = greater than
quantity = 0
enableSched = 1
cron_schedule = 20 1 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
alert.severity = 1
alert.suppress = 0
alert.track = 0
request.ui_dispatch_app = sigma_detection_lab
request.ui_dispatch_view = search
action.email = 0

# Flags a rule firing well above its own recent norm. This is the anomaly
# half of the question: not "did it fire" but "did it fire unlike itself".
# stdev over the rule's own history, so a noisy rule is not flagged for
# being noisy -- only for changing.
[Sigma - Detection volume anomaly]
description = Alerts when a rule's daily detection count exceeds its own fourteen-day norm by more than three standard deviations.
search = index=sigma_alerts sourcetype=sigma:rollup earliest=-15d@d latest=now | bin _time span=1d | stats sum(detections) as detections by _time, sigma_rule, sigma_rule_id | eventstats avg(detections) as baseline, stdev(detections) as sigma by sigma_rule_id | where _time >= relative_time(now(), "-1d@d") AND sigma > 0 AND detections > baseline + (3 * sigma) | eval sigma_anomaly_factor=round((detections - baseline) / sigma, 1), sigma_rule_baseline=round(baseline, 1) | sort - sigma_anomaly_factor
counttype = number of events
relation = greater than
quantity = 0
enableSched = 1
cron_schedule = 40 1 * * *
dispatch.earliest_time = -15d@d
dispatch.latest_time = now
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 24h
alert.suppress.fields = sigma_rule_id
alert.track = 1
request.ui_dispatch_app = sigma_detection_lab
request.ui_dispatch_view = search
action.email = 0

# A rule firing on a host it has never fired on before. First-seen is a
# different signal from volume: one event on a new host can matter more
# than a hundred on a familiar one.
[Sigma - First seen on host]
description = Reports a rule firing on a host where it has not fired in the preceding fourteen days.
search = index=sigma_alerts sourcetype=sigma:rollup earliest=-15d@d latest=now | stats min(_time) as first_seen, sum(detections) as detections by sigma_rule, sigma_rule_id, sigma_src_host | where first_seen >= relative_time(now(), "-1d@d") | eval first_seen=strftime(first_seen, "%F %T") | sort - detections
counttype = number of events
relation = greater than
quantity = 0
enableSched = 1
cron_schedule = 50 1 * * *
dispatch.earliest_time = -15d@d
dispatch.latest_time = now
alert.severity = 3
alert.suppress = 0
alert.track = 1
request.ui_dispatch_app = sigma_detection_lab
request.ui_dispatch_view = search
action.email = 0
