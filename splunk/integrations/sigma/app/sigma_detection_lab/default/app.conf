# Sigma detection lab. Holds converted Sigma rules as saved searches, the
# ground truth for a generated dataset, and dashboards that score one
# against the other.
[install]
state = enabled
is_configured = 1

[ui]
is_visible = 1
label = Sigma Detection Lab

[launcher]
author = containers/splunk/integrations/sigma
description = Converted Sigma detection rules, scored against a labelled dataset
version = 0.1.0

[package]
id = sigma_detection_lab
