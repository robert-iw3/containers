# collect writes summary events; naming the source type keeps detection
# results separable from everything else in the index.
[sigma:alert]
SHOULD_LINEMERGE = false
KV_MODE = auto
EVAL-sigma_attack_count = if(isnull(sigma_attack) OR sigma_attack=="", 0, mvcount(split(sigma_attack,",")))
FIELDALIAS-signature = sigma_rule AS signature
FIELDALIAS-signature_id = sigma_rule_id AS signature_id
EVAL-severity = case(sigma_level=="critical","critical", sigma_level=="high","high", sigma_level=="medium","medium", sigma_level=="low","low", true(),"informational")
