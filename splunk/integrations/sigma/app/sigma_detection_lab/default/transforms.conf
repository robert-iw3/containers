# Ground truth as a lookup, so a dashboard can score detections in SPL
# rather than the operator comparing two screens by eye.
[sigma_ground_truth]
filename = sigma_ground_truth.csv
case_sensitive_match = false

# Tuning lives here rather than in the rules. Editing a packaged rule means
# a reinstall silently undoes the tuning; a lookup is instance state and
# survives. A blank sigma_rule_id allowlists every rule on that host, and a
# blank sigma_src_host allowlists that rule everywhere.
[sigma_allowlist]
filename = sigma_allowlist.csv
case_sensitive_match = false
max_matches = 1

# Per-rule metadata, written by bin/build-engine.py. The detection searches
# evaluate many rules at once, so a detection arrives knowing only which
# rule id matched; this is where it gets its name, severity and ATT&CK
# mapping, and it is what the dashboards read instead of five hundred saved
# search definitions.
[sigma_rules]
filename = sigma_rules.csv
case_sensitive_match = false

# ATT&CK technique names, so a dashboard can show "Rundll32" rather than
# T1218.011. Built from the MITRE ATT&CK STIX bundle.
[mitre_techniques]
filename = mitre_techniques.csv
case_sensitive_match = false
