# The index holding the generated dataset. Changing it here repoints every
# dashboard and saved search at once.
[sigma_lab_index]
definition = index=linux_lab
iseval = 0

# Ground truth for the planted scenarios, loaded from the dataset's
# ground-truth.json by bin/load-ground-truth.py.
[sigma_lab_truth]
definition = inputlookup sigma_ground_truth.csv
iseval = 0

# Detections minus anything the operator has allowlisted. Every dashboard
# reads through this, so tuning takes effect in one place.
[sigma_detections]
definition = index=sigma_alerts | lookup sigma_allowlist sigma_rule_id, sigma_src_host OUTPUT reason as sigma_allowlisted | where isnull(sigma_allowlisted)
iseval = 0

# The rolling baseline a trend is measured against.
[sigma_baseline_window]
definition = earliest=-14d@d latest=@d
iseval = 0

# The current state of every case, derived from its journal. Each action is
# its own event, so "latest" per field gives the state now while the events
# behind it stay readable as a history.
[sigma_case_state]
definition = index=sigma_cases | stats earliest(_time) as opened, latest(_time) as last_touched, latest(case_title) as case_title, latest(case_status) as case_status, latest(case_resolution) as case_resolution, latest(case_analyst) as case_analyst, latest(sigma_rule) as sigma_rule, latest(sigma_rule_id) as sigma_rule_id, latest(sigma_src_host) as sigma_src_host, latest(case_severity) as case_severity, count as actions by case_id | eval case_status=coalesce(case_status,"open")
iseval = 0

# A case id derived from the detection it concerns, so opening a case twice
# for the same thing lands on the same case rather than creating a second.
[sigma_case_id(3)]
args = rule_id, host, when
definition = eval case_id=substr(md5($rule_id$."|".$host$."|".$when$),1,12)
iseval = 0
