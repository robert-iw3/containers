# Sigma2SplunkAlert configuration.
#
# Defaults are deliberately conservative. The email action, summary
# indexing and the whitelist transformation are all off, because each
# costs something on every scheduled run and none of them is safe to
# enable before the referenced index, lookup and mail server exist.

alert_action:
  email:
    # Off by default: one email per rule per firing, on every cron tick.
    enabled: 0
    to: 'ticketing@example.com'

# Detection results go to their own index. This is the integration's primary
# output: an alert action notifies a person, while a written event is
# searchable, reportable, and retained on its own schedule. The index must
# exist before the first run, or the write is discarded without an error.
# Where the rules look. A saved search with no index scope searches only
# the role's default indexes, which on a stock instance is 'main'. Point
# this at your Windows and Linux data; the macro is defined in the app so an
# operator changes it in one place.
index_scope: '`sigma_lab_index`'

alert_index:
  enabled: true
  index: 'sigma_alerts'
  sourcetype: 'sigma:alert'

search_transformations:
  # Requires sigma_whitelist.csv to exist as a lookup, or every search
  # errors at dispatch.
  - type: whitelist
    enabled: false
    lookup: 'sigma_whitelist.csv'
  # "level" is Sigma rule metadata, not an event field, so this evaluates
  # to 0 for every event unless the search puts a level field in scope.
  - type: custom_command
    enabled: false
    command: 'eval threat_level=case(level=="high", 3, level=="medium", 2, level=="low", 1, true(), 0)'
  - type: cim_tags
    enabled: true

# One detection per group, not one per matching event. A rule that matches
# eighty failed logons should produce one finding that says eighty, not
# eighty findings. correlation_fields names the entity a detection is about:
# the same rule firing on another host is a separate finding worth seeing.
#
# min_matches is a floor on how many matches make a finding. Left at 1,
# because a Sigma rule carries no threshold of its own and raising it here
# would silently drop single-event detections, which for something like a
# credential dumper is the only event there will be.
alerting:
  correlation_fields: 'host'
  # A trend rule needs more than one match before it claims anything. An
  # immediate rule is always 1: for a severe, specific detection the single
  # event is often the only one there will be.
  trend_min_matches: 2

# Alert severity is taken from each rule's Sigma level, not set globally.
cron_schedule: '*/10 * * * *'

# The scheduler distributes the start times itself. allow_skew only applies
# to */M crons, so computing per-rule cron minutes would defeat it.
allow_skew: '100%'

# A condition that persists should not re-alert every cycle. Suppression is
# per host by default: the same rule firing on a different host is a
# different thing worth knowing about.
suppress:
  enabled: 1
  period: '1h'
  trend_period: '24h'
  fields: 'host'
earliest_time: '-10m'
latest_time: 'now'
app: 'sigma_detection_lab'

# Local rule paths. Network sources need --allow-network, which the
# air-gapped target cannot use.
sigma_sources:
  - './rules'
