<svg width="1240" height="880" viewBox="0 0 1240 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Liberation Sans,Arial,sans-serif">
  <defs>
    <marker id="a-collect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00CA8E"/></marker>
    <marker id="a-sigma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19C1EB"/></marker>
    <marker id="a-pivot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A93"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#16161B"/>
  <text x="620" y="38" fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">Sigma Rule Analyzer for Splunk — Components and Data Flow</text>
  <text x="620" y="60" fill="#8A8A93" font-size="12.5" text-anchor="middle">The logs are already arriving. This integration reads them where they sit, matches Sigma rules, and keeps what matched in its own index.</text>

  <!-- ================= Band 1: what is already in place ================= -->
  <rect x="24" y="82" width="1192" height="176" rx="10" fill="#0B0B0C" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="46" y="106" fill="#00CA8E" font-size="11.5" font-weight="600">ALREADY IN PLACE — NOTHING NEW ON THE ENDPOINTS</text>

  <rect x="56" y="122" width="300" height="118" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <circle cx="82" cy="148" r="13" fill="#00CA8E"/><text x="82" y="153" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="206" y="153" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Windows and Linux hosts</text>
  <text x="206" y="175" fill="#8A8A93" font-size="11" text-anchor="middle">Event logs, Sysmon, auditd, secure log.</text>
  <text x="206" y="191" fill="#8A8A93" font-size="11" text-anchor="middle">A forwarder is already collecting them.</text>
  <rect x="76" y="203" width="260" height="24" rx="5" fill="#16161B" stroke="#00CA8E"/>
  <text x="206" y="220" fill="#EAEAEA" font-size="10.5" text-anchor="middle">universal forwarder, or an HF collection point</text>

  <rect x="446" y="122" width="330" height="118" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <circle cx="472" cy="148" r="13" fill="#00CA8E"/><text x="472" y="153" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="611" y="153" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Official Splunk add-ons</text>
  <text x="611" y="175" fill="#8A8A93" font-size="11" text-anchor="middle">Parse the events and normalize them to CIM.</text>
  <text x="611" y="191" fill="#8A8A93" font-size="11" text-anchor="middle">This integration adds no parsing of its own.</text>
  <rect x="466" y="203" width="290" height="24" rx="5" fill="#16161B" stroke="#00CA8E"/>
  <text x="611" y="220" fill="#EAEAEA" font-size="10.5" text-anchor="middle">Splunk_TA_windows · Splunk_TA_nix</text>

  <rect x="866" y="122" width="300" height="118" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <circle cx="892" cy="148" r="13" fill="#00CA8E"/><text x="892" y="153" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="1016" y="153" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Your existing indexes</text>
  <text x="1016" y="175" fill="#8A8A93" font-size="11" text-anchor="middle">The raw logs stay exactly where they are.</text>
  <text x="1016" y="191" fill="#8A8A93" font-size="11" text-anchor="middle">Nothing is copied or duplicated.</text>
  <rect x="886" y="203" width="260" height="24" rx="5" fill="#16161B" stroke="#00CA8E"/>
  <text x="1016" y="220" fill="#EAEAEA" font-size="10.5" text-anchor="middle">XmlWinEventLog · linux_audit · linux_secure</text>

  <path d="M356,181 L446,181" stroke="#00CA8E" stroke-width="1.6" fill="none" marker-end="url(#a-collect)"/>
  <path d="M776,181 L866,181" stroke="#00CA8E" stroke-width="1.6" fill="none" marker-end="url(#a-collect)"/>

  <!-- ================= Band 2: rule supply ================= -->
  <rect x="24" y="286" width="1192" height="168" rx="10" fill="#0B0B0C" stroke="#19C1EB" stroke-width="1.5"/>
  <text x="46" y="310" fill="#19C1EB" font-size="11.5" font-weight="600">RULE SUPPLY — RUNS ONCE, OR WHENEVER RULES ARE REFRESHED</text>

  <rect x="56" y="326" width="262" height="110" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="82" cy="352" r="13" fill="#19C1EB"/><text x="82" y="357" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <text x="187" y="357" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">SigmaHQ releases</text>
  <text x="187" y="379" fill="#8A8A93" font-size="11" text-anchor="middle">Versioned, hash-checkable rule sets.</text>
  <rect x="76" y="397" width="222" height="24" rx="5" fill="#16161B" stroke="#19C1EB"/>
  <text x="187" y="414" fill="#EAEAEA" font-size="10.5" text-anchor="middle">fetch-rules.py · offline bundle</text>

  <rect x="358" y="326" width="300" height="110" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="384" cy="352" r="13" fill="#19C1EB"/><text x="384" y="357" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">5</text>
  <text x="508" y="357" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Convert to SPL</text>
  <text x="508" y="379" fill="#8A8A93" font-size="11" text-anchor="middle">pySigma, with a pipeline mapping each</text>
  <text x="508" y="395" fill="#8A8A93" font-size="11" text-anchor="middle">Sigma log source to a real source type.</text>
  <rect x="378" y="403" width="260" height="24" rx="5" fill="#16161B" stroke="#19C1EB"/>
  <text x="508" y="420" fill="#EAEAEA" font-size="10.5" text-anchor="middle">sigma2splunkalert.py · pipelines/</text>

  <rect x="698" y="326" width="468" height="110" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="724" cy="352" r="13" fill="#19C1EB"/><text x="724" y="357" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">6</text>
  <text x="932" y="357" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Saved searches, inside the app</text>
  <text x="932" y="379" fill="#8A8A93" font-size="11" text-anchor="middle">One scheduled search per rule. Severity comes from the rule's own level,</text>
  <text x="932" y="395" fill="#8A8A93" font-size="11" text-anchor="middle">and the stanza name carries the Sigma rule id so it stays traceable.</text>
  <rect x="718" y="403" width="428" height="24" rx="5" fill="#16161B" stroke="#19C1EB"/>
  <text x="932" y="420" fill="#EAEAEA" font-size="10.5" text-anchor="middle">savedsearches.conf — counttype / relation / quantity, not the REST names</text>

  <path d="M318,381 L358,381" stroke="#19C1EB" stroke-width="1.6" fill="none" marker-end="url(#a-sigma)"/>
  <path d="M658,381 L698,381" stroke="#19C1EB" stroke-width="1.6" fill="none" marker-end="url(#a-sigma)"/>

  <!-- ================= Band 3: the analysis ================= -->
  <rect x="24" y="482" width="1192" height="196" rx="10" fill="#0B0B0C" stroke="#19C1EB" stroke-width="1.5"/>
  <text x="46" y="506" fill="#19C1EB" font-size="11.5" font-weight="600">THE ANALYSIS — ON A SCHEDULE</text>

  <rect x="56" y="522" width="430" height="138" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="82" cy="548" r="13" fill="#19C1EB"/><text x="82" y="553" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">7</text>
  <text x="271" y="553" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Each rule searches the raw logs</text>
  <text x="271" y="575" fill="#8A8A93" font-size="11" text-anchor="middle">The search reads the existing indexes in place. What matched is</text>
  <text x="271" y="591" fill="#8A8A93" font-size="11" text-anchor="middle">labelled with the rule that found it, then written on. Where the</text>
  <text x="271" y="607" fill="#8A8A93" font-size="11" text-anchor="middle">event came from is captured before the write, or the trail is lost.</text>
  <rect x="76" y="619" width="390" height="24" rx="5" fill="#16161B" stroke="#19C1EB"/>
  <text x="271" y="636" fill="#EAEAEA" font-size="10.5" text-anchor="middle">eval sigma_rule, sigma_level, sigma_attack, sigma_src_* | collect</text>

  <rect x="566" y="522" width="300" height="138" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="592" cy="548" r="13" fill="#19C1EB"/><text x="592" y="553" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">8</text>
  <text x="716" y="553" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">sigma_alerts index</text>
  <text x="716" y="575" fill="#8A8A93" font-size="11" text-anchor="middle">One detection event per match. Kept</text>
  <text x="716" y="591" fill="#8A8A93" font-size="11" text-anchor="middle">apart from the raw data so it can be</text>
  <text x="716" y="607" fill="#8A8A93" font-size="11" text-anchor="middle">retained longer and searched cheaply.</text>
  <rect x="586" y="619" width="260" height="24" rx="5" fill="#16161B" stroke="#19C1EB"/>
  <text x="716" y="636" fill="#EAEAEA" font-size="10.5" text-anchor="middle">sourcetype = sigma:alert</text>

  <rect x="946" y="522" width="220" height="138" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1056" y="553" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">What is in it</text>
  <text x="1056" y="575" fill="#8A8A93" font-size="11" text-anchor="middle">the rule and its id</text>
  <text x="1056" y="591" fill="#8A8A93" font-size="11" text-anchor="middle">severity and ATT&amp;CK</text>
  <text x="1056" y="607" fill="#8A8A93" font-size="11" text-anchor="middle">the matching event's fields</text>
  <text x="1056" y="623" fill="#8A8A93" font-size="11" text-anchor="middle">its index, source type, host</text>
  <text x="1056" y="639" fill="#8A8A93" font-size="11" text-anchor="middle">and the time it happened</text>

  <!-- rules reach down into the raw indexes, then results flow right -->
  <path d="M932,436 L932,470 L271,470 L271,522" stroke="#19C1EB" stroke-width="1.6" fill="none" marker-end="url(#a-sigma)"/>
  <rect x="470" y="452" width="262" height="22" rx="4" fill="#16161B"/>
  <text x="601" y="468" fill="#19C1EB" font-size="10.5" text-anchor="middle">the scheduler runs each rule's search</text>

  <path d="M1016,240 L1016,268 L160,268 L160,522" stroke="#00CA8E" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#a-collect)"/>
  <rect x="470" y="250" width="262" height="22" rx="4" fill="#16161B"/>
  <text x="601" y="266" fill="#00CA8E" font-size="10.5" text-anchor="middle">read in place — the raw logs are not moved</text>

  <path d="M486,591 L566,591" stroke="#19C1EB" stroke-width="1.6" fill="none" marker-end="url(#a-sigma)"/>

  <!-- ================= Band 4: the app ================= -->
  <rect x="24" y="706" width="1192" height="150" rx="10" fill="#0B0B0C" stroke="#19C1EB" stroke-width="1.5"/>
  <text x="46" y="730" fill="#19C1EB" font-size="11.5" font-weight="600">WHAT AN ANALYST OPENS</text>

  <rect x="56" y="744" width="520" height="96" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="82" cy="770" r="13" fill="#19C1EB"/><text x="82" y="775" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">9</text>
  <text x="316" y="775" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">sigma_detection_lab — Detection Coverage</text>
  <text x="316" y="797" fill="#8A8A93" font-size="11" text-anchor="middle">Tiles answer whether anything is wrong before a table is read: count,</text>
  <text x="316" y="813" fill="#8A8A93" font-size="11" text-anchor="middle">critical and high, rules fired, hosts affected, techniques seen.</text>
  <rect x="76" y="822" width="480" height="12" rx="3" fill="#16161B"/>

  <rect x="616" y="744" width="550" height="96" rx="8" fill="#25252B" stroke="#19C1EB" stroke-width="1.5"/>
  <circle cx="642" cy="770" r="13" fill="#19C1EB"/><text x="642" y="775" fill="#0B0B0C" font-size="13" font-weight="700" text-anchor="middle">10</text>
  <text x="891" y="775" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Alert Detail — and back to the evidence</text>
  <text x="891" y="797" fill="#8A8A93" font-size="11" text-anchor="middle">Select a detection and the Windows or Linux events behind it load</text>
  <text x="891" y="813" fill="#8A8A93" font-size="11" text-anchor="middle">beneath it, from the index the detection recorded it came from.</text>
  <rect x="636" y="822" width="510" height="12" rx="3" fill="#16161B"/>

  <path d="M716,660 L716,706" stroke="#19C1EB" stroke-width="1.6" fill="none" marker-end="url(#a-sigma)"/>

  <!-- the pivot: from the app back to the original logs -->
  <path d="M1166,792 L1200,792 L1200,181 L1166,181" stroke="#8A8A93" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a-pivot)"/>
  <rect x="1082" y="480" width="150" height="40" rx="4" fill="#16161B"/>
  <text x="1157" y="496" fill="#8A8A93" font-size="10.5" text-anchor="middle">pivot back to the</text>
  <text x="1157" y="510" fill="#8A8A93" font-size="10.5" text-anchor="middle">log that triggered it</text>
</svg>
