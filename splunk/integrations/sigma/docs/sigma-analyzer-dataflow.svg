<svg width="1280" height="1020" viewBox="0 0 1280 1020" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Liberation Sans,Arial,sans-serif">
  <title>Sigma Rule Analyzer for Splunk — components and data flow</title>

  <defs>
    <!-- Bands are translucent rather than solid, so the surface reads through
         them and the depth comes from layering instead of from heavier lines. -->
    <linearGradient id="bandExisting" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00CA8E" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#00CA8E" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="bandBuild" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="bandEngine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19C1EB" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#19C1EB" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bandRead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.085"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>

    <!-- A single soft shadow, used sparingly: only the engine card is lifted,
         because it is the one component that is new. -->
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#19C1EB" flood-opacity="0.30"/>
    </filter>

    <marker id="arrEx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00CA8E"/></marker>
    <marker id="arrBuild" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arrSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#19C1EB"/></marker>
    <marker id="arrMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A93"/></marker>
  </defs>

  <rect width="1280" height="1020" fill="#141418"/>

  <text x="640" y="42" fill="#FFFFFF" font-size="22" font-weight="600" text-anchor="middle">Sigma Rule Analyzer for Splunk</text>
  <text x="640" y="65" fill="#8A8A93" font-size="12.5" text-anchor="middle">The logs are already arriving. This reads them where they sit, matches Sigma rules against them, and keeps what matched in its own index.</text>

  <!-- ══════════ 1. Already in place ══════════ -->
  <rect x="28" y="88" width="1224" height="168" rx="12" fill="url(#bandExisting)" stroke="#00CA8E" stroke-opacity="0.45" stroke-width="1"/>
  <text x="50" y="112" fill="#00CA8E" font-size="11" font-weight="600" letter-spacing="0.7">ALREADY IN PLACE — NOTHING NEW ON THE ENDPOINTS</text>

  <g>
    <rect x="56" y="126" width="282" height="112" rx="9" fill="url(#cardFace)" stroke="#00CA8E" stroke-opacity="0.38"/>
    <text x="197" y="155" fill="#FFFFFF" font-size="14.5" font-weight="600" text-anchor="middle">Windows and Linux hosts</text>
    <text x="197" y="177" fill="#9A9AA4" font-size="11" text-anchor="middle">Event logs, Sysmon, auditd, secure log.</text>
    <rect x="76" y="194" width="242" height="26" rx="6" fill="#000000" fill-opacity="0.35" stroke="#00CA8E" stroke-opacity="0.25"/>
    <text x="197" y="211" fill="#D8D8DE" font-size="10.5" text-anchor="middle">a forwarder is already collecting them</text>
  </g>

  <g>
    <rect x="396" y="126" width="310" height="112" rx="9" fill="url(#cardFace)" stroke="#00CA8E" stroke-opacity="0.38"/>
    <text x="551" y="155" fill="#FFFFFF" font-size="14.5" font-weight="600" text-anchor="middle">Official Splunk add-ons</text>
    <text x="551" y="177" fill="#9A9AA4" font-size="11" text-anchor="middle">Parse the events where the file is read.</text>
    <rect x="416" y="194" width="270" height="26" rx="6" fill="#000000" fill-opacity="0.35" stroke="#00CA8E" stroke-opacity="0.25"/>
    <text x="551" y="211" fill="#D8D8DE" font-size="10.5" text-anchor="middle">Splunk_TA_windows · Splunk_TA_nix</text>
  </g>

  <g>
    <rect x="764" y="126" width="282" height="112" rx="9" fill="url(#cardFace)" stroke="#00CA8E" stroke-opacity="0.38"/>
    <text x="905" y="155" fill="#FFFFFF" font-size="14.5" font-weight="600" text-anchor="middle">Your existing indexes</text>
    <text x="905" y="177" fill="#9A9AA4" font-size="11" text-anchor="middle">Raw logs stay where they are.</text>
    <rect x="784" y="194" width="242" height="26" rx="6" fill="#000000" fill-opacity="0.35" stroke="#00CA8E" stroke-opacity="0.25"/>
    <text x="905" y="211" fill="#D8D8DE" font-size="10.5" text-anchor="middle">XmlWinEventLog · linux_audit · sysmon:linux</text>
  </g>

  <g>
    <rect x="1074" y="126" width="152" height="112" rx="9" fill="#FFFFFF" fill-opacity="0.03" stroke="#00CA8E" stroke-opacity="0.25" stroke-dasharray="3 3"/>
    <text x="1150" y="152" fill="#00CA8E" font-size="11" font-weight="600" text-anchor="middle">if read from files</text>
    <text x="1150" y="173" fill="#9A9AA4" font-size="10" text-anchor="middle">Event XML from a file</text>
    <text x="1150" y="187" fill="#9A9AA4" font-size="10" text-anchor="middle">needs its own line</text>
    <text x="1150" y="201" fill="#9A9AA4" font-size="10" text-anchor="middle">breaking.</text>
    <text x="1150" y="222" fill="#19C1EB" font-size="9.5" font-weight="600" text-anchor="middle">TA_datagen_parsing</text>
  </g>

  <path d="M338,182 L392,182" stroke="#00CA8E" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrEx)"/>
  <path d="M706,182 L760,182" stroke="#00CA8E" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrEx)"/>

  <!-- ══════════ 2. Preparing the rule set ══════════ -->
  <rect x="28" y="280" width="1224" height="176" rx="12" fill="url(#bandBuild)" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1"/>
  <text x="50" y="304" fill="#A78BFA" font-size="11" font-weight="600" letter-spacing="0.7">PREPARING THE RULE SET — BEFORE ANYTHING IS DEPLOYED</text>

  <g>
    <rect x="56" y="318" width="236" height="118" rx="9" fill="url(#cardFace)" stroke="#A78BFA" stroke-opacity="0.38"/>
    <text x="174" y="346" fill="#FFFFFF" font-size="13.5" font-weight="600" text-anchor="middle">SigmaHQ rule set</text>
    <text x="174" y="368" fill="#9A9AA4" font-size="10.5" text-anchor="middle">Versioned and hash-checkable,</text>
    <text x="174" y="383" fill="#9A9AA4" font-size="10.5" text-anchor="middle">or an offline bundle.</text>
    <text x="174" y="412" fill="#19C1EB" font-size="10" font-weight="600" text-anchor="middle">fetch-rules.py</text>
  </g>

  <g>
    <rect x="334" y="318" width="236" height="118" rx="9" fill="url(#cardFace)" stroke="#A78BFA" stroke-opacity="0.38"/>
    <text x="452" y="346" fill="#FFFFFF" font-size="13.5" font-weight="600" text-anchor="middle">Convert to SPL</text>
    <text x="452" y="368" fill="#9A9AA4" font-size="10.5" text-anchor="middle">pySigma, with a pipeline per</text>
    <text x="452" y="383" fill="#9A9AA4" font-size="10.5" text-anchor="middle">platform.</text>
    <text x="452" y="412" fill="#19C1EB" font-size="10" font-weight="600" text-anchor="middle">build-engine.py</text>
  </g>

  <g>
    <rect x="612" y="318" width="236" height="118" rx="9" fill="url(#cardFace)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="730" y="346" fill="#FFFFFF" font-size="13.5" font-weight="600" text-anchor="middle">Check before deploying</text>
    <text x="730" y="366" fill="#9A9AA4" font-size="10.5" text-anchor="middle">Does every search parse, is</text>
    <text x="730" y="380" fill="#9A9AA4" font-size="10.5" text-anchor="middle">every field present, can the</text>
    <text x="730" y="394" fill="#9A9AA4" font-size="10.5" text-anchor="middle">instance carry the schedule.</text>
    <text x="730" y="418" fill="#19C1EB" font-size="10" font-weight="600" text-anchor="middle">preflight.py — exits non-zero</text>
  </g>

  <g>
    <rect x="926" y="318" width="300" height="118" rx="9" fill="url(#cardFace)" stroke="#A78BFA" stroke-opacity="0.38"/>
    <text x="1076" y="346" fill="#FFFFFF" font-size="13.5" font-weight="600" text-anchor="middle">Grouped into batches</text>
    <text x="1076" y="367" fill="#9A9AA4" font-size="10.5" text-anchor="middle">By platform, severity and log source. Severity</text>
    <text x="1076" y="381" fill="#9A9AA4" font-size="10.5" text-anchor="middle">sets the cadence; the log source sets the scope.</text>
    <rect x="944" y="394" width="264" height="26" rx="6" fill="#000000" fill-opacity="0.35" stroke="#A78BFA" stroke-opacity="0.3"/>
    <text x="1076" y="411" fill="#D8D8DE" font-size="10.5" text-anchor="middle">622 rules → 21 searches · logsource-scope.yml</text>
  </g>

  <path d="M292,377 L330,377" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrBuild)"/>
  <path d="M570,377 L608,377" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrBuild)"/>
  <path d="M848,377 L922,377" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrBuild)"/>

  <!-- ══════════ 3. The engine ══════════ -->
  <rect x="28" y="480" width="1224" height="248" rx="12" fill="url(#bandEngine)" stroke="#19C1EB" stroke-opacity="0.5" stroke-width="1"/>
  <text x="50" y="504" fill="#19C1EB" font-size="11" font-weight="600" letter-spacing="0.7">THE ANALYSIS — A HANDFUL OF SCHEDULED SEARCHES, NOT ONE PER RULE</text>
  <text x="1226" y="504" fill="#8A8A93" font-size="10" text-anchor="end">read in place — the raw logs are never moved</text>

  <g filter="url(#lift)">
    <rect x="56" y="520" width="560" height="190" rx="10" fill="#1C1C22" stroke="#19C1EB" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="336" y="549" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">One scan, then attribution</text>
    <text x="336" y="572" fill="#9A9AA4" font-size="11" text-anchor="middle">A batch reads its log source once, for the union of its</text>
    <text x="336" y="587" fill="#9A9AA4" font-size="11" text-anchor="middle">rules, then names which of them matched.</text>

    <rect x="80" y="602" width="512" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#19C1EB" stroke-opacity="0.3"/>
    <text x="96" y="621" fill="#19C1EB" font-size="10.5" font-family="SF Mono,Menlo,Consolas,monospace">sourcetype=XmlWinEventLog (EventCode=1 OR 4688) (rule1 OR rule2 …)</text>

    <rect x="80" y="640" width="512" height="30" rx="6" fill="#000000" fill-opacity="0.45" stroke="#19C1EB" stroke-opacity="0.3"/>
    <text x="96" y="659" fill="#19C1EB" font-size="10.5" font-family="SF Mono,Menlo,Consolas,monospace">eval sigma_hits = if(searchmatch(…),"id,","") . … | split</text>

    <text x="336" y="690" fill="#8A8A93" font-size="10" text-anchor="middle">The scope is what keeps this affordable: without it every batch reads the whole index.</text>
  </g>

  <g>
    <rect x="648" y="520" width="268" height="190" rx="10" fill="url(#cardFace)" stroke="#19C1EB" stroke-opacity="0.38"/>
    <text x="782" y="548" fill="#FFFFFF" font-size="13.5" font-weight="600" text-anchor="middle">Rule identity, in a lookup</text>
    <text x="782" y="570" fill="#9A9AA4" font-size="10.5" text-anchor="middle">A detection arrives knowing only</text>
    <text x="782" y="584" fill="#9A9AA4" font-size="10.5" text-anchor="middle">which rule id matched. This is</text>
    <text x="782" y="598" fill="#9A9AA4" font-size="10.5" text-anchor="middle">where it gets everything else.</text>
    <rect x="668" y="612" width="228" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#19C1EB" stroke-opacity="0.25"/>
    <text x="782" y="628" fill="#D8D8DE" font-size="10" text-anchor="middle">sigma_rules.csv — 622 rows</text>
    <rect x="668" y="642" width="228" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#19C1EB" stroke-opacity="0.25"/>
    <text x="782" y="658" fill="#D8D8DE" font-size="10" text-anchor="middle">mitre_techniques.csv — names</text>
    <rect x="668" y="672" width="228" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#19C1EB" stroke-opacity="0.25"/>
    <text x="782" y="688" fill="#D8D8DE" font-size="10" text-anchor="middle">sigma_allowlist.csv — tuning</text>
  </g>

  <g>
    <rect x="948" y="520" width="278" height="190" rx="10" fill="url(#cardFace)" stroke="#19C1EB" stroke-opacity="0.38"/>
    <text x="1087" y="548" fill="#FFFFFF" font-size="13.5" font-weight="600" text-anchor="middle">Cadence by severity</text>
    <text x="1087" y="570" fill="#9A9AA4" font-size="10.5" text-anchor="middle">The window always equals the</text>
    <text x="1087" y="584" fill="#9A9AA4" font-size="10.5" text-anchor="middle">interval, so nothing is written twice.</text>
    <text x="972" y="608" fill="#D03B3B" font-size="10.5" font-weight="600">critical</text><text x="1200" y="608" fill="#D8D8DE" font-size="10.5" text-anchor="end">every 15 min</text>
    <text x="972" y="628" fill="#EC835A" font-size="10.5" font-weight="600">high</text><text x="1200" y="628" fill="#D8D8DE" font-size="10.5" text-anchor="end">every 30 min</text>
    <text x="972" y="648" fill="#FAB219" font-size="10.5" font-weight="600">medium</text><text x="1200" y="648" fill="#D8D8DE" font-size="10.5" text-anchor="end">hourly</text>
    <text x="972" y="668" fill="#8A8A93" font-size="10.5" font-weight="600">low · info</text><text x="1200" y="668" fill="#8A8A93" font-size="10.5" text-anchor="end">shipped disabled</text>
    <text x="1087" y="692" fill="#8A8A93" font-size="9.5" text-anchor="middle">continuous scheduling, so no period is skipped</text>
  </g>

  <path d="M616,615 L644,615" stroke="#19C1EB" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#arrSig)"/>
  <!-- Down the gutter between the two cards, so nothing is crossed. -->
  <path d="M870,248 L870,268 Q870,276 862,276 L24,276" stroke="#00CA8E"
        stroke-opacity="0.0" stroke-width="1.6" fill="none"/>
  <path d="M905,248 L905,300" stroke="#00CA8E" stroke-opacity="0.45"
        stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <path d="M905,300 L905,462 L878,462 L878,476" stroke="#00CA8E"
        stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="5 4"
        fill="none" marker-end="url(#arrSig)"/>
  <path d="M1058,440 L1058,476" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#arrSig)"/>

  <!-- ══════════ 4. What it produces ══════════ -->
  <rect x="28" y="752" width="600" height="110" rx="12" fill="url(#bandRead)" stroke="#19C1EB" stroke-opacity="0.35" stroke-width="1"/>
  <text x="50" y="776" fill="#19C1EB" font-size="11" font-weight="600" letter-spacing="0.7">WHAT IT WRITES</text>
  <g>
    <rect x="52" y="788" width="276" height="58" rx="8" fill="url(#cardFace)" stroke="#19C1EB" stroke-opacity="0.4"/>
    <text x="190" y="811" fill="#FFFFFF" font-size="12.5" font-weight="600" text-anchor="middle">sigma_alerts</text>
    <text x="190" y="831" fill="#9A9AA4" font-size="10" text-anchor="middle">one detection per rule, per host, per window</text>
  </g>
  <g>
    <rect x="344" y="788" width="268" height="58" rx="8" fill="url(#cardFace)" stroke="#19C1EB" stroke-opacity="0.25"/>
    <text x="478" y="811" fill="#FFFFFF" font-size="12.5" font-weight="600" text-anchor="middle">sigma_engine_kpi</text>
    <text x="478" y="831" fill="#9A9AA4" font-size="10" text-anchor="middle">what each batch read, and what it cost</text>
  </g>
  <path d="M336,728 L336,748" stroke="#19C1EB" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#arrSig)"/>

  <!-- ══════════ 5. What an analyst opens ══════════ -->
  <rect x="652" y="752" width="600" height="110" rx="12" fill="url(#bandRead)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>
  <text x="674" y="776" fill="#D8D8DE" font-size="11" font-weight="600" letter-spacing="0.7">WHAT AN ANALYST OPENS</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="668" y="788" width="110" height="26" rx="5" fill="#19C1EB" fill-opacity="0.16" stroke="#19C1EB" stroke-opacity="0.45"/>
    <text x="723" y="805" fill="#EAEAEA">Detection Coverage</text>
    <rect x="786" y="788" width="86" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="829" y="805" fill="#D8D8DE">Alert Detail</text>
    <rect x="880" y="788" width="92" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="926" y="805" fill="#D8D8DE">Rule Inventory</text>
    <rect x="980" y="788" width="96" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="1028" y="805" fill="#D8D8DE">Rule Reference</text>
    <rect x="1084" y="788" width="88" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="1128" y="805" fill="#D8D8DE">Engine Health</text>
    <rect x="668" y="820" width="110" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="723" y="837" fill="#D8D8DE">Reports → PDF</text>
  </g>
  <text x="800" y="840" fill="#8A8A93" font-size="10" text-anchor="start">every table pivots back to the log that triggered it</text>
  <path d="M612,817 L648,817" stroke="#8A8A93" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#arrMute)"/>

  <!-- ══════════ Footnote ══════════ -->
  <rect x="28" y="886" width="1224" height="104" rx="12" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="50" y="910" fill="#D8D8DE" font-size="11" font-weight="600" letter-spacing="0.5">WHY IT IS SHAPED THIS WAY</text>
  <text x="50" y="934" fill="#8A8A93" font-size="11">One scheduled search per rule does not run. Splunk caps concurrent scheduled searches at roughly half of max_searches_per_cpu × cpus + base_max_searches;</text>
  <text x="50" y="951" fill="#8A8A93" font-size="11">on a modest indexer that is four. Several hundred searches against four slots means the scheduler defers almost everything, reports no failure, and the</text>
  <text x="50" y="968" fill="#8A8A93" font-size="11">dashboards simply read zero. Batching turns the rule count into a cost the instance can actually carry, and the log source scope is what keeps it there as</text>
  <text x="50" y="985" fill="#8A8A93" font-size="11">the index grows.</text>
</svg>
