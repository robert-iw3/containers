---
# Splunk Enterprise, a universal forwarder and Traefik in front of them.
#
#   cp .env.example .env     set SPLUNK_PASSWORD before the first start
#   podman compose up -d
#
# Resource limits are mandatory here. An indexer claims memory until the
# operating system pushes back, and an unlimited container on a workstation
# takes the workstation with it. deploy.resources is Swarm syntax that some
# compose providers drop in silence, so confirm it landed:
#
#   podman inspect -f '{{.HostConfig.Memory}}' splunkenterprise
#
# Web SSL and the rest of the hardened posture come from conf/, rendered first:
#
#   ./conf/render.sh conf-rendered --server-name splunkenterprise.io \
#       --allowed-domains example.com
#
# An empty or missing conf-rendered/ is not an error - the instance simply runs
# stock defaults, with no web SSL and no allowedDomainList. Never set it
# through a command: override; that replaces the image's CMD of start-service,
# so splunkd never runs.

volumes:
  opt-splunk-etc:
  opt-splunk-var:
  opt-forwarder-etc:
  opt-forwarder-var:

networks:
  external:
    driver: bridge
  internal:
    internal: true

services:

  splunkenterprise:
    build: enterprise/
    hostname: splunkenterprise.io
    environment:
      SPLUNK_START_ARGS: --accept-license
      # No default: the entrypoint refuses to start without it, because every
      # first-start configuration command authenticates with it.
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env}
      SPLUNK_ENABLE_LISTEN: 9997
      SPLUNK_ADD: "tcp 1514"
    volumes:
      - opt-splunk-etc:/opt/splunk/etc:Z
      - opt-splunk-var:/opt/splunk/var:Z
      - ./enterprise/apps:/opt/splunk/etc/apps:Z
      # The hardened configuration, rendered by conf/render.sh, and the
      # certificates it references. STAGED paths: the entrypoint copies both
      # into place owned by splunk before splunkd starts. Mounting either at
      # its final path breaks it - over etc/system/local it hides the seeded
      # passwords.conf, and over etc/auth/mycerts the keys arrive root-owned
      # and 0600, so splunkd cannot read them.
      #
      #   ./conf/render.sh conf-rendered --server-name <host> \
      #       --allowed-domains example.com
      - ./conf-rendered:/staged/conf:ro,Z
      - ./certs:/staged/certs:ro,Z
    ports:
      - "8000:8000"
      - "8088:8088"
      - "9997:9997"
      - "8089:8089"
      - "8191:8191"
      - "1514:1514"
    networks: ['internal']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 16000
        hard: 16000
    deploy:
      resources:
        limits:
          cpus: "${SPLUNK_CPUS:-2}"
          memory: ${SPLUNK_MEMORY:-4g}
    # A running container is not a working one; this is the cheapest signal
    # that splunkd itself came up.
    healthcheck:
      # curl is not in the Splunk image, and /services/server/info needs
      # auth. `splunk status` needs neither and exits 0 only when splunkd
      # is running.
      test: ["CMD", "/opt/splunk/bin/splunk", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.splunk.rule=Host(`splunkenterprise.io`)"
      - "traefik.http.routers.splunk.service=splunk"
      - "traefik.http.routers.splunk.entrypoints=websecure"
      - "traefik.http.services.splunk.loadbalancer.server.port=8000"
      # https, not http: the rendered web.conf sets enableSplunkWebSSL, and a
      # plain-http backend URL gets a TLS record back and fails as a 502.
      - "traefik.http.services.splunk.loadbalancer.server.scheme=https"
      - "traefik.http.services.splunk.loadbalancer.serverstransport=splunk-backend@file"
      - "traefik.docker.network=internal"

  splunkuniversalforwarder:
    build: universalforwarder/
    hostname: splunkuniversalforwarder
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env}
      # Without a forward-server the forwarder runs and sends nothing, which
      # reads the same as a quiet host.
      SPLUNK_FORWARD_SERVER: ${SPLUNK_FORWARD_SERVER:-splunkenterprise.io:9997}
      DOCKER_MONITORING: "true"
    volumes:
      - opt-forwarder-etc:/opt/splunk/etc:Z
      - opt-forwarder-var:/opt/splunk/var:Z
      # Read-only: a forwarder tails logs, it never owns them.
      - /var/log:/var/log:ro,Z
    networks: ['internal']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${UF_CPUS:-1}"
          memory: ${UF_MEMORY:-1g}
    healthcheck:
      test: ["CMD", "/opt/splunk/bin/splunk", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  traefik:
    container_name: traefik
    build: traefik/
    hostname: traefik
    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.filename=/dynamic/tls.yml"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # The healthcheck below calls `traefik healthcheck --ping`, which needs
      # this; without it the check fails and the container reads unhealthy.
      - "--ping=true"
      # Observability
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
    ports:
      - 80:80
      - 443:443
    volumes:
      # sudo systemctl enable --now podman.socket | non-root: systemctl --user enable --now podman.socket
      - /var/run/podman/podman.sock:/var/run/docker.sock:ro # for user namespace: $XDG_RUNTIME_DIR/podman/podman.sock
      - ./secrets:/secrets:ro
      - ./traefik/config:/dynamic:ro
    networks:
      - internal
      - external
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS:-0.5}"
          memory: ${TRAEFIK_MEMORY:-256m}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Dashboard router, reachable at https://dashboard.podman.localhost
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.podman.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      # Generate with:
      #   htpasswd -nbB admin 'a-real-password' | sed -e 's/\$/\$\$/g'
      # An empty user list here publishes the dashboard with no credentials.
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS:?set TRAEFIK_DASHBOARD_USERS in .env}"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"
