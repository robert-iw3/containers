# XML schemas. Each top-level element is one event, flattened to its child
# element names, so schema_key names a child element rather than a column.
#
# The parser adds _element (the record element's local name) and _namespace,
# which lets a schema discriminate on the element itself.

schemas:
  - name: simple_event
    schema_key: event_type
    schema_value: network_event
    mappings:
      cim:
        time: timestamp
        event_id: id
        src: source_ip
        src_port: source_port
        dest: dest_ip
        dest_port: dest_port
        protocol: protocol
        action: action
        sourcetype: xml:simple_event

  - name: network_flow
    schema_key: event_type
    schema_value: flow
    mappings:
      cim:
        time: timestamp
        event_id: id
        src: source_ip
        src_port: source_port
        dest: dest_ip
        dest_port: dest_port
        protocol: protocol
        action: action
        sourcetype: xml:network_flow

  - name: windows_event
    schema_key: _element
    schema_value: Event
    mappings:
      cim:
        time: TimeCreated
        event_id: EventID
        host: Computer
        user: TargetUserName
        message: Message
        sourcetype: xml:wineventlog
