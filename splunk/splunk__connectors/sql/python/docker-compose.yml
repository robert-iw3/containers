---
# SQL connector, to Splunk HEC and to Elasticsearch.
#
#   cd ../..            # the connectors root: the image needs core/
#   podman compose -f sql/python/docker-compose.yml up -d sql-splunk
#
# STATE_PATH is a file inside /var/lib/connector. The volume mounts the
# DIRECTORY: mounting it at the file path creates a directory where the
# connector expects to write a file, and the cursor is then never persisted.

services:

  sql-splunk:
    build:
      # The connectors root, because the image copies core/ as well.
      context: ../..
      dockerfile: sql/python/Dockerfile
    environment:
      # sqlite | postgres | mysql | mssql | oracle. The driver is imported
      # lazily, so only the one named here has to be installed.
      DB_TYPE: ${CONNECTOR_DB_TYPE:-sqlite}
      DB_CONN_STR: ${CONNECTOR_DB_CONN_STR:?set CONNECTOR_DB_CONN_STR}
      SCHEMAS_FILE: /app/schemas.yaml
      STATE_PATH: /var/lib/connector/offsets.json
      ENABLE_SPLUNK: "true"
      SPLUNK_HEC_URL: ${CONNECTOR_HEC_URL:?set CONNECTOR_HEC_URL}
      SPLUNK_TOKEN: ${CONNECTOR_HEC_TOKEN:?set CONNECTOR_HEC_TOKEN}
      SPLUNK_INDEX: ${CONNECTOR_INDEX:-}
      BATCH_SIZE: ${CONNECTOR_BATCH_SIZE:-100}
      WORKER_COUNT: ${CONNECTOR_WORKERS:-2}
      SCAN_INTERVAL: ${CONNECTOR_SCAN_INTERVAL:-30}
    volumes:
      - sql-state:/var/lib/connector:Z
    deploy:
      resources:
        limits:
          cpus: "${CONNECTOR_CPUS:-1}"
          memory: ${CONNECTOR_MEMORY:-512m}
    restart: unless-stopped

  sql-elasticsearch:
    build:
      context: ../..
      dockerfile: sql/python/Dockerfile
    environment:
      # sqlite | postgres | mysql | mssql | oracle. The driver is imported
      # lazily, so only the one named here has to be installed.
      DB_TYPE: ${CONNECTOR_DB_TYPE:-sqlite}
      DB_CONN_STR: ${CONNECTOR_DB_CONN_STR:?set CONNECTOR_DB_CONN_STR}
      SCHEMAS_FILE: /app/schemas.yaml
      STATE_PATH: /var/lib/connector/offsets.json
      ENABLE_SPLUNK: "false"
      ES_HOST: ${CONNECTOR_ES_HOST:?set CONNECTOR_ES_HOST}
      ES_INDEX: ${CONNECTOR_ES_INDEX:-sql-logs}
      ES_USER: ${CONNECTOR_ES_USER:-}
      ES_PASSWORD: ${CONNECTOR_ES_PASSWORD:-}
      BATCH_SIZE: ${CONNECTOR_BATCH_SIZE:-100}
      WORKER_COUNT: ${CONNECTOR_WORKERS:-2}
      SCAN_INTERVAL: ${CONNECTOR_SCAN_INTERVAL:-30}
    volumes:
      # A separate cursor store: the two sinks track their own progress.
      - sql-es-state:/var/lib/connector:Z
    deploy:
      resources:
        limits:
          cpus: "${CONNECTOR_CPUS:-1}"
          memory: ${CONNECTOR_MEMORY:-512m}
    restart: unless-stopped

volumes:
  sql-state:
  sql-es-state:
