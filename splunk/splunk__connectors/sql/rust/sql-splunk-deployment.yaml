apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-splunk
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-splunk
  template:
    metadata:
      labels:
        app: sql-splunk
    spec:
      containers:
      - name: sql-splunk
        image: sql-connector:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SCHEMAS_FILE
          value: "/app/schemas.yaml"
        - name: STATE_PATH
          value: "/app/state.db"
        - name: SPLUNK_HEC_URL
          value: "https://splunk:8088/services/collector"
        - name: SPLUNK_TOKEN
          value: "your-splunk-hec-token"
        - name: BATCH_SIZE
          value: "100"
        - name: BUFFER_TIMEOUT
          value: "30"
        - name: WORKER_COUNT
          value: "4"
        - name: POLL_INTERVAL
          value: "30"
        - name: DB_TYPE
          value: "postgresql"
        - name: DB_CONN_STR
          value: "postgresql://user:password@db-host:5432/dbname"
        - name: CDC_ENABLED
          value: "false"
        - name: MAX_CONNECTIONS_PER_TABLE
          value: "5"
        - name: METRICS_PORT
          value: "9090"
        - name: ENABLE_SPLUNK
          value: "true"
        - name: RUST_LOG
          value: "info"
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          exec:
            command: ["pidof", "sql-connector"]
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["pidof", "sql-connector"]
          initialDelaySeconds: 10
          periodSeconds: 10