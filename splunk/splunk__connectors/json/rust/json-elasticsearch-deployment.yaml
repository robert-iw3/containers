apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-elasticsearch
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: json-elasticsearch
  template:
    metadata:
      labels:
        app: json-elasticsearch
    spec:
      containers:
      - name: json-elasticsearch
        image: json-connector:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: JSON_LOG_DIR
          value: "/var/log/json_data"
        - name: SCHEMAS_FILE
          value: "/app/schemas.yaml"
        - name: ES_ENABLED
          value: "true"
        - name: ES_HOST
          value: "http://elasticsearch:9200"
        - name: ES_INDEX
          value: "json-logs"
        - name: BATCH_SIZE
          value: "100"
        - name: BUFFER_TIMEOUT
          value: "30"
        - name: WORKER_COUNT
          value: "4"
        - name: CONFIG_FILE
          value: "/app/deploy_config.yaml"
        volumeMounts:
        - name: json-logs
          mountPath: /var/log/json_data
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          exec:
            command: ["pidof", "json-connector"]
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["pidof", "json-connector"]
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: json-logs
        persistentVolumeClaim:
          claimName: json-logs