---
# JSON connector, to Splunk HEC and to Elasticsearch.
#
#   cd ../..            # the connectors root: the image needs core/
#   podman compose -f json/python/docker-compose.yml up -d json-splunk
#
# Both services run the same image and differ only in ENABLE_SPLUNK. Neither
# has a default token or host: a connector pointed at a placeholder reports
# send failures forever rather than saying it is unconfigured.

services:

  json-splunk:
    build:
      # The connectors root, because the image copies core/ as well.
      context: ../..
      dockerfile: json/python/Dockerfile
    environment:
      JSON_LOG_DIR: /var/log/json_data
      SCHEMAS_FILE: /app/schemas.yaml
      STATE_PATH: /var/lib/connector/offsets.json
      ENABLE_SPLUNK: "true"
      SPLUNK_HEC_URL: ${CONNECTOR_HEC_URL:?set CONNECTOR_HEC_URL}
      SPLUNK_TOKEN: ${CONNECTOR_HEC_TOKEN:?set CONNECTOR_HEC_TOKEN}
      SPLUNK_INDEX: ${CONNECTOR_INDEX:-}
      BATCH_SIZE: ${CONNECTOR_BATCH_SIZE:-100}
      WORKER_COUNT: ${CONNECTOR_WORKERS:-2}
      SCAN_INTERVAL: ${CONNECTOR_SCAN_INTERVAL:-5}
    volumes:
      - json-logs:/var/log/json_data:Z
      # Offsets survive a restart. Without this volume every file is re-sent.
      - json-state:/var/lib/connector:Z
    deploy:
      resources:
        limits:
          cpus: "${CONNECTOR_CPUS:-1}"
          memory: ${CONNECTOR_MEMORY:-512m}
    restart: unless-stopped

  json-elasticsearch:
    build:
      context: ../..
      dockerfile: json/python/Dockerfile
    environment:
      JSON_LOG_DIR: /var/log/json_data
      SCHEMAS_FILE: /app/schemas.yaml
      STATE_PATH: /var/lib/connector/offsets.json
      ENABLE_SPLUNK: "false"
      ES_HOST: ${CONNECTOR_ES_HOST:?set CONNECTOR_ES_HOST}
      ES_INDEX: ${CONNECTOR_ES_INDEX:-json-logs}
      ES_USER: ${CONNECTOR_ES_USER:-}
      ES_PASSWORD: ${CONNECTOR_ES_PASSWORD:-}
      BATCH_SIZE: ${CONNECTOR_BATCH_SIZE:-100}
      WORKER_COUNT: ${CONNECTOR_WORKERS:-2}
      SCAN_INTERVAL: ${CONNECTOR_SCAN_INTERVAL:-5}
    volumes:
      - json-logs:/var/log/json_data:Z
      # A separate offset store: the two sinks track their own progress.
      - json-es-state:/var/lib/connector:Z
    deploy:
      resources:
        limits:
          cpus: "${CONNECTOR_CPUS:-1}"
          memory: ${CONNECTOR_MEMORY:-512m}
    restart: unless-stopped

volumes:
  json-logs:
  json-state:
  json-es-state:
