[defaults]
inventory = ./inventory.yml
remote_user = admin
# Host keys are checked. Disabling this accepts any key a host presents, which
# is the whole of SSH's protection against a machine-in-the-middle. Populate
# known_hosts first (ssh-keyscan) rather than turning it off.
host_key_checking = True
roles_path = ./roles
retry_files_enabled = False
log_path = ../logs/deployment.log

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True