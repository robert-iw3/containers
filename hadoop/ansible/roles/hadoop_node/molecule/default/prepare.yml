---
- name: Prepare
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install podman + fuse-overlayfs
      ansible.builtin.package:
        name: [podman, fuse-overlayfs]
        state: present
    - name: Configure the overlay mount program (podman-in-podman)
      ansible.builtin.copy:
        dest: /etc/containers/storage.conf
        mode: "0644"
        content: |
          [storage]
          driver = "overlay"
          [storage.options.overlay]
          mount_program = "/usr/bin/fuse-overlayfs"
    # The hadoop-*:latest images must be available (built via `make build` and loaded,
    # or pulled from hadoop_registry). No public pull -- they are locally built.
