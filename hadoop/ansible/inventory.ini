# Distributed Hadoop 3.5 datalake cluster across hosts. A host can belong to several
# role groups. Here: one master (NameNode + ResourceManager + HistoryServer) and
# three workers (DataNode + NodeManager) -- scale workers for more storage/compute.
# hadoop_advertise_host defaults to ansible_host.

[hadoop_namenode]
hadoop-master ansible_host=10.0.6.10 hadoop_advertise_host=10.0.6.10

[hadoop_resourcemanager]
hadoop-master ansible_host=10.0.6.10 hadoop_advertise_host=10.0.6.10

[hadoop_historyserver]
hadoop-master ansible_host=10.0.6.10 hadoop_advertise_host=10.0.6.10

[hadoop_datanodes]
hadoop-worker-1 ansible_host=10.0.6.21 hadoop_advertise_host=10.0.6.21
hadoop-worker-2 ansible_host=10.0.6.22 hadoop_advertise_host=10.0.6.22
hadoop-worker-3 ansible_host=10.0.6.23 hadoop_advertise_host=10.0.6.23

[hadoop_nodemanagers]
hadoop-worker-1 ansible_host=10.0.6.21 hadoop_advertise_host=10.0.6.21
hadoop-worker-2 ansible_host=10.0.6.22 hadoop_advertise_host=10.0.6.22
hadoop-worker-3 ansible_host=10.0.6.23 hadoop_advertise_host=10.0.6.23

[hadoop_cluster:children]
hadoop_namenode
hadoop_resourcemanager
hadoop_historyserver
hadoop_datanodes
hadoop_nodemanagers

[hadoop_cluster:vars]
ansible_user=ubuntu
