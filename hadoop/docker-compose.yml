---
# Distributed Hadoop 3.5 data cluster: HDFS (NameNode + 3 DataNodes, RF=3) as the
# datalake storage layer, YARN (ResourceManager + 2 NodeManagers) as the compute
# layer, plus the timeline/history server. Config is templated from hadoop.env by
# the image entrypoint.
#
#   make build && docker compose up -d          # bring up the cluster
#   ./datalake/init_datalake.sh                 # create HDFS zones + load sample logs
#   ./datalake/process_logs.sh                  # run the distributed log-processing job
#
# UIs: NameNode http://localhost:9870 · ResourceManager http://localhost:8088
x-hadoop-env: &hadoop-env
  env_file: ./hadoop.env
  restart: unless-stopped

services:
  namenode:
    <<: *hadoop-env
    image: hadoop-namenode:latest
    hostname: namenode
    ports: ["9870:9870", "9000:9000"]
    volumes: ["hadoop_namenode:/hadoop/dfs/name"]
    environment:
      CLUSTER_NAME: arcanaeum-datalake

  datanode1: &datanode
    <<: *hadoop-env
    image: hadoop-datanode:latest
    hostname: datanode1
    volumes: ["hadoop_datanode1:/hadoop/dfs/data"]
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
  datanode2:
    <<: *datanode
    hostname: datanode2
    volumes: ["hadoop_datanode2:/hadoop/dfs/data"]
  datanode3:
    <<: *datanode
    hostname: datanode3
    volumes: ["hadoop_datanode3:/hadoop/dfs/data"]

  resourcemanager:
    <<: *hadoop-env
    image: hadoop-resourcemanager:latest
    hostname: resourcemanager
    ports: ["8088:8088"]
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864"

  nodemanager1: &nodemanager
    <<: *hadoop-env
    image: hadoop-nodemanager:latest
    hostname: nodemanager1
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864 resourcemanager:8088"
  nodemanager2:
    <<: *nodemanager
    hostname: nodemanager2

  historyserver:
    <<: *hadoop-env
    image: hadoop-historyserver:latest
    hostname: historyserver
    ports: ["8188:8188"]
    volumes: ["hadoop_historyserver:/hadoop/yarn/timeline"]
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864 resourcemanager:8088"

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  hadoop_historyserver:
