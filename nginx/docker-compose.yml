---
# nginx reverse proxy in front of a demo backend (whoami). This is exactly what
# uat/run-uat.sh drives and the single-host reference for the Quadlet deployment
# in ansible/. Replace `whoami` with your backend and edit config/nginx.conf (or
# stack.yaml routes) to route to it.
services:
  nginx:
    image: ${PROXY_IMAGE:-docker.io/library/nginx:1.29-alpine}
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${TLS_PORT:-8443}:8443"
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ${TLS_DIR:-./uat/tls}:/etc/nginx/tls:ro,Z
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    depends_on:
      - whoami
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  whoami:
    image: docker.io/traefik/whoami:latest
    container_name: whoami-demo
    restart: unless-stopped
    command: ["--port", "80", "--name", "whoami-demo"]
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    name: ${COMPOSE_NET_NAME:-nginx-proxy-net}
