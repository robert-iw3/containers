---
volumes:
  keycloak-postgres:
  keycloak-postgres-backups:
  traefik-certificates:

networks:
  keycloak-frontend:
    driver: bridge
  keycloak-backend:
    driver: bridge
    internal: true

x-common: &common
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: docker.io/library/postgres:17.10
    container_name: postgres-keycloak
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - keycloak-postgres:/var/lib/postgresql/data:z
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - keycloak-backend
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    command: ["start", "--db-pool-max-size=20"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRESQL_DATABASE}
      KC_DB_USERNAME: ${POSTGRESQL_USERNAME}
      KC_DB_PASSWORD: ${POSTGRESQL_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      # TLS terminates at traefik; keycloak serves plain HTTP on the
      # internal network and trusts X-Forwarded-* from the proxy.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: ${KEYCLOAK_LOGLEVEL:-info}
    healthcheck:
      # The keycloak image ships no curl/wget; probe the management
      # port (9000) with bash's /dev/tcp instead.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_healthy
    networks:
      - keycloak-frontend
      - keycloak-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=keycloak-frontend"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_DOMAIN}`)"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.passhostheader=true"
      - "traefik.http.routers.keycloak.middlewares=compresstraefik"
      - "traefik.http.middlewares.compresstraefik.compress=true"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  traefik:
    <<: *common
    image: docker.io/traefik:v3.7.8
    container_name: traefik-keycloak
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entryPoints.ping.address=:8082"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=keycloak-frontend"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme:z
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - keycloak-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=traefikadmin:${TRAEFIK_AUTH_HASHED_PASSWORD}"
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  backups:
    <<: *common
    image: docker.io/library/postgres:17.10
    container_name: postgres-backups-keycloak
    command:
      - sh
      - -c
      - |
        while true; do
          pg_dump | gzip > /backups/keycloak-postgres-backup-$(date "+%Y-%m-%d_%H-%M").gz || {
            echo "Backup failed at $(date)"
          }
          find /backups -type f -name '*.gz' -mtime +7 -delete
          sleep 24h
        done
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - keycloak-postgres-backups:/backups:Z
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRESQL_DATABASE}
      PGUSER: ${POSTGRESQL_USERNAME}
      PGPASSWORD: ${POSTGRESQL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
