# Self-contained UAT stack, TLS end to end:
#   keycloak (native HTTPS on 8543) + postgres
#   + mock relying application: oauth2-proxy (OIDC auth-code flow,
#     HTTPS on 4184, host network so browser and backchannel share the
#     https://localhost:8543 issuer) protecting a whoami upstream.
# Secrets come from uat/.env and uat/oauth2-proxy.env; certs from
# uat/tls. All are generated by run-uat.sh.
---
volumes:
  keycloak-uat-postgres:

networks:
  keycloak-uat:
    driver: bridge

services:
  postgres:
    image: docker.io/library/postgres:17.10
    container_name: postgres-keycloak-uat
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
    volumes:
      - keycloak-uat-postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - keycloak-uat

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-uat
    security_opt:
      - no-new-privileges:true
    command: ["start"]
    environment:
      KC_HOSTNAME: https://localhost:8543
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/uat-certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/uat-certs/tls.key
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRESQL_DATABASE}
      KC_DB_USERNAME: ${POSTGRESQL_USERNAME}
      KC_DB_PASSWORD: ${POSTGRESQL_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./tls:/opt/keycloak/uat-certs:ro,z
    ports:
      - "127.0.0.1:8543:8443"
      - "127.0.0.1:9001:9000"
    # Ordering enforced by run-uat.sh; no depends_on on purpose.
    networks:
      - keycloak-uat

  whoami:
    image: docker.io/traefik/whoami:v1.11.0
    container_name: whoami-keycloak-uat
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - keycloak-uat

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy-keycloak-uat
    security_opt:
      - no-new-privileges:true
    # Host network: the browser-facing issuer https://localhost:8543 must
    # also be reachable for OIDC discovery and the token backchannel.
    network_mode: host
    env_file:
      - oauth2-proxy.env
    volumes:
      - ./tls:/tls:ro,z
    command:
      - --provider=oidc
      - --provider-display-name=Keycloak UAT
      - --oidc-issuer-url=https://localhost:8543/realms/uat
      - --provider-ca-file=/tls/ca.crt
      - --redirect-url=https://localhost:4184/oauth2/callback
      - --https-address=:4184
      - --tls-cert-file=/tls/tls.crt
      - --tls-key-file=/tls/tls.key
      - --upstream=http://127.0.0.1:8090
      - --email-domain=*
      - --cookie-secure=true
      - --skip-provider-button=true
