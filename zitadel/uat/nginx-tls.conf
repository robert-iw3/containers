# TLS terminator + route split for the ZITADEL UAT, mirroring what the
# upstream traefik proxy does but with one nginx we fully control:
#   /                 -> redirect to the v2 login UI
#   /ui/v2/login/...  -> zitadel-login (v2 login app)
#   everything else   -> zitadel-api (OIDC, console, management REST)
# TLS uses the shared UAT CA so the browser and oauth2-proxy trust one cert.
# The login container talks h2c to the API directly (bypassing nginx);
# nginx only needs HTTP/1.1 for the OIDC/REST/Connect endpoints.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/tls/tls.crt;
    ssl_certificate_key /etc/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host              localhost:8443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  localhost:8443;
    proxy_set_header X-Real-IP         $remote_addr;

    location = / {
        return 302 /ui/v2/login/;
    }

    location /ui/v2/login {
        # The v2 login is a Next.js app; its Server Actions reject the
        # request unless x-forwarded-host matches the browser Origin
        # (including the port). $http_host preserves "localhost:8443",
        # unlike $host which strips the port. nginx does not inherit the
        # server-level proxy_set_header once a location sets its own, so
        # repeat the forwarded headers here.
        proxy_pass http://zitadel-login:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location / {
        proxy_pass http://zitadel-api:8080;
    }
}
