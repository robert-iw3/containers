# Self-contained UAT stack, TLS end to end:
#   postgres + zitadel-api (h2c internal) + zitadel-login (v2)
#   + nginx TLS terminator (shared CA) route-splitting api vs login,
#     publishing https://localhost:8443
#   + mock relying application: oauth2-proxy (OIDC auth-code flow, HTTPS
#     on 4186) protecting a whoami upstream.
# A first-instance machine user + PAT is bootstrapped so run-uat.sh can
# create the OIDC application via the management API. Secrets come from
# uat/.env and uat/oauth2-proxy.env; certs from uat/tls.
---
volumes:
  zitadel-uat-postgres:
  zitadel-uat-bootstrap:

networks:
  zitadel-uat:
    driver: bridge

services:
  postgres:
    image: docker.io/library/postgres:17.10-alpine
    container_name: postgres-zitadel-uat
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zitadel
    volumes:
      - zitadel-uat-postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - zitadel-uat

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.1
    container_name: zitadel-api-uat
    security_opt:
      - no-new-privileges:true
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode external
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/zitadel?sslmode=disable
      # Human admin for browser login
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # Machine service account + PAT for API-driven provisioning
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: uat-admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: UAT Admin SA
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      # Login v2
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://localhost:8443/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://localhost:8443/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://localhost:8443/ui/v2/login/logout?post_logout_redirect=
    volumes:
      - zitadel-uat-bootstrap:/zitadel/bootstrap:rw
    # Readiness is gated by run-uat.sh via `zitadel ready`; no container
    # healthcheck (it flaps during the lengthy first-run init).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zitadel-uat

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.1
    container_name: zitadel-login-uat
    security_opt:
      - no-new-privileges:true
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost:8443,X-Forwarded-Proto:https
    volumes:
      - zitadel-uat-bootstrap:/zitadel/bootstrap:ro
    networks:
      - zitadel-uat

  proxy:
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    container_name: zitadel-proxy-uat
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./tls:/etc/tls:ro,z
    ports:
      - '127.0.0.1:8443:8443'
    networks:
      - zitadel-uat

  whoami:
    image: docker.io/traefik/whoami:v1.11.0
    container_name: whoami-zitadel-uat
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8092:80"
    networks:
      - zitadel-uat

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy-zitadel-uat
    security_opt:
      - no-new-privileges:true
    network_mode: host
    env_file:
      - oauth2-proxy.env
    volumes:
      - ./tls:/tls:ro,z
    command:
      - --provider=oidc
      - --provider-display-name=ZITADEL UAT
      - --oidc-issuer-url=https://localhost:8443
      - --provider-ca-file=/tls/ca.crt
      - --redirect-url=https://localhost:4186/oauth2/callback
      - --https-address=:4186
      - --tls-cert-file=/tls/tls.crt
      - --tls-key-file=/tls/tls.key
      - --upstream=http://127.0.0.1:8092
      - --email-domain=*
      - --cookie-secure=true
      - --skip-provider-button=true
      - --scope=openid email profile
