# Images CI builds, scans, and publishes on every push/PR.
#
# Each entry is a Dockerfile path, a directory, or a glob, matched against
# Dockerfile paths (e.g. "elastic/apm-server", "elastic/data-pipeline/*",
# "opensearch/opensearch/Dockerfile"). Archived Dockerfiles are never built.
#
# An empty list builds nothing. Manual runs can override this with the
# `paths` / `build_all` / `build_changed` inputs (GitHub) or the
# `BUILD_PATHS` / `BUILD_ALL` / `BUILD_CHANGED` variables (GitLab).
build: []
