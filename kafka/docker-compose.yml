---
# Apache Kafka 4.3 in KRaft mode (no ZooKeeper): 3 combined broker+controller nodes,
# RF=3 / min.insync.replicas=2 for real durability. Topics are created declaratively
# from topics.yaml by the topic-init service.
#
#   docker compose up -d                          # bring up the cluster
#   docker compose run --rm topic-init            # apply topics.yaml
#
# Each node advertises an internal listener (kafkaN:9092, for containers on this
# network) and an external one (localhost:1909N, for clients on the host).
x-kafka-common: &kafka-common
  image: ${KAFKA_IMAGE:-docker.io/apache/kafka:4.3.1}
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    # Durability defaults for a 3-node cluster.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 6
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # All nodes in a KRaft cluster must share one cluster id.
    CLUSTER_ID: ${KAFKA_CLUSTER_ID:-kQiG5vY0R0aH8xVzR2mQ2A}
  networks: [kafka]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 30s

services:
  kafka1:
    <<: *kafka-common
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092
    ports: ["19092:19092"]
    volumes: ["kafka1-data:/var/lib/kafka/data"]

  kafka2:
    <<: *kafka-common
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:19093
    ports: ["19093:19093"]
    volumes: ["kafka2-data:/var/lib/kafka/data"]

  kafka3:
    <<: *kafka-common
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:19094
    ports: ["19094:19094"]
    volumes: ["kafka3-data:/var/lib/kafka/data"]

  # One-shot: create/alter topics from topics.yaml against the running cluster.
  topic-init:
    image: ${KAFKA_IMAGE:-docker.io/apache/kafka:4.3.1}
    depends_on:
      kafka1: {condition: service_healthy}
    networks: [kafka]
    volumes:
      - ./topics.yaml:/topics.yaml:ro
      - ./scripts/apply_topics.sh:/apply_topics.sh:ro
    entrypoint: ["bash", "/apply_topics.sh", "kafka1:9092", "/topics.yaml"]
    profiles: ["tools"]

networks:
  kafka:
    driver: bridge

volumes:
  kafka1-data: {}
  kafka2-data: {}
  kafka3-data: {}
