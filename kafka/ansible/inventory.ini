# Multi-host Kafka 4.3 KRaft cluster. Every host is a combined broker+controller;
# the controller quorum is built from all of them. Each host needs a unique
# kafka_node_id (starting at 1); kafka_advertise_host defaults to ansible_host.

[kafka_cluster]
kafka-1 ansible_host=10.0.4.11 kafka_node_id=1 kafka_advertise_host=10.0.4.11
kafka-2 ansible_host=10.0.4.12 kafka_node_id=2 kafka_advertise_host=10.0.4.12
kafka-3 ansible_host=10.0.4.13 kafka_node_id=3 kafka_advertise_host=10.0.4.13

[kafka_cluster:vars]
ansible_user=ubuntu
