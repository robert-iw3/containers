---
# Apache Kafka 4.3 in KRaft mode on Kubernetes: a 3-replica StatefulSet of combined
# broker+controller nodes, RF=3 / min.insync.replicas=2.
#
# Each pod derives its NODE_ID and advertised listener from its ordinal (kafka-0/1/2)
# in the command wrapper, then execs the image entrypoint. The controller quorum
# lists all three pods by their stable headless-service DNS.
#
# Brokers are stateful: horizontal broker scaling requires partition reassignment
# (Cruise Control / Strimzi), so this ships a PodDisruptionBudget rather than an HPA.
# In the big-data pipeline the autoscaled tier is the Flink/Spark consumers.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
  - {name: internal, port: 9092}
  - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  selector: {app: kafka}
  ports:
  - {name: internal, port: 9092, targetPort: 9092}
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: kafka
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: kafka}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
      - name: kafka
        image: docker.io/apache/kafka:4.3.1
        # Derive per-pod identity from the ordinal, then hand off to the image entrypoint.
        command: ["/bin/bash", "-c"]
        args:
        - |
          ORD=${HOSTNAME##*-}
          export KAFKA_NODE_ID=$((ORD + 1))
          FQDN=${HOSTNAME}.kafka-headless.kafka.svc.cluster.local
          export KAFKA_ADVERTISED_LISTENERS=INTERNAL://${FQDN}:9092
          exec /__cacert_entrypoint.sh /etc/kafka/docker/run
        env:
        - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
        - {name: KAFKA_CONTROLLER_QUORUM_VOTERS,
           value: "1@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,2@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,3@kafka-2.kafka-headless.kafka.svc.cluster.local:9093"}
        - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093"}
        - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"}
        - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
        - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2"}
        - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3"}
        - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "2"}
        - {name: KAFKA_NUM_PARTITIONS, value: "6"}
        - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
        - {name: CLUSTER_ID, value: "kQiG5vY0R0aH8xVzR2mQ2A"}
        ports:
        - {containerPort: 9092, name: internal}
        - {containerPort: 9093, name: controller}
        volumeMounts:
        - {name: data, mountPath: /var/lib/kafka/data}
        readinessProbe:
          exec:
            command: ["bash", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
        livenessProbe:
          tcpSocket: {port: 9092}
          initialDelaySeconds: 45
          periodSeconds: 20
        resources:
          requests: {cpu: "1", memory: "1Gi"}
          limits: {cpu: "2", memory: "2Gi"}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
