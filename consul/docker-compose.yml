---
# 3-node Consul server cluster: TLS on RPC + HTTPS API, gossip encryption,
# ACLs (default deny). CA, server cert and gossip key are generated once at
# first start by consul-init and stored in named volumes.
# Quick start:
#   podman-compose up -d --build
#   ./scripts/smoke-test.sh

x-consul-common: &consul-common
  build:
    context: .
    dockerfile: Dockerfile
  image: localhost/consul:2.0.2
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - consul-mesh
  environment:
    # container already runs as the consul user; config/certs are read-only mounts
    - CONSUL_DISABLE_PERM_MGMT=true
  command:
    - /bin/sh
    - -c
    - |
      while [ ! -s /consul/certs/dc1-server-consul-0-key.pem ] || [ ! -s /consul/secrets/gossip.json ]; do
        echo 'waiting for TLS certs and gossip key...'; sleep 1
      done
      exec /usr/local/bin/entrypoint.sh agent -config-file=/consul/secrets/gossip.json
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8500/v1/status/leader"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  consul-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/consul:2.0.2
    container_name: consul-init
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -s /consul/certs/dc1-server-consul-0-key.pem ]; then
          cd /consul/certs
          consul tls ca create -domain=consul
          consul tls cert create -server -dc=dc1 -domain=consul
          echo 'generated CA and server certificate'
        fi
        if [ ! -s /consul/secrets/gossip.json ]; then
          printf '{"encrypt": "%s"}\n' "$(consul keygen)" > /consul/secrets/gossip.json
          chmod 600 /consul/secrets/gossip.json
          echo 'generated gossip encryption key'
        fi
    volumes:
      - consul-certs:/consul/certs
      - consul-secrets:/consul/secrets
    networks:
      - consul-mesh

  consul-server1:
    <<: *consul-common
    container_name: consul-server1
    hostname: consul-server1
    ports:
      - "8501:8501"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    volumes:
      - consul-data1:/consul/data
      - consul-certs:/consul/certs:ro
      - consul-secrets:/consul/secrets:ro
      - ./config:/consul/config:ro
    depends_on:
      consul-init:
        condition: service_completed_successfully

  consul-server2:
    <<: *consul-common
    container_name: consul-server2
    hostname: consul-server2
    volumes:
      - consul-data2:/consul/data
      - consul-certs:/consul/certs:ro
      - consul-secrets:/consul/secrets:ro
      - ./config:/consul/config:ro
    depends_on:
      consul-init:
        condition: service_completed_successfully
      consul-server1:
        condition: service_started

  consul-server3:
    <<: *consul-common
    container_name: consul-server3
    hostname: consul-server3
    volumes:
      - consul-data3:/consul/data
      - consul-certs:/consul/certs:ro
      - consul-secrets:/consul/secrets:ro
      - ./config:/consul/config:ro
    depends_on:
      consul-init:
        condition: service_completed_successfully
      consul-server1:
        condition: service_started

networks:
  consul-mesh:
    driver: bridge

volumes:
  consul-data1:
  consul-data2:
  consul-data3:
  consul-certs:
  consul-secrets:
