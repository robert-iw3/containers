---
volumes:
  authentik-postgres:
    driver: local
  authentik-postgres-backups:
    driver: local
  authentik-redis:
    driver: local

networks:
  authentik-frontend:
    driver: bridge
  authentik-backend:
    driver: bridge
    internal: true

x-common: &common
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-authentik-env: &authentik-env
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
  AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}

services:
  postgresql:
    <<: *common
    image: docker.io/library/postgres:17.10
    container_name: postgres-authentik
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - authentik-postgres:/var/lib/postgresql/data:z
    networks:
      - authentik-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    <<: *common
    image: docker.io/library/redis:8.8.0-alpine
    container_name: redis-authentik
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - authentik-redis:/data:z
    networks:
      - authentik-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  server:
    <<: *common
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.5}
    container_name: authentik-server
    command: server
    env_file:
      - .env
    environment:
      <<: *authentik-env
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
      - ./certs:/certs
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - authentik-frontend
      - authentik-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  worker:
    <<: *common
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.5}
    container_name: authentik-worker
    command: worker
    env_file:
      - .env
    environment:
      <<: *authentik-env
      # Outpost management goes through the socket proxy; the docker
      # socket itself is never mounted into the worker.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ./media:/media
      - ./certs:/certs
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - authentik-frontend
      - authentik-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  docker-socket-proxy:
    <<: *common
    image: docker.io/tecnativa/docker-socket-proxy:v0.4.2
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
    volumes:
      - ${SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - authentik-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  backups:
    <<: *common
    image: docker.io/library/postgres:17.10
    container_name: postgres-backups-authentik
    command:
      - sh
      - -c
      - |
        while true; do
          pg_dump | gzip > /backups/authentik-postgres-backup-$(date "+%Y-%m-%d_%H-%M").gz || {
            echo "Backup failed at $(date)"
          }
          find /backups -type f -name '*.gz' -mtime +7 -delete
          sleep 24h
        done
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - authentik-postgres-backups:/backups:Z
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - authentik-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
