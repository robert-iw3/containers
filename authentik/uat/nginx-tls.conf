# TLS terminator in front of authentik's HTTP listener, using the shared
# UAT CA so the browser and the oauth2-proxy relying app trust one cert.
server {
    listen 9443 ssl;
    server_name _;

    ssl_certificate     /etc/tls/tls.crt;
    ssl_certificate_key /etc/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # authentik derives the OIDC issuer from the Host header; keep it as
    # the public host:port so discovery and browser redirects agree.
    location / {
        proxy_pass http://server:9000;
        proxy_set_header Host              localhost:9443;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  localhost:9443;
    }
}
