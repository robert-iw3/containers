# Declarative OAuth2/OIDC provider + application for the UAT mock app.
# Authentik's worker discovers and applies file blueprints on startup;
# the client secret comes from AUTHENTIK_UAT_CLIENT_SECRET via !Env so it
# stays out of the repo.
version: 1
metadata:
  name: UAT OAuth2 mock app
entries:
  # The default authentication flow includes an MFA-validation stage. Set
  # it to skip when the user has no enrolled authenticator so password-only
  # login works (optional MFA). Realistic for a first login; also lets the
  # UAT drive the flow end to end without a TOTP device.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: skip
  - model: authentik_providers_oauth2.oauth2provider
    id: uat-provider
    identifiers:
      name: uat-app
    attrs:
      name: uat-app
      client_type: confidential
      client_id: uat-app
      client_secret: !Env AUTHENTIK_UAT_CLIENT_SECRET
      # grant_types and the scope property_mappings are explicit fields in
      # current authentik; without them the authorize endpoint rejects the
      # request ("Invalid grant_type" / "otherwise malformed").
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://localhost:4185/oauth2/callback
  - model: authentik_core.application
    id: uat-application
    identifiers:
      slug: uat-app
    attrs:
      name: UAT Mock App
      slug: uat-app
      provider: !KeyOf uat-provider
