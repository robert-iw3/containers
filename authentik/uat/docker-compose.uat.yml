# Self-contained UAT stack, TLS end to end:
#   postgres + redis (internal) + authentik server/worker (HTTP internal)
#   + nginx TLS terminator (shared CA) publishing https://localhost:9443
#   + mock relying application: oauth2-proxy (OIDC auth-code flow, HTTPS
#     on 4185) protecting a whoami upstream.
# The OAuth2 provider/application is provisioned by blueprints/uat-app.yaml.
# Secrets come from uat/.env and uat/oauth2-proxy.env; certs from uat/tls.
# All are generated by run-uat.sh.
---
volumes:
  authentik-uat-postgres:
  authentik-uat-redis:

networks:
  authentik-uat:
    driver: bridge

services:
  postgresql:
    image: docker.io/library/postgres:17.10
    container_name: postgres-authentik-uat
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - authentik-uat-postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - authentik-uat

  redis:
    image: docker.io/library/redis:8.8.0-alpine
    container_name: redis-authentik-uat
    security_opt:
      - no-new-privileges:true
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - authentik-uat-redis:/data:z
    networks:
      - authentik-uat

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.5}
    container_name: authentik-server-uat
    security_opt:
      - no-new-privileges:true
    command: server
    env_file:
      - .env
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./blueprints/uat-app.yaml:/blueprints/uat-app.yaml:ro,z
    networks:
      - authentik-uat

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.5}
    container_name: authentik-worker-uat
    security_opt:
      - no-new-privileges:true
    command: worker
    env_file:
      - .env
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./blueprints/uat-app.yaml:/blueprints/uat-app.yaml:ro,z
    networks:
      - authentik-uat

  proxy:
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    container_name: authentik-proxy-uat
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./tls:/etc/tls:ro,z
    ports:
      - '127.0.0.1:9443:9443'
    networks:
      - authentik-uat

  whoami:
    image: docker.io/traefik/whoami:v1.11.0
    container_name: whoami-authentik-uat
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8091:80"
    networks:
      - authentik-uat

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy-authentik-uat
    security_opt:
      - no-new-privileges:true
    network_mode: host
    env_file:
      - oauth2-proxy.env
    volumes:
      - ./tls:/tls:ro,z
    command:
      - --provider=oidc
      - --provider-display-name=authentik UAT
      - --oidc-issuer-url=https://localhost:9443/application/o/uat-app/
      - --provider-ca-file=/tls/ca.crt
      - --redirect-url=https://localhost:4185/oauth2/callback
      - --https-address=:4185
      - --tls-cert-file=/tls/tls.crt
      - --tls-key-file=/tls/tls.key
      - --upstream=http://127.0.0.1:8091
      - --email-domain=*
      - --cookie-secure=true
      - --skip-provider-button=true
      # akadmin's email isn't marked verified in this throwaway UAT.
      - --insecure-oidc-allow-unverified-email=true
