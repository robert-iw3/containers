---
# Apache Flink 2.3 session cluster: one JobManager + scalable TaskManagers.
#
#   docker compose up -d --scale taskmanager=3      # bring up the cluster
#   ./pipelines/run_pipeline.sh pipelines/pipeline_config.yaml   # submit a job
#
# Production knobs (checkpointing, RocksDB state, restart strategy, adaptive
# scheduler) are baked into FLINK_PROPERTIES so the cluster is ready for real,
# continuously-running streaming jobs.
x-flink-common: &flink-common
  image: ${FLINK_IMAGE:-docker.io/library/flink:2.3.0}
  environment: &flink-env
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 4
      jobmanager.memory.process.size: 2048m
      taskmanager.memory.process.size: 4096m
      state.backend.type: rocksdb
      state.backend.incremental: true
      execution.checkpointing.interval: 30s
      execution.checkpointing.mode: EXACTLY_ONCE
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
      restart-strategy.type: exponential-delay
      jobmanager.scheduler: adaptive
      state.checkpoints.dir: file:///tmp/flink-checkpoints
      state.savepoints.dir: file:///tmp/flink-savepoints
      security.ssl.internal.enabled: true
      security.ssl.internal.keystore: /opt/flink/tls/keystore.jks
      security.ssl.internal.truststore: /opt/flink/tls/truststore.jks
      security.ssl.internal.keystore-password: ${FLINK_TLS_PASSWORD:-flink-tls-pass}
      security.ssl.internal.key-password: ${FLINK_TLS_PASSWORD:-flink-tls-pass}
      security.ssl.internal.truststore-password: ${FLINK_TLS_PASSWORD:-flink-tls-pass}
      security.ssl.rest.enabled: true
      security.ssl.rest.keystore: /opt/flink/tls/keystore.jks
      security.ssl.rest.truststore: /opt/flink/tls/truststore.jks
      security.ssl.rest.keystore-password: ${FLINK_TLS_PASSWORD:-flink-tls-pass}
      security.ssl.rest.key-password: ${FLINK_TLS_PASSWORD:-flink-tls-pass}
      security.ssl.rest.truststore-password: ${FLINK_TLS_PASSWORD:-flink-tls-pass}

services:
  jobmanager:
    <<: *flink-common
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
      - ./pipelines:/opt/pipelines:ro
      - ./tls:/opt/flink/tls:ro
    healthcheck:
      # REST SSL is on, so the UI/API is HTTPS (-k for the self-signed cert).
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  taskmanager:
    <<: *flink-common
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
      - ./tls:/opt/flink/tls:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: unless-stopped

volumes:
  flink-checkpoints:
  flink-savepoints:
