# Multi-host Flink 2.3 session cluster. The JobManager runs the REST/UI, RPC, and
# blob server; TaskManager hosts run TaskManagers and scale horizontally. Every
# TaskManager reaches the JobManager over RPC + blob, so flink_advertise_host must
# be reachable cluster-wide.
#
# ansible_host          = the address Ansible SSHes to.
# flink_advertise_host  = the address the JobManager advertises to TaskManagers
#                         (private IP or DNS). Defaults to ansible_host.

[flink_jobmanager]
flink-jm-1 ansible_host=10.0.3.10 flink_advertise_host=10.0.3.10

[flink_taskmanagers]
flink-tm-1 ansible_host=10.0.3.21
flink-tm-2 ansible_host=10.0.3.22
flink-tm-3 ansible_host=10.0.3.23

[flink_cluster:children]
flink_jobmanager
flink_taskmanagers

[flink_cluster:vars]
ansible_user=ubuntu
