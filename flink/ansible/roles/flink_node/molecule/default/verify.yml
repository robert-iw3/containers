---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Both Flink containers are running
      ansible.builtin.command: podman ps --format '{{ "{{" }}.Names{{ "}}" }}'
      register: ps
      changed_when: false
      become: true

    - name: Assert JobManager + TaskManager are up
      ansible.builtin.assert:
        that:
          - "'flink-jobmanager' in ps.stdout"
          - "'flink-taskmanager' in ps.stdout"

    - name: JobManager REST serves HTTPS and the TaskManager registered (retries while it boots)
      ansible.builtin.uri:
        url: "https://127.0.0.1:8081/overview"
        validate_certs: false
        return_content: true
      register: overview
      until: overview.status == 200 and (overview.json.taskmanagers | int) >= 1
      retries: 30
      delay: 10

    - name: Plain HTTP is not served as cleartext (REST SSL on)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/overview"
        status_code: -1
      register: plain
      failed_when: plain.status == 200

    - name: Report registered slots
      ansible.builtin.debug:
        msg: "taskmanagers={{ overview.json.taskmanagers }} slots={{ overview.json['slots-total'] }}"
