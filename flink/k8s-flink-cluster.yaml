---
# Apache Flink 2.3 session cluster on Kubernetes: one JobManager + an autoscaled
# TaskManager pool, with internal (JM<->TM) and REST TLS.
#
# Shared Flink config lives in the flink-config ConfigMap (FLINK_PROPERTIES), pulled
# by both Deployments -- including jobmanager.rpc.address, which the TaskManagers
# need to find the JobManager.
#
# Before applying, create the TLS keystore Secret:
#   bash tls/gen_flink_tls.sh tls flink-tls-pass
#   kubectl create secret generic flink-tls -n flink \
#     --from-file=keystore.jks=tls/keystore.jks \
#     --from-file=truststore.jks=tls/truststore.jks
apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: flink
data:
  # Appended to config.yaml by the image entrypoint. Passwords are demo values --
  # for production supply them via a Secret / external secret store.
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    blob.server.port: 6124
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 4
    jobmanager.memory.process.size: 2048m
    taskmanager.memory.process.size: 4096m
    state.backend.type: rocksdb
    state.backend.incremental: true
    execution.checkpointing.interval: 30s
    execution.checkpointing.mode: EXACTLY_ONCE
    restart-strategy.type: exponential-delay
    jobmanager.scheduler: adaptive
    security.ssl.internal.enabled: true
    security.ssl.internal.keystore: /opt/flink/tls/keystore.jks
    security.ssl.internal.truststore: /opt/flink/tls/truststore.jks
    security.ssl.internal.keystore-password: flink-tls-pass
    security.ssl.internal.key-password: flink-tls-pass
    security.ssl.internal.truststore-password: flink-tls-pass
    security.ssl.rest.enabled: true
    security.ssl.rest.keystore: /opt/flink/tls/keystore.jks
    security.ssl.rest.truststore: /opt/flink/tls/truststore.jks
    security.ssl.rest.keystore-password: flink-tls-pass
    security.ssl.rest.key-password: flink-tls-pass
    security.ssl.rest.truststore-password: flink-tls-pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  replicas: 1
  selector:
    matchLabels: {app: flink, component: jobmanager}
  template:
    metadata:
      labels: {app: flink, component: jobmanager}
    spec:
      securityContext: {runAsUser: 9999, runAsGroup: 9999, fsGroup: 9999}
      containers:
      - name: jobmanager
        image: docker.io/library/flink:2.3.0
        args: ["jobmanager"]
        env:
        - name: FLINK_PROPERTIES
          valueFrom:
            configMapKeyRef: {name: flink-config, key: FLINK_PROPERTIES}
        ports:
        - {containerPort: 8081, name: rest}
        - {containerPort: 6123, name: rpc}
        - {containerPort: 6124, name: blob}
        volumeMounts:
        - {name: tls, mountPath: /opt/flink/tls, readOnly: true}
        livenessProbe:
          httpGet: {path: /overview, port: 8081, scheme: HTTPS}
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet: {path: /overview, port: 8081, scheme: HTTPS}
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests: {cpu: "1", memory: "2Gi"}
          limits: {cpu: "2", memory: "4Gi"}
      volumes:
      - {name: tls, secret: {secretName: flink-tls}}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  selector: {app: flink, component: jobmanager}
  ports:
  - {name: rest, port: 8081, targetPort: 8081}
  - {name: rpc, port: 6123, targetPort: 6123}
  - {name: blob, port: 6124, targetPort: 6124}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: flink
spec:
  # Baseline; the HPA below scales this on CPU.
  replicas: 2
  selector:
    matchLabels: {app: flink, component: taskmanager}
  template:
    metadata:
      labels: {app: flink, component: taskmanager}
    spec:
      securityContext: {runAsUser: 9999, runAsGroup: 9999, fsGroup: 9999}
      containers:
      - name: taskmanager
        image: docker.io/library/flink:2.3.0
        args: ["taskmanager"]
        env:
        - name: FLINK_PROPERTIES
          valueFrom:
            configMapKeyRef: {name: flink-config, key: FLINK_PROPERTIES}
        volumeMounts:
        - {name: tls, mountPath: /opt/flink/tls, readOnly: true}
        resources:
          requests: {cpu: "1", memory: "2Gi"}
          limits: {cpu: "2", memory: "4Gi"}
      volumes:
      - {name: tls, secret: {secretName: flink-tls}}
---
# CPU-based TaskManager autoscaling. Flink's own reactive/adaptive scheduler will
# spread work onto new TaskManagers as they register. (For job-aware scaling, the
# Flink Kubernetes Operator's autoscaler is the richer option.)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flink-taskmanager
  namespace: flink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flink-taskmanager
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - {type: Pods, value: 1, periodSeconds: 120}
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - {type: Pods, value: 2, periodSeconds: 60}
