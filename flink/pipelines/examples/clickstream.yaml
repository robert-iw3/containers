# A completely different data shape than the telemetry example -- web clickstream
# with a sliding (hop) window and different aggregations -- handled by the same
# generator with zero code changes. Run it with:
#   ./pipelines/run_pipeline.sh pipelines/examples/clickstream.yaml
name: clickstream_stream

source:
  connector: datagen
  options:
    rows-per-second: "5000"

schema:
  columns:
    - {name: user_id,    type: "INT",    datagen: {kind: random, min: 1,   max: 5000}}
    - {name: page_id,    type: "INT",    datagen: {kind: random, min: 1,   max: 20}}
    - {name: latency_ms, type: "DOUBLE", datagen: {kind: random, min: 5.0, max: 800.0}}
    - {name: bytes_sent, type: "BIGINT", datagen: {kind: random, min: 200, max: 2000000}}
  time_attribute: processing

key_by: [page_id]

window:
  type: hop                    # sliding window
  size: "30 SECONDS"
  slide: "10 SECONDS"

aggregations:
  - {field: latency_ms, funcs: [avg, max, stddev_pop]}
  - {field: bytes_sent, funcs: [sum, count]}

anomaly:
  field: latency_ms
  method: zscore
  threshold: 3.0

sink:
  connector: print
