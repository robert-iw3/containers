flink_version: "2.3.0"
namespace: "flink"
container_engine: "podman"      # docker | podman
deployment:
  method: "compose"             # compose | kubernetes | ansible
security:
  enable_tls: true              # generate cert material with tls/gen_flink_tls.sh
cluster:
  taskmanager_slots: 4
  parallelism: 4
  taskmanager_replicas: 3       # compose --scale / k8s baseline
monitoring:
  prometheus_enabled: true
  metrics_port: 9249
