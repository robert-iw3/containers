---
# Deploy the Neo4j GraphRAG + Keycloak + OpenWebUI stack to a single host as a
# podman-compose project. Syncs the stack, renders .env + the Keycloak realm
# from stack.yaml, installs TLS material, builds the local GraphRAG image and
# brings everything up.
#
#   ansible-playbook -i inventory.ini deploy.yml
#
# TLS: place tls.crt / tls.key / ca.crt in files/tls/ (see files/tls/README.md).

- name: Deploy Neo4j GraphRAG stack
  hosts: neo4j_rag
  become: true
  vars:
    stack_src: "{{ playbook_dir }}/.."
    compose: "podman-compose -p neo4j-stack --env-file {{ install_dir }}/.env -f {{ install_dir }}/docker-compose.yml"
  tasks:
    - name: Install container runtime and tooling
      ansible.builtin.package:
        name:
          - podman
          - podman-compose
          - python3-pyyaml
          - openssl
        state: present

    - name: Ensure install and TLS directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ install_dir }}"
        - /etc/ssl/neo4j-stack

    - name: Sync the stack to the target (excluding rendered secrets)
      ansible.posix.synchronize:
        src: "{{ stack_src }}/"
        dest: "{{ install_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=tls"
          - "--exclude=.demo-password"
          - "--exclude=keycloak/realm-neo4j.json"
          - "--exclude=__pycache__"

    - name: Install TLS material into the stack TLS dir
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/etc/ssl/neo4j-stack/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ tls_src_dir }}/tls.crt", dest: "tls.crt", mode: "0644" }
        - { src: "{{ tls_src_dir }}/tls.key", dest: "tls.key", mode: "0640" }
        - { src: "{{ tls_src_dir }}/ca.crt", dest: "ca.crt", mode: "0644" }

    - name: Seed secrets from Vault into stack.yaml (only when provided)
      ansible.builtin.replace:
        path: "{{ install_dir }}/stack.yaml"
        regexp: '^(\s+{{ item.key }}:) ""$'
        replace: '\1 "{{ item.value }}"'
      loop:
        - { key: keycloak_admin_password, value: "{{ keycloak_admin_password }}" }
        - { key: keycloak_db_password, value: "{{ keycloak_db_password }}" }
        - { key: openwebui_db_password, value: "{{ openwebui_db_password }}" }
        - { key: webui_secret_key, value: "{{ webui_secret_key }}" }
        - { key: oauth_client_secret, value: "{{ oauth_client_secret }}" }
        - { key: neo4j_password, value: "{{ neo4j_password }}" }
        - { key: graphrag_api_key, value: "{{ graphrag_api_key }}" }
        - { key: demo_password, value: "{{ demo_password }}" }
      when: item.value | length > 0
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Render .env and the Keycloak realm from stack.yaml
      ansible.builtin.command:
        cmd: sh scripts/render.sh
        chdir: "{{ install_dir }}"
        creates: "{{ install_dir }}/.env"

    - name: Build the local GraphRAG image
      ansible.builtin.command:
        cmd: "{{ compose }} build graphrag"
        chdir: "{{ install_dir }}"
      changed_when: true

    - name: Bring the stack up
      ansible.builtin.command:
        cmd: "{{ compose }} up -d"
        chdir: "{{ install_dir }}"
      changed_when: true

    - name: Wait for OpenWebUI to answer through the proxy
      ansible.builtin.uri:
        url: "https://{{ lookup('ansible.builtin.ini', 'APP_HOST type=properties file=' + install_dir + '/.env') }}:8443/health"
        validate_certs: false
        status_code: 200
      register: owui
      retries: 30
      delay: 10
      until: owui.status == 200
