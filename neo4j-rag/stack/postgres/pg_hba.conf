# Host-based access control. Every connection authenticates with
# SCRAM-SHA-256; there is no trust/peer shortcut. Remote access is scoped to
# the stack's private container subnet.
#
# TYPE  DATABASE  USER  ADDRESS          METHOD
local   all       all                    scram-sha-256
host    all       all   127.0.0.1/32     scram-sha-256
host    all       all   ::1/128          scram-sha-256
# Stack private subnet — must match the compose network (NET_SUBNET). Keep in
# sync with stack.yaml; PostgreSQL does not interpolate variables here.
host    all       all   172.31.30.0/24   scram-sha-256
