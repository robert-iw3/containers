---
# Cribl Stream, one leader and N workers.
#
#   cp .env.example .env      set CRIBL_DIST_TOKEN before the first start
#   podman compose up -d
#   podman compose up -d --scale workers=3
#
# Configuration is FILES, not environment variables. Cribl reads Sources and
# Destinations from $CRIBL_HOME/local/cribl; it has no CRIBL_SPLUNK,
# CRIBL_ELASTIC or CRIBL_HEC variable, so setting those configures nothing
# while the stack still boots and reports healthy. Worker-group config lives
# under leader-config/groups/<group>/ and the leader distributes it.
#
# CRIBL_VOLUME_DIR is deliberately NOT set. It relocates CRIBL_HOME, so
# setting it to the same path a config volume is mounted at yields a doubled
# local/local/cribl and orphans the state volume.
#
# Workers publish no host ports. Fixed host ports are what stops `--scale
# workers=2` from starting a second container; reach the workers over the
# `data` network, or put a proxy in front.

x-cribl-common: &cribl-common
  image: ${CRIBL_IMAGE:-docker.io/cribl/cribl:4.19.2}
  networks: ['data']
  security_opt: ['no-new-privileges:true']
  # unless-stopped, not on-failure: the image's PID 1 waits on `sleep
  # infinity`, so a dead Cribl never exits non-zero and on-failure never
  # fires. The healthcheck is what tells you it died.
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:9000/api/v1/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s

services:

  leader:
    <<: *cribl-common
    container_name: cribl-leader
    hostname: leader
    environment:
      CRIBL_DIST_MODE: leader
      # No default: this token authenticates the channel that carries the
      # whole config bundle, every Destination credential included. Cribl's
      # own default is public knowledge.
      CRIBL_DIST_LEADER_URL: tcp://${CRIBL_DIST_TOKEN:?set CRIBL_DIST_TOKEN in .env}@0.0.0.0:4200
    volumes:
      # Config as files, the same shape the demo stack uses. Cribl writes
      # auth/, groups.yml and cribl.inited back into these, so they are
      # read-write and their runtime output is gitignored.
      #
      # Two mounts, because a worker group's config does NOT live under the
      # leader's own config directory. The leader reads its own from
      # local/cribl, and each group's from groups/<name>/local/cribl - files
      # placed at local/cribl/groups/<name>/ are silently ignored.
      - ./leader-config:/opt/cribl/local/cribl:Z
      - ./group-default:/opt/cribl/groups/default/local/cribl:Z
      - cribl_leader_state:/opt/cribl/state:Z
      - ./certs:/opt/cribl/certs:ro,Z
    ports:
      # Bound to the loopback: the UI's first-boot credentials are admin/admin.
      - "127.0.0.1:${CRIBL_UI_PORT:-19000}:9000"
    deploy:
      resources:
        limits:
          cpus: "${LEADER_CPUS:-2}"
          memory: ${LEADER_MEMORY:-4g}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cribl.rule=Host(`cribl.local`)"
      - "traefik.http.services.cribl.loadbalancer.server.port=9000"

  workers:
    <<: *cribl-common
    hostname: worker
    depends_on:
      leader:
        condition: service_healthy
    environment:
      CRIBL_DIST_MODE: worker
      CRIBL_DIST_LEADER_URL: tcp://${CRIBL_DIST_TOKEN:?set CRIBL_DIST_TOKEN in .env}@leader:4200
    volumes:
      # No config mount: a worker receives its configuration from the leader.
      # Mounting config here would be overwritten on the first bundle.
      #
      # And NO volume on /opt/cribl/state either. A worker applies a config
      # bundle by renaming state/distributed/bundles/<id>/local/cribl over
      # /opt/cribl/local/cribl. A volume makes those two different
      # filesystems, rename(2) fails with EXDEV, the apply AND the revert both
      # fail, and the worker keeps a stale config-update lock forever - while
      # its healthcheck still passes and it reports healthy to the leader.
      # Worker state is disposable; the config comes from the leader.
      - ./certs:/opt/cribl/certs:ro,Z
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"
          memory: ${WORKER_MEMORY:-4g}

networks:
  data:
    driver: bridge

volumes:
  cribl_leader_state:
