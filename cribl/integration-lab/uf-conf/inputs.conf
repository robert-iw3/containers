# What the forwarder tails. One stanza per source so the sourcetype is assigned
# at the edge, which is where Splunk expects it and what the routes downstream
# key off.
#
# index is enterprise_raw here: this is the value the DIRECT copy carries into
# Splunk. The copy that goes through Cribl has its index overwritten by the
# pipelines, so the same forwarder feeds both arms of the comparison.

[default]
host = uf-collector
index = enterprise_raw

[monitor:///logs/win_security.log]
sourcetype = XmlWinEventLog:Security
source = WinEventLog:Security

[monitor:///logs/win_system.log]
sourcetype = XmlWinEventLog:System
source = WinEventLog:System

[monitor:///logs/win_dns.log]
sourcetype = XmlWinEventLog:Microsoft-Windows-DNS-Server/Analytical
source = WinEventLog:Microsoft-Windows-DNS-Server/Analytical

[monitor:///logs/win_dhcp.log]
sourcetype = DhcpSrvLog
source = DhcpSrvLog

[monitor:///logs/sysmon.log]
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
source = WinEventLog:Microsoft-Windows-Sysmon/Operational

[monitor:///logs/pan_firewall.log]
sourcetype = pan:traffic
source = pan_fw01

[monitor:///logs/cisco_asa.log]
sourcetype = cisco:asa
source = asa-vpn-01

[monitor:///logs/asa_vpn.log]
sourcetype = cisco:asa
source = asa-vpn-01

[monitor:///logs/cisco_ise.log]
sourcetype = cisco:ise:syslog
source = ise-psn-01

[monitor:///logs/suricata.log]
sourcetype = suricata
source = /var/log/suricata/eve.json

[monitor:///logs/netflow.log]
sourcetype = cisco:netflow
source = netflow:9995

[monitor:///logs/proxy.log]
sourcetype = squid:access
source = /var/log/squid/access.log

[monitor:///logs/web_access.log]
sourcetype = access_combined
source = /var/log/nginx/access.log

[monitor:///logs/kube_stdout.log]
sourcetype = kube:container:app
source = /var/log/containers

[monitor:///logs/linux_audit.log]
sourcetype = linux_secure
source = /var/log/secure

[monitor:///logs/entra_signin.log]
sourcetype = azure:aad:signin
source = graph:signIns
