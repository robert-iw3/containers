# The forwarder's default throughput limit is 256 KBps per ingestion pipeline.
# On a domain controller that is about a quarter of what the host generates, so
# the channel backlog never drains and every dashboard still reads green.
#
# 0 is unlimited. In production, set a tier-appropriate ceiling instead - the
# point is to set it deliberately rather than inherit 256.
[thruput]
maxKBps = 0
