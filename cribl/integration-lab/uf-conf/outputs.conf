# The forwarder sends the same events to two places.
#
# defaultGroup naming BOTH groups clones every event to each: Splunk itself
# performs the A/B tee, so both arms travel the identical transport and the
# comparison is not confounded by the way each side was sent.
#
# useACK is deliberately absent. Cribl's Splunk (S2S) Source implements no
# indexer acknowledgment at all - acknowledgment in Cribl is a HEC-family
# feature - so a forwarder set to useACK = true against Cribl waits for an ack
# that is never coming. The durability boundary is Cribl's Destination queue.

[tcpout]
defaultGroup = to_cribl, to_splunk_direct
# The default of -1 blocks rather than dropping when a queue fills. Keep it:
# back-pressure has to reach the input, and a forwarder that drops silently
# looks exactly like a quiet host.
dropEventsOnQueueFull = -1
maxQueueSize = 64MB

[tcpout:to_cribl]
server = cribl-worker:9997
clientCert = /opt/splunk/etc/auth/mycerts/splunkuf-bundle.pem
sslRootCAPath = /opt/splunk/etc/auth/mycerts/ca.crt
sslVerifyServerCert = true
sslCommonNameToCheck = cribl-worker
sslVersions = tls1.2, tls1.3
# The Splunk Source rejects compressed connections unless it is set to accept
# them; compress = automatic on the Cribl side is what makes this safe.
compressed = false

[tcpout:to_splunk_direct]
server = splunk:9997
clientCert = /opt/splunk/etc/auth/mycerts/splunkuf-bundle.pem
sslRootCAPath = /opt/splunk/etc/auth/mycerts/ca.crt
sslVerifyServerCert = true
sslCommonNameToCheck = splunk
sslVersions = tls1.2, tls1.3
compressed = false
