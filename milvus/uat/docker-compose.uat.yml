---
# UAT runner for the Milvus stack. Joins the running stack's network.
# Run via ./run-uat.sh (it sequences the two phases around a restart).

services:
  uat-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/milvus-uat:latest
    container_name: milvus-uat-runner
    env_file:
      - ../.env
    environment:
      - MILVUS_URI=http://milvus:19530
    networks:
      - milvus

networks:
  milvus:
    external: true
    name: milvus_milvus
