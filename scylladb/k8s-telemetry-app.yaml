---
# Stateless telemetry tier that any app/frontend connects to, with real
# autoscaling. ScyllaDB itself is stateful and scales by adjusting the
# ScyllaCluster rack `members` (the operator adds nodes and streams data —
# see k8s-scylladb.yaml and the readme); the API tier below autoscales on load
# via an HPA, which is where request-driven elasticity belongs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: scylla
  labels: {app: telemetry-api}
spec:
  replicas: 3
  selector:
    matchLabels: {app: telemetry-api}
  template:
    metadata:
      labels: {app: telemetry-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/arcanaeum/scylladb-telemetry-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: SCYLLA_CONTACT_POINTS
              value: "scylla-client.scylla.svc.cluster.local"
            - name: SCYLLA_KEYSPACE
              value: "telemetry"
            - name: SCYLLA_LOCAL_DC
              value: "us-east-1"
            - name: SCYLLA_USERNAME
              valueFrom: {secretKeyRef: {name: scylla-secret, key: username}}
            - name: SCYLLA_PASSWORD
              valueFrom: {secretKeyRef: {name: scylla-secret, key: root-password}}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  namespace: scylla
spec:
  selector: {app: telemetry-api}
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetry-api
  namespace: scylla
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 75}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - {type: Percent, value: 100, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 25, periodSeconds: 60}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-etl
  namespace: scylla
  labels: {app: telemetry-etl}
spec:
  replicas: 1   # single roller; partition the bucket space to run more
  selector:
    matchLabels: {app: telemetry-etl}
  template:
    metadata:
      labels: {app: telemetry-etl}
    spec:
      containers:
        - name: etl
          image: ghcr.io/arcanaeum/scylladb-telemetry-etl:latest
          env:
            - name: SCYLLA_CONTACT_POINTS
              value: "scylla-client.scylla.svc.cluster.local"
            - name: SCYLLA_KEYSPACE
              value: "telemetry"
            - name: ETL_INTERVAL_SECONDS
              value: "60"
            - name: SCYLLA_USERNAME
              valueFrom: {secretKeyRef: {name: scylla-secret, key: username}}
            - name: SCYLLA_PASSWORD
              valueFrom: {secretKeyRef: {name: scylla-secret, key: root-password}}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
